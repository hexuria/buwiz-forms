[package]
name = "nsh-app-ebirforms"
version = "0.2.1"
edition = "2024"
publish = false

# Its own workspace, as the retired shell's was: the root workspace (and its Cargo.lock) never sees this crate.
[workspace]

# Every nsh-* crate comes from the one NSH checkout, by path (the hexuria/nsh fork, branch buwiz-next, NSH 0.6.1; the pin is NSH_PINNED_REF in .github/workflows/nsh.yml).
# The checkout is a SIBLING of the buwiz-forms checkout: <parent>/buwiz-forms and <parent>/nsh, so from this folder it is ../../nsh.
# The worktree layout (features/nsh-tsx/{buwiz-forms,nsh}) and CI (.github/workflows/nsh.yml) both follow it. The nsh CLI takes
# the source from these paths (`cargo metadata` makes them absolute), so relative paths work with nsh check/build/test/run.
# Never mix sources: a version or source mismatch is a cargo error. See nsh/AGENTS.md and docs/platforms/nsh.md.
[dependencies]
nsh-core = { path = "../../nsh/crates/nsh-core" }

# The door: the UI-free host functions of the Rust brain, in plain SQLite (no sqlcipher, no database key).
# default-features = false is what keeps SQLCipher out; the gate is
# `cargo tree -e features -i libsqlite3-sys --manifest-path nsh/Cargo.toml` (no bundled-sqlcipher).
bir-app-api = { path = "../crates/bir-app-api", default-features = false }
bir-core = { path = "../crates/bir-core", default-features = false }
# Object keys keep their order (the host functions rely on it); bir-app-api turns it on, this states it.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
# Print preview (src/print.rs): the PDF is made from the same sheet as the printer gets; bir-print merges the pages.
bir-print = { path = "../crates/bir-print", default-features = false }
lopdf = "0.34"
uuid = { version = "1.29.2", features = ["v4"] }
# Agent remote control (feature `agent`, off by default): the gpui-agent protocol at the one version bir-app-api and bir-mcp use.
gpui-agent = { version = "=0.5.0", optional = true }

# The build script reads nsh.json window.title into APP_WINDOW_TITLE (src/os_login.rs, PLAN W4).
[build-dependencies]
serde_json = "1"

# The database guard asks the password database (getpwuid_r) for the account's home folder, never $HOME.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# The window's own control plane on Android is the plug's nsh-gpui-agent-android crate, linked for the
# constructor it self-installs with; same rev as the other platform crates.
nsh-gpui-agent-android = { git = "https://github.com/hexuria/nsh-gpui-agent", rev = "db0e4ac6127078a05751149f0ec6bed68204f911", optional = true }

# The database guard on Windows: the account's profile folder from its token (GetUserProfileDirectoryW), never
# USERPROFILE, and a file or folder known by volume and file index (GetFileInformationByHandle). The version the lock
# already holds.
# The print preview's sheets as pictures (src/sheets.rs): Blitz lays the static sheet HTML out and vello_cpu paints it
# on the CPU, so the preview needs no web view and no GPU. The versions the retired app used.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
blitz-dom = "=0.3.0-beta.3"
blitz-html = "=0.3.0-beta.3"
blitz-paint = "=0.3.0-beta.3"
blitz-traits = "=0.3.0-beta.3"
anyrender = "0.14"
anyrender_vello_cpu = { version = "0.18", features = ["multithreading"] }
peniko = "0.6"
base64 = "0.22"
png = "0.17"

# Print and Save as PDF on Linux (src/print.rs): WebKitGTK's print operation on GTK's main thread, the GTK and WebKit
# nsh's Linux backend links (the versions of nsh's workspace, so one copy of each is built).
[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
webkit6 = "0.6"
# The window's own control plane on Linux is the plug's, in nsh-gpui-agent-linux: the same surface hook as the
# macOS crate, a development listener gated on GPUI_AGENT=1 (there is no in-process server feature on this crate).
# Every platform dep must name the same rev or the plug's shared crates (nsh-gpui-agent, nsh-agent-actions)
# resolve twice.
nsh-gpui-agent-linux = { git = "https://github.com/hexuria/nsh-gpui-agent", rev = "db0e4ac6127078a05751149f0ec6bed68204f911", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell"] }
# Print preview on Windows (src/print.rs): a hidden WebView2 of the app's own makes the PDF (PrintToPdf) and prints
# (Print) after the system's print dialog (PrintDlgEx). The versions nsh's Windows backend uses.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }
# Windows Hello for "Use this computer's login" (src/os_login/windows.rs): the IAsyncOperation the interop call
# returns lives in windows-future, which windows 0.62 uses but does not re-export.
windows-future = "0.3"
# The window's own control plane on Windows is the plug's, in nsh-gpui-agent-windows; same rev as the other
# platform crates.
nsh-gpui-agent-windows = { git = "https://github.com/hexuria/nsh-gpui-agent", rev = "db0e4ac6127078a05751149f0ec6bed68204f911", optional = true }

# Touch ID / the account password and Windows Hello (admin recovery, `mac_login`): the old host's crate and version
# (the retired shell's Cargo.toml). Used by src/auth.rs.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
robius-authentication = { version = "0.1.1", features = ["async"] }

# Print preview on macOS (src/print.rs): the hidden WKWebView that makes the PDF and the system print panel, reached
# through objc2 as the reference app and nsh do (same versions as nsh's workspace).
# The PDF of the print preview (src/print.rs): a hidden WKWebView on macOS and iOS; PDFKit (macOS) or
# UIPrintInteractionController (iOS) prints it.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSData", "NSArray", "NSGeometry", "NSError"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
# The device owner check, `.deviceOwnerAuthentication` in the system's own sheet (src/os_login/apple.rs): LAContext
# and LAError only. robius-authentication's 0.2 copy goes when B3 removes `mac_login`.
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }

# CGRect for the hidden web view on iOS (objc2-foundation names it NSRect on macOS only). Already in the lock.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CFCGTypes"] }
# The window's own control plane on iOS is the plug's `nsh-gpui-agent` crate's ios feature (the driver lives in
# the shared crate; same rev as the other platform crates).
nsh-gpui-agent = { git = "https://github.com/hexuria/nsh-gpui-agent", rev = "db0e4ac6127078a05751149f0ec6bed68204f911", features = ["ios"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The window's own control plane (semantic tree, press, type, paste, scroll, screenshot) is the plug's, in
# nsh-gpui-agent-macos: its default `dev-agent`, the strict adapter every other platform uses (a debug build only,
# which nsh-run-agent is). Not `gpui-agent-server`, the older in-process listener: it lists no `press`, `paste` or
# `scroll`, and each `type` or `key` presses the box again, which moved the caret in a filled money box. Only under
# `agent`; see nsh/AGENTS.md "Agent remote control". The plug's NSH pin is redirected to this app's checkout by the
# [patch] below.
nsh-gpui-agent-macos = { git = "https://github.com/hexuria/nsh-gpui-agent", rev = "db0e4ac6127078a05751149f0ec6bed68204f911", optional = true }

[features]
default = []
mas_build = ["bir-app-api/mas_build", "bir-core/mas_build"]
# Agent remote control, as the old app (`bir --features agent`): the shared gpui-agent session over a loopback listener,
# and the plug's window control plane on every native platform. Compiled in only here; the listener still needs GPUI_AGENT=1 (see src/agent.rs).
agent = ["bir-app-api/agent", "dep:gpui-agent", "dep:nsh-gpui-agent-macos", "dep:nsh-gpui-agent-linux", "dep:nsh-gpui-agent-windows", "dep:nsh-gpui-agent", "dep:nsh-gpui-agent-android"]

# One NSH per build: the plug declares its nsh-* crates as git dependencies on hexuria/nsh, and cargo treats the
# same crate from two sources as two different crates. Redirect every nsh-* the plug pulls to this app's own
# checkout (the sibling ../nsh at the pin, which has every door the plug's NSH branch `gpui-agent` has). Keep this
# list covering every nsh-* git dependency of the plug. nsh carries this table into the workspace it generates
# (nsh/.nsh/rust), which is a workspace root of its own and would otherwise build the Git copy as well.
[patch."https://github.com/hexuria/nsh"]
nsh-core = { path = "../../nsh/crates/nsh-core" }
nsh-dev = { path = "../../nsh/crates/nsh-dev" }
nsh-testing = { path = "../../nsh/crates/nsh-testing" }
nsh-base = { path = "../../nsh/crates/nsh-base" }
nsh-cli = { path = "../../nsh/crates/nsh-cli" }
nsh-ios-host = { path = "../../nsh/crates/nsh-ios-host" }
nsh-linux-host = { path = "../../nsh/crates/nsh-linux-host" }
nsh-macos-host = { path = "../../nsh/crates/nsh-macos-host" }
nsh-windows-host = { path = "../../nsh/crates/nsh-windows-host" }
nsh-platform-android = { path = "../../nsh/crates/nsh-platform-android" }
nsh-platform-ios = { path = "../../nsh/crates/nsh-platform-ios" }
nsh-platform-linux = { path = "../../nsh/crates/nsh-platform-linux" }
nsh-platform-macos = { path = "../../nsh/crates/nsh-platform-macos" }
nsh-platform-windows = { path = "../../nsh/crates/nsh-platform-windows" }

[dev-dependencies]
# Tests keep out of the real data folder and keychain (bir-core's test-build rule).
bir-core = { path = "../crates/bir-core", default-features = false, features = ["test-support"] }
futures = "0.3"
temp-env = "0.3"
tempfile = "3"
