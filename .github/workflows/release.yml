name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: eBIRForms

jobs:
  # ── macOS Universal ───────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-14  # M1 runner — can build both arm64 and x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build ARM64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p target/release-artifacts
          lipo -create \
            target/aarch64-apple-darwin/release/bir \
            target/x86_64-apple-darwin/release/bir \
            -output target/release-artifacts/bir
          lipo -create \
            target/aarch64-apple-darwin/release/bir-daemon \
            target/x86_64-apple-darwin/release/bir-daemon \
            -output target/release-artifacts/bir-daemon
          chmod +x target/release-artifacts/bir target/release-artifacts/bir-daemon

      - name: Create .app Bundle
        run: |
          APP="target/release-artifacts/${{ env.APP_NAME }}.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp target/release-artifacts/bir "$APP/Contents/MacOS/"
          cp target/release-artifacts/bir-daemon "$APP/Contents/MacOS/"
          cp -R assets "$APP/Contents/Resources/"
          cp -R formtypes "$APP/Contents/Resources/"

          VERSION="${GITHUB_REF_NAME#v}"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>bir</string>
            <key>CFBundleIdentifier</key><string>dev.goldcoders.bir</string>
            <key>CFBundleName</key><string>${{ env.APP_NAME }}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleIconFile</key><string>AppIcon</string>
          </dict>
          </plist>
          EOF

      - name: Codesign
        if: env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Import certificate into temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Sign the .app bundle
          APP="target/release-artifacts/${{ env.APP_NAME }}.app"
          codesign --deep --force --options runtime \
            --sign "Developer ID Application: Goldcoders Corp ($APPLE_TEAM_ID)" \
            --entitlements scripts/entitlements.plist \
            "$APP"

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="target/release-artifacts/${{ env.APP_NAME }}.app"

          # Try create-dmg, fallback to hdiutil
          if command -v create-dmg >/dev/null 2>&1; then
            create-dmg \
              --volname "${{ env.APP_NAME }}" \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "${{ env.APP_NAME }}.app" 150 190 \
              --app-drop-link 450 190 \
              "target/release-artifacts/${{ env.APP_NAME }}-macOS-universal-${VERSION}.dmg" \
              "$APP"
          else
            hdiutil create -volname "${{ env.APP_NAME }}" \
              -srcfolder "$APP" \
              -ov -format UDZO \
              "target/release-artifacts/${{ env.APP_NAME }}-macOS-universal-${VERSION}.dmg"
          fi

      - name: Notarize DMG
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="target/release-artifacts/${{ env.APP_NAME }}-macOS-universal-${VERSION}.dmg"

          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$DMG"

      - name: Fallback to ZIP (if no DMG)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="target/release-artifacts/${{ env.APP_NAME }}-macOS-universal-${VERSION}.dmg"
          if [ ! -f "$DMG" ]; then
            cd target/release-artifacts
            zip -r "${{ env.APP_NAME }}-macOS-universal-${VERSION}.zip" "${{ env.APP_NAME }}.app"
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            target/release-artifacts/*.dmg
            target/release-artifacts/*.zip

  # ── Windows ──────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Windows Dependencies
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          $PKG = "target/release-artifacts/${{ env.APP_NAME }}-Windows-x64-${VERSION}"
          New-Item -ItemType Directory -Force -Path $PKG
          Copy-Item "target/x86_64-pc-windows-msvc/release/bir.exe" "$PKG/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/bir-daemon.exe" "$PKG/"
          Copy-Item -Recurse "assets" "$PKG/"
          Copy-Item -Recurse "formtypes" "$PKG/"
          Compress-Archive -Path "$PKG" -DestinationPath "target/release-artifacts/${{ env.APP_NAME }}-Windows-x64-${VERSION}.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: target/release-artifacts/*.zip

  # ── Linux ────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-client0 \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libssl-dev \
            libpolkit-gobject-1-dev \
            mesa-vulkan-drivers

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Create .deb Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cargo deb -p bir-desktop --no-build --target x86_64-unknown-linux-gnu \
            -o "target/release-artifacts/${{ env.APP_NAME }}-Linux-x64-${VERSION}.deb"

      - name: Create Tarball Fallback
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="target/release-artifacts/${{ env.APP_NAME }}-Linux-x64-${VERSION}"
          mkdir -p "$PKG"
          cp target/x86_64-unknown-linux-gnu/release/bir "$PKG/"
          cp target/x86_64-unknown-linux-gnu/release/bir-daemon "$PKG/"
          cp -R assets "$PKG/"
          cp -R formtypes "$PKG/"
          cd target/release-artifacts
          tar czf "${{ env.APP_NAME }}-Linux-x64-${VERSION}.tar.gz" \
            "${{ env.APP_NAME }}-Linux-x64-${VERSION}"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            target/release-artifacts/*.deb
            target/release-artifacts/*.tar.gz

  # ── Create GitHub Release ───────────────────────────────────────────────
  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.tar.gz
