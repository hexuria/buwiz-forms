name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Serialise per tag, but never cancel: a release job that is signing, notarizing
# or publishing must be allowed to finish. This only prevents the same tag being
# built concurrently (for example on a re-push), which is why cancel-in-progress
# is false here and true in ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  APP_NAME: eBIRForms
  # bir-core compiles Google's OAuth client in (option_env!). No build carries it unless the repository variable
  # STORE_GMAIL is exactly 1 (owner, 2026-11-28: 1.0.0 ships no Google client; the name predates it governing every
  # build). Gmail sign-in returns after 1.0.0 with native clients that hold no secret, and this switch's
  # secret-passing "on" branch is removed then.
  GOOGLE_CLIENT_ID: ${{ vars.STORE_GMAIL == '1' && secrets.GOOGLE_CLIENT_ID || '' }}
  GOOGLE_CLIENT_SECRET: ${{ vars.STORE_GMAIL == '1' && secrets.GOOGLE_CLIENT_SECRET || '' }}

jobs:
  # The public release jobs may consume only this exact, tested tag commit.
  # A successful branch workflow is not accepted as a substitute because the
  # tag may point at a different SHA.
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tagged SHA, version, and lockfiles
        id: version
        shell: bash
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git ls-files --error-unmatch Cargo.lock package-lock.json
          NSH_VERSION="$(python3 -c 'import json; print(json.load(open("nsh/nsh.json"))["version"])')"
          test -n "$NSH_VERSION"
          echo "version=$NSH_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_TYPE" = "tag"
            test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
            test "$(git tag --points-at "$GITHUB_SHA" --list "$GITHUB_REF_NAME")" = "$GITHUB_REF_NAME"
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must use exact vMAJOR.MINOR.PATCH syntax: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$NSH_VERSION" ]; then
              echo "Release tag version $TAG_VERSION does not match nsh/nsh.json version $NSH_VERSION" >&2
              exit 1
            fi
          fi

      - name: Install system dependencies
        run: |
          sudo bash scripts/ci/apt_update.sh
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-client0 \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libssl-dev \
            libpolkit-gobject-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            mesa-vulkan-drivers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check out formgen scripts from buwiz-forms-html
        uses: actions/checkout@v4
        with:
          repository: hexuria/buwiz-forms-html
          path: .ci-html
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test Python scripts
        run: python -m unittest discover -s scripts/tests -v

      - name: Verify Rust workspace
        env:
          EBIR_TEST_ENV: "1"
          BIR_AUTH_BYPASS: "1"
          BIR_SFTP_DRY_RUN: "1"
          BUWIZ_NO_KEYCHAIN: "1"
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace
          cargo clippy --locked --workspace -- -D warnings
          cargo test --locked --workspace

      - name: Verify frozen HTML inventory and TIN name stamps
        run: |
          python3 .ci-html/tools/formgen/freeze_html.py --verify --out html-frozen --index rules/index.json
          python3 .ci-html/tools/formgen/stamp_frozen_names.py --self-test
          python3 .ci-html/tools/formgen/stamp_frozen_names.py --check-all --html-root html-frozen --rules-root rules/forms --catalog .ci-html/tools/formgen/identity/catalog.json
          python3 scripts/audit_no_legacy.py

  # ── Windows ──────────────────────────────────────────────────────────────
  build-windows:
    needs: preflight
    uses: ./.github/workflows/release-windows.yml
    with:
      release: ${{ github.event_name == 'push' }}
    secrets: inherit

  # The Microsoft Store's .msix, built apart from the direct downloads above. Like every build it is given the Google
  # OAuth client only when the repository variable STORE_GMAIL is 1, and its job checks the package against that. It
  # is given no signing certificate: the Store signs it.
  # Its `windows-store` artifact is what Partner Center takes; the public release below never lists the unsigned .msix
  # (it cannot be sideloaded) or its sums.
  build-windows-store:
    needs: preflight
    uses: ./.github/workflows/release-windows.yml
    with:
      release: ${{ github.event_name == 'push' }}
      store: true
    secrets:
      NSH_REPO_TOKEN: ${{ secrets.NSH_REPO_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ vars.STORE_GMAIL == '1' && secrets.GOOGLE_CLIENT_ID || '' }}
      GOOGLE_CLIENT_SECRET: ${{ vars.STORE_GMAIL == '1' && secrets.GOOGLE_CLIENT_SECRET || '' }}

  build-linux:
    needs: preflight
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ needs.preflight.outputs.version }}
    # A called workflow does not see this file's env, so the Google OAuth
    # client the shell compiles in (option_env! in bir-core) has to reach it
    # as secrets; release-linux.yml passes them on only when STORE_GMAIL is 1.
    secrets: inherit

  # ── Create GitHub Release ───────────────────────────────────────────────
  release:
    env:
      NSH_UPDATE_KEY: ${{ secrets.NSH_UPDATE_KEY }}
    if: github.event_name == 'push'
    concurrency:
      group: release-feed-${{ github.ref }}
      cancel-in-progress: false
    needs: [preflight, build-windows, build-windows-store, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.tar.gz
            artifacts/**/*.rpm
            artifacts/**/*.pkg.tar.zst
            artifacts/**/*.PKGBUILD
            artifacts/**/SHA256SUMS-linux-*.txt
            artifacts/**/SHA256SUMS-windows-x64.txt
            artifacts/**/install-linux.sh
            artifacts/**/*-Setup.exe
            artifacts/**/*.msi
            artifacts/**/*-windows-x86_64.zip

      - name: Check out the manifest script
        uses: actions/checkout@v4

      - name: Check out pinned NSH CLI
        if: env.NSH_UPDATE_KEY != ''
        uses: actions/checkout@v4
        with:
          repository: hexuria/nsh
          ref: 8c78cfd6d8ffcef260728ad2503d43c3bc9e86bf
          path: .ci-nsh
          persist-credentials: false

      - name: Install NSH CLI toolchain
        if: env.NSH_UPDATE_KEY != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned NSH CLI
        if: env.NSH_UPDATE_KEY != ''
        run: cargo install --locked --path .ci-nsh/crates/nsh-cli

      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_update_manifest.py --tag "${{ github.ref_name }}" --repo "${{ github.repository }}"
