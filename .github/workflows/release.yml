name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Serialise per tag, but never cancel: a release job that is signing, notarizing
# or publishing must be allowed to finish. This only prevents the same tag being
# built concurrently (for example on a re-push), which is why cancel-in-progress
# is false here and true in ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  APP_NAME: eBIRForms
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  # The public release jobs may consume only this exact, tested tag commit.
  # A successful branch workflow is not accepted as a substitute because the
  # tag may point at a different SHA.
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tagged SHA, version, and lockfiles
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          test "$(git tag --points-at "$GITHUB_SHA" --list "$GITHUB_REF_NAME")" = "$GITHUB_REF_NAME"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git ls-files --error-unmatch Cargo.lock package-lock.json

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use exact vMAJOR.MINOR.PATCH syntax: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(awk -F '"' '
            /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
            in_workspace_package && /^\[/ { exit }
            in_workspace_package && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"
          if [ -z "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Release tag version $TAG_VERSION does not match Cargo workspace version $CARGO_VERSION" >&2
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-client0 \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libssl-dev \
            libpolkit-gobject-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            mesa-vulkan-drivers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check out formgen scripts from buwiz-forms-html
        uses: actions/checkout@v4
        with:
          repository: hexuria/buwiz-forms-html
          path: .ci-html
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace
          cargo clippy --locked --workspace -- -D warnings
          cargo test --locked --workspace

      - name: Verify frozen HTML inventory and TIN name stamps
        run: |
          python3 .ci-html/tools/formgen/freeze_html.py --verify --out html-frozen --index rules/index.json
          python3 .ci-html/tools/formgen/stamp_frozen_names.py --self-test
          python3 .ci-html/tools/formgen/stamp_frozen_names.py --check-all --html-root html-frozen --rules-root rules/forms --catalog .ci-html/tools/formgen/identity/catalog.json
          python3 scripts/audit_no_legacy.py

  # ── macOS Universal ───────────────────────────────────────────────────────
  build-macos:
    needs: preflight
    runs-on: macos-14  # M1 runner — can build both arm64 and x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS signing and notarization inputs
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required macOS release secret: $name" >&2
              exit 1
            fi
          done

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check out formgen scripts from buwiz-forms-html
        uses: actions/checkout@v4
        with:
          repository: hexuria/buwiz-forms-html
          path: .ci-html
          persist-credentials: false

      - name: Verify frozen HTML
        run: |
          python3 .ci-html/tools/formgen/freeze_html.py --verify --out html-frozen --index rules/index.json
          python3 .ci-html/tools/formgen/stamp_frozen_names.py --check-all --html-root html-frozen --rules-root rules/forms --catalog .ci-html/tools/formgen/identity/catalog.json
          python3 scripts/write_frozen_html_identity.py --html-frozen html-frozen --source-revision ${{ github.sha }} --out assets/form-renderer-build-identity.json

      - name: Build ARM64
        run: cargo build --locked --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --locked --release --target x86_64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p target/release-artifacts
          lipo -create \
            target/aarch64-apple-darwin/release/bir \
            target/x86_64-apple-darwin/release/bir \
            -output target/release-artifacts/bir
          chmod +x target/release-artifacts/bir

      - name: Create .app Bundle
        run: |
          APP="target/release-artifacts/${{ env.APP_NAME }}.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp target/release-artifacts/bir "$APP/Contents/MacOS/"
          cp -R assets "$APP/Contents/Resources/"
          rm -rf "$APP/Contents/Resources/assets/macos"
          cp assets/AppIcon.icns "$APP/Contents/Resources/"

          cp assets/macos/Info.plist "$APP/Contents/Info.plist"
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract BUILD_NUMBER from justfile (single source of truth, synced with App Store Connect)
          BUILD_NUMBER=$(grep '^BUILD_NUMBER' justfile | grep -o '"[0-9]*"' | tr -d '"')
          sed -i '' "s/VERSION_PLACEHOLDER/${VERSION}/g" "$APP/Contents/Info.plist"
          sed -i '' "s/BUILD_NUMBER_PLACEHOLDER/${BUILD_NUMBER}/g" "$APP/Contents/Info.plist"
          sed -i '' "s/BUNDLE_ID_PLACEHOLDER/dev.goldcoders.bir/g" "$APP/Contents/Info.plist"
          sed -i '' "s/APP_NAME_PLACEHOLDER/${{ env.APP_NAME }}/g" "$APP/Contents/Info.plist"
          python3 scripts/audit_no_legacy.py --package-root "$APP"

      - name: Codesign
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Import certificate into temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          IDENTITY_COUNT="$(printf '%s\n' "$IDENTITIES" | awk '/"Developer ID Application:/ { count++ } END { print count + 0 }')"
          if [ "$IDENTITY_COUNT" -ne 1 ]; then
            echo "Expected exactly one imported Developer ID Application identity" >&2
            printf '%s\n' "$IDENTITIES" >&2
            exit 1
          fi
          IDENTITY_LINE="$(printf '%s\n' "$IDENTITIES" | awk '/"Developer ID Application:/ { print; exit }')"
          case "$IDENTITY_LINE" in
            *"($APPLE_TEAM_ID)"*) ;;
            *)
              echo "Imported Developer ID identity does not belong to team $APPLE_TEAM_ID" >&2
              printf '%s\n' "$IDENTITY_LINE" >&2
              exit 1
              ;;
          esac
          SIGNING_IDENTITY="$(printf '%s\n' "$IDENTITY_LINE" | awk '{ print $2 }')"

          APP="target/release-artifacts/${{ env.APP_NAME }}.app"
          codesign --force --options runtime \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$SIGNING_IDENTITY" \
            --entitlements assets/macos/entitlements.mac.plist \
            "$APP"

          codesign --verify --strict --verbose=2 "$APP"

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="target/release-artifacts/${{ env.APP_NAME }}.app"

          # Try create-dmg, fallback to hdiutil
          if command -v create-dmg >/dev/null 2>&1; then
            create-dmg \
              --volname "${{ env.APP_NAME }}" \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "${{ env.APP_NAME }}.app" 150 190 \
              --app-drop-link 450 190 \
              "target/release-artifacts/${{ env.APP_NAME }}-macOS-universal-${VERSION}.dmg" \
              "$APP"
          else
            hdiutil create -volname "${{ env.APP_NAME }}" \
              -srcfolder "$APP" \
              -ov -format UDZO \
              "target/release-artifacts/${{ env.APP_NAME }}-macOS-universal-${VERSION}.dmg"
          fi

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="target/release-artifacts/${{ env.APP_NAME }}-macOS-universal-${VERSION}.dmg"

          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$DMG"

      - name: Verify signed and notarized macOS artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="target/release-artifacts/${{ env.APP_NAME }}.app"
          DMG="target/release-artifacts/${{ env.APP_NAME }}-macOS-universal-${VERSION}.dmg"
          test -f "$DMG"
          codesign --verify --strict --verbose=2 "$APP"
          xcrun stapler validate "$DMG"
          spctl --assess --type execute --verbose=2 "$APP"

          MOUNT_POINT="$(mktemp -d)"
          cleanup_mount() {
            hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true
            rm -rf "$MOUNT_POINT"
          }
          trap cleanup_mount EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          MOUNTED_APP="$MOUNT_POINT/${{ env.APP_NAME }}.app"
          test -d "$MOUNTED_APP"
          codesign --verify --strict --verbose=2 "$MOUNTED_APP"
          python3 scripts/audit_no_legacy.py --package-root "$MOUNTED_APP"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: target/release-artifacts/*.dmg

  # ── Windows ──────────────────────────────────────────────────────────────
  build-windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Windows signing inputs
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX)) {
            throw "Missing required Windows release secret: WINDOWS_CERTIFICATE_PFX"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Missing required Windows release secret: WINDOWS_CERTIFICATE_PASSWORD"
          }

      - name: Install Windows Dependencies
        shell: pwsh
        run: |
          choco install openssl innosetup 7zip -y
          choco install wixtoolset --version=3.11.2 -y
          $openssl_dir = ""
          if (Test-Path "C:\Program Files\OpenSSL\include") {
              $openssl_dir = "C:\Program Files\OpenSSL"
          } elseif (Test-Path "C:\Program Files\OpenSSL-Win64\include") {
              $openssl_dir = "C:\Program Files\OpenSSL-Win64"
          } else {
              Write-Error "OpenSSL include directory not found!"
              exit 1
          }
          
          echo "OPENSSL_DIR=$openssl_dir" >> $env:GITHUB_ENV
          
          # Find the actual library directory
          $lib_file = Get-ChildItem -Path $openssl_dir -Filter "*crypto*.lib" -Recurse | Select-Object -First 1
          if ($lib_file) {
              echo "OPENSSL_LIB_DIR=$($lib_file.DirectoryName)" >> $env:GITHUB_ENV
              if ($lib_file.Name -ne "libcrypto.lib") {
                  Copy-Item $lib_file.FullName "$($lib_file.DirectoryName)\libcrypto.lib"
              }
          } else {
              Write-Warning "Could not find *crypto*.lib inside $openssl_dir"
          }

      - name: Prepare Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "windows-release-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX)
            )
          } catch {
            throw "WINDOWS_CERTIFICATE_PFX is not valid base64: $($_.Exception.Message)"
          }
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdk) { throw "Windows SDK signing tools were not found" }
          $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
          if (-not (Test-Path $signtool)) { throw "signtool.exe was not found" }
          "WINDOWS_CERTIFICATE_PATH=$certificate" >> $env:GITHUB_ENV
          "WINDOWS_SIGNTOOL=$signtool" >> $env:GITHUB_ENV

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check out formgen scripts from buwiz-forms-html
        uses: actions/checkout@v4
        with:
          repository: hexuria/buwiz-forms-html
          path: .ci-html
          persist-credentials: false

      - name: Verify frozen HTML
        run: |
          python3 .ci-html/tools/formgen/freeze_html.py --verify --out html-frozen --index rules/index.json
          python3 .ci-html/tools/formgen/stamp_frozen_names.py --check-all --html-root html-frozen --rules-root rules/forms --catalog .ci-html/tools/formgen/identity/catalog.json
          python3 scripts/write_frozen_html_identity.py --html-frozen html-frozen --source-revision ${{ github.sha }} --out assets/form-renderer-build-identity.json

      - name: Build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Sign and verify Windows executable payloads
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $payloads = @(
            "target/x86_64-pc-windows-msvc/release/bir.exe"
          )
          foreach ($payload in $payloads) {
            & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $env:WINDOWS_CERTIFICATE_PATH `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              $payload
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $payload" }
            & $env:WINDOWS_SIGNTOOL verify /pa /all /v $payload
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $payload" }
          }

      - name: Stage signed Windows payload
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          $PKG = "target/release-artifacts/${{ env.APP_NAME }}-Windows-x64-${VERSION}"
          New-Item -ItemType Directory -Force -Path $PKG
          Copy-Item "target/x86_64-pc-windows-msvc/release/bir.exe" "$PKG/"
          Copy-Item -Recurse "assets" "$PKG/"
          python scripts/audit_no_legacy.py --package-root $PKG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create EXE Installer
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          $ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $ISCC /DMyAppVersion=$VERSION installer.iss

      - name: Create MSI Installer
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          $PKG = "target/release-artifacts/${{ env.APP_NAME }}-Windows-x64-${VERSION}"
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
          
          heat.exe dir "$PKG" -dr INSTALLDIR -cg HarvestedComponents -ag -g1 -sf -srd -var "var.SourceDir" -out harvest.wxs
          candle.exe installer.wxs harvest.wxs -arch x64 -dSourceDir="$PKG" -dVersion="$VERSION" -ext WixUIExtension
          light.exe installer.wixobj harvest.wixobj -out "target/release-artifacts/${{ env.APP_NAME }}-Windows-x64-${VERSION}.msi" -ext WixUIExtension

      - name: Sign and verify Windows release artifacts
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $msix = @(Get-ChildItem "target/release-artifacts/*.msix" -ErrorAction SilentlyContinue)
          if ($msix.Count -ne 0) {
            throw "Public GitHub releases must not contain MSIX artifacts; use the Store-only just msix workflow"
          }
          $artifacts = @(
            Get-ChildItem "target/release-artifacts/*-Setup.exe"
            Get-ChildItem "target/release-artifacts/*.msi"
          )
          if ($artifacts.Count -ne 2) {
            throw "Expected exactly one EXE and one MSI public release artifact"
          }
          foreach ($artifact in $artifacts) {
            & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $env:WINDOWS_CERTIFICATE_PATH `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              $artifact.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($artifact.FullName)" }
            & $env:WINDOWS_SIGNTOOL verify /pa /all /v $artifact.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed: $($artifact.FullName)"
            }
          }

      - name: Audit final Windows installer payloads
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          $setup = (Resolve-Path "target/release-artifacts/${{ env.APP_NAME }}-Windows-x64-${VERSION}-Setup.exe").Path
          $msi = (Resolve-Path "target/release-artifacts/${{ env.APP_NAME }}-Windows-x64-${VERSION}.msi").Path
          $extractRoot = Join-Path $env:RUNNER_TEMP "ebirforms-final-installers"
          $setupRoot = Join-Path $extractRoot "setup"
          $msiRoot = Join-Path $extractRoot "msi"
          Remove-Item $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $setupRoot, $msiRoot | Out-Null

          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          & $sevenZip x -y "-o$setupRoot" $setup
          if ($LASTEXITCODE -ne 0) { throw "Could not extract final Inno Setup installer" }
          python scripts/audit_no_legacy.py --package-root $setupRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $msiProcess = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/a",
            "`"$msi`"",
            "/qn",
            "TARGETDIR=`"$msiRoot`""
          )
          if ($msiProcess.ExitCode -ne 0) {
            throw "Could not administratively extract final MSI: $($msiProcess.ExitCode)"
          }
          python scripts/audit_no_legacy.py --package-root $msiRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            target/release-artifacts/*-Setup.exe
            target/release-artifacts/*.msi

  # ── Linux ────────────────────────────────────────────────────────────────
  build-linux:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-client0 \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libssl-dev \
            libpolkit-gobject-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            mesa-vulkan-drivers

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check out formgen scripts from buwiz-forms-html
        uses: actions/checkout@v4
        with:
          repository: hexuria/buwiz-forms-html
          path: .ci-html
          persist-credentials: false

      - name: Verify frozen HTML
        run: |
          python3 .ci-html/tools/formgen/freeze_html.py --verify --out html-frozen --index rules/index.json
          python3 .ci-html/tools/formgen/stamp_frozen_names.py --check-all --html-root html-frozen --rules-root rules/forms --catalog .ci-html/tools/formgen/identity/catalog.json
          python3 scripts/write_frozen_html_identity.py --html-frozen html-frozen --source-revision ${{ github.sha }} --out assets/form-renderer-build-identity.json

      - name: Build
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Install cargo-deb
        run: cargo install --locked cargo-deb --version 3.7.0

      - name: Create .deb Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p target/release-artifacts
          cargo deb --locked -p bir-desktop --no-build --target x86_64-unknown-linux-gnu \
            -o "target/release-artifacts/${{ env.APP_NAME }}-Linux-x64-${VERSION}.deb"

      - name: Create Tarball Fallback
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="target/release-artifacts/${{ env.APP_NAME }}-Linux-x64-${VERSION}"
          mkdir -p "$PKG"
          cp target/x86_64-unknown-linux-gnu/release/bir "$PKG/"
          cp -R assets "$PKG/"
          python3 scripts/audit_no_legacy.py --package-root "$PKG"
          cd target/release-artifacts
          tar czf "${{ env.APP_NAME }}-Linux-x64-${VERSION}.tar.gz" \
            "${{ env.APP_NAME }}-Linux-x64-${VERSION}"

      - name: Audit final Linux package payloads
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="target/release-artifacts/${{ env.APP_NAME }}-Linux-x64-${VERSION}.deb"
          TARBALL="target/release-artifacts/${{ env.APP_NAME }}-Linux-x64-${VERSION}.tar.gz"
          DEB_ROOT="$(mktemp -d)"
          TAR_ROOT="$(mktemp -d)"
          cleanup_packages() {
            rm -rf "$DEB_ROOT" "$TAR_ROOT"
          }
          trap cleanup_packages EXIT
          dpkg-deb --extract "$DEB" "$DEB_ROOT"
          tar xzf "$TARBALL" -C "$TAR_ROOT"
          python3 scripts/audit_no_legacy.py --package-root "$DEB_ROOT"
          python3 scripts/audit_no_legacy.py --package-root "$TAR_ROOT"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            target/release-artifacts/*.deb
            target/release-artifacts/*.tar.gz

  # ── Create GitHub Release ───────────────────────────────────────────────
  release:
    needs: [preflight, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.tar.gz
            artifacts/**/*-Setup.exe
            artifacts/**/*.msi
