name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: eBIRForms
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  # The public release jobs may consume only this exact, tested tag commit.
  # A successful branch workflow is not accepted as a substitute because the
  # tag may point at a different SHA.
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tagged SHA, version, and lockfiles
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          test "$(git tag --points-at "$GITHUB_SHA" --list "$GITHUB_REF_NAME")" = "$GITHUB_REF_NAME"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git ls-files --error-unmatch Cargo.lock package-lock.json

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use exact vMAJOR.MINOR.PATCH syntax: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(awk -F '"' '
            /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
            in_workspace_package && /^\[/ { exit }
            in_workspace_package && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"
          if [ -z "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Release tag version $TAG_VERSION does not match Cargo workspace version $CARGO_VERSION" >&2
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-client0 \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libssl-dev \
            libpolkit-gobject-1-dev \
            mesa-vulkan-drivers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install renderer and browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install pinned Typst
        run: |
          python3 scripts/fetch_pinned_typst.py \
            --target x86_64-unknown-linux-musl \
            --output target/pinned-typst/release-preflight/typst
          echo "$PWD/target/pinned-typst/release-preflight" >> "$GITHUB_PATH"

      - name: Verify Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace
          cargo clippy --locked --workspace -- -D warnings
          cargo test --locked --workspace

      - name: Verify renderer contracts, tests, and offline bundle
        run: |
          npm run contracts:check
          cargo run -q --locked -p bir-print --bin generate_render_contract -- --check-visual-references
          npm run typecheck:forms
          npm run test:forms
          python3 -m unittest discover -s scripts/tests -v
          npm run audit:forms:migration
          npm run build:forms
          npm run verify:forms:offline

      - name: Verify renderer geometry on the tagged source
        env:
          FORM_VISUAL_MAX_CHANGED_PERCENT: '100'
        run: npm run test:forms:visual

  # ── macOS Universal ───────────────────────────────────────────────────────
  build-macos:
    needs: preflight
    runs-on: macos-14  # M1 runner — can build both arm64 and x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS signing and notarization inputs
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required macOS release secret: $name" >&2
              exit 1
            fi
          done

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build local HTML renderer
        run: |
          npm ci
          npm run contracts:check
          npm run audit:forms:migration
          npm run build:forms
          npm run verify:forms:offline

      - name: Build ARM64
        run: cargo build --locked --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --locked --release --target x86_64-apple-darwin

      - name: Prepare pinned universal Typst
        run: |
          python3 scripts/fetch_pinned_typst.py \
            --target aarch64-apple-darwin \
            --output target/pinned-typst/macos/aarch64/typst
          python3 scripts/fetch_pinned_typst.py \
            --target x86_64-apple-darwin \
            --output target/pinned-typst/macos/x86_64/typst
          mkdir -p target/pinned-typst/macos/universal
          lipo -create \
            target/pinned-typst/macos/aarch64/typst \
            target/pinned-typst/macos/x86_64/typst \
            -output target/pinned-typst/macos/universal/typst
          chmod +x target/pinned-typst/macos/universal/typst
          test "$(target/pinned-typst/macos/universal/typst --version | awk '{print $2}')" = "0.13.1"
          lipo -archs target/pinned-typst/macos/universal/typst | grep -q arm64
          lipo -archs target/pinned-typst/macos/universal/typst | grep -q x86_64

      - name: Create Universal Binary
        run: |
          mkdir -p target/release-artifacts
          lipo -create \
            target/aarch64-apple-darwin/release/bir \
            target/x86_64-apple-darwin/release/bir \
            -output target/release-artifacts/bir
          chmod +x target/release-artifacts/bir

      - name: Create .app Bundle
        run: |
          APP="target/release-artifacts/${{ env.APP_NAME }}.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp target/release-artifacts/bir "$APP/Contents/MacOS/"
          cp target/pinned-typst/macos/universal/typst "$APP/Contents/MacOS/"
          cp -R assets "$APP/Contents/Resources/"
          rm -rf "$APP/Contents/Resources/assets/macos"
          cp assets/AppIcon.icns "$APP/Contents/Resources/"
          cp -R formtypes "$APP/Contents/Resources/"

          cp assets/macos/Info.plist "$APP/Contents/Info.plist"
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract BUILD_NUMBER from justfile (single source of truth, synced with App Store Connect)
          BUILD_NUMBER=$(grep '^BUILD_NUMBER' justfile | grep -o '"[0-9]*"' | tr -d '"')
          sed -i '' "s/VERSION_PLACEHOLDER/${VERSION}/g" "$APP/Contents/Info.plist"
          sed -i '' "s/BUILD_NUMBER_PLACEHOLDER/${BUILD_NUMBER}/g" "$APP/Contents/Info.plist"
          sed -i '' "s/BUNDLE_ID_PLACEHOLDER/dev.goldcoders.bir/g" "$APP/Contents/Info.plist"
          sed -i '' "s/APP_NAME_PLACEHOLDER/${{ env.APP_NAME }}/g" "$APP/Contents/Info.plist"

      - name: Codesign
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Import certificate into temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          IDENTITY_COUNT="$(printf '%s\n' "$IDENTITIES" | awk '/"Developer ID Application:/ { count++ } END { print count + 0 }')"
          if [ "$IDENTITY_COUNT" -ne 1 ]; then
            echo "Expected exactly one imported Developer ID Application identity" >&2
            printf '%s\n' "$IDENTITIES" >&2
            exit 1
          fi
          IDENTITY_LINE="$(printf '%s\n' "$IDENTITIES" | awk '/"Developer ID Application:/ { print; exit }')"
          case "$IDENTITY_LINE" in
            *"($APPLE_TEAM_ID)"*) ;;
            *)
              echo "Imported Developer ID identity does not belong to team $APPLE_TEAM_ID" >&2
              printf '%s\n' "$IDENTITY_LINE" >&2
              exit 1
              ;;
          esac
          SIGNING_IDENTITY="$(printf '%s\n' "$IDENTITY_LINE" | awk '{ print $2 }')"

          # Sign the nested helper before sealing the .app bundle.
          APP="target/release-artifacts/${{ env.APP_NAME }}.app"
          TYPST="$APP/Contents/MacOS/typst"
          codesign --force --options runtime \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$SIGNING_IDENTITY" \
            --entitlements assets/macos/typst.entitlements.dev.plist \
            "$TYPST"
          # Sign the outer application last. Do not use --deep: it can replace
          # the nested helper's deliberately separate entitlement signature.
          codesign --force --options runtime \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$SIGNING_IDENTITY" \
            --entitlements assets/macos/entitlements.mac.plist \
            "$APP"

          # Verify the final nested signature, version, and non-sandboxed
          # entitlement set after the outer application has been sealed.
          codesign --verify --strict --verbose=2 "$TYPST"
          TYPST_ENTITLEMENTS="$RUNNER_TEMP/typst-signed-entitlements.plist"
          codesign --display --xml --entitlements "$TYPST_ENTITLEMENTS" "$TYPST"
          plutil -lint "$TYPST_ENTITLEMENTS"
          if /usr/libexec/PlistBuddy -c \
            "Print :com.apple.security.app-sandbox" \
            "$TYPST_ENTITLEMENTS" >/dev/null 2>&1; then
            echo "Direct-download Typst helper must not be sandboxed" >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c \
            "Print :com.apple.security.inherit" \
            "$TYPST_ENTITLEMENTS" >/dev/null 2>&1; then
            echo "Direct-download Typst helper must not inherit sandbox entitlements" >&2
            exit 1
          fi
          test "$("$TYPST" --version | awk '{print $2}')" = "0.13.1"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="target/release-artifacts/${{ env.APP_NAME }}.app"

          # Try create-dmg, fallback to hdiutil
          if command -v create-dmg >/dev/null 2>&1; then
            create-dmg \
              --volname "${{ env.APP_NAME }}" \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "${{ env.APP_NAME }}.app" 150 190 \
              --app-drop-link 450 190 \
              "target/release-artifacts/${{ env.APP_NAME }}-macOS-universal-${VERSION}.dmg" \
              "$APP"
          else
            hdiutil create -volname "${{ env.APP_NAME }}" \
              -srcfolder "$APP" \
              -ov -format UDZO \
              "target/release-artifacts/${{ env.APP_NAME }}-macOS-universal-${VERSION}.dmg"
          fi

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="target/release-artifacts/${{ env.APP_NAME }}-macOS-universal-${VERSION}.dmg"

          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$DMG"

      - name: Verify signed and notarized macOS artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="target/release-artifacts/${{ env.APP_NAME }}.app"
          DMG="target/release-artifacts/${{ env.APP_NAME }}-macOS-universal-${VERSION}.dmg"
          test -f "$DMG"
          codesign --verify --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$APP/Contents/MacOS/typst"
          xcrun stapler validate "$DMG"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: target/release-artifacts/*.dmg

  # ── Windows ──────────────────────────────────────────────────────────────
  build-windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Windows signing inputs
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX)) {
            throw "Missing required Windows release secret: WINDOWS_CERTIFICATE_PFX"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Missing required Windows release secret: WINDOWS_CERTIFICATE_PASSWORD"
          }

      - name: Install Windows Dependencies
        shell: pwsh
        run: |
          choco install openssl innosetup -y
          choco install wixtoolset --version=3.11.2 -y
          $openssl_dir = ""
          if (Test-Path "C:\Program Files\OpenSSL\include") {
              $openssl_dir = "C:\Program Files\OpenSSL"
          } elseif (Test-Path "C:\Program Files\OpenSSL-Win64\include") {
              $openssl_dir = "C:\Program Files\OpenSSL-Win64"
          } else {
              Write-Error "OpenSSL include directory not found!"
              exit 1
          }
          
          echo "OPENSSL_DIR=$openssl_dir" >> $env:GITHUB_ENV
          
          # Find the actual library directory
          $lib_file = Get-ChildItem -Path $openssl_dir -Filter "*crypto*.lib" -Recurse | Select-Object -First 1
          if ($lib_file) {
              echo "OPENSSL_LIB_DIR=$($lib_file.DirectoryName)" >> $env:GITHUB_ENV
              if ($lib_file.Name -ne "libcrypto.lib") {
                  Copy-Item $lib_file.FullName "$($lib_file.DirectoryName)\libcrypto.lib"
              }
          } else {
              Write-Warning "Could not find *crypto*.lib inside $openssl_dir"
          }

      - name: Prepare Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "windows-release-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX)
            )
          } catch {
            throw "WINDOWS_CERTIFICATE_PFX is not valid base64: $($_.Exception.Message)"
          }
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdk) { throw "Windows SDK signing tools were not found" }
          $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
          if (-not (Test-Path $signtool)) { throw "signtool.exe was not found" }
          "WINDOWS_CERTIFICATE_PATH=$certificate" >> $env:GITHUB_ENV
          "WINDOWS_SIGNTOOL=$signtool" >> $env:GITHUB_ENV

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build local HTML renderer
        run: |
          npm ci
          npm run contracts:check
          npm run audit:forms:migration
          npm run build:forms
          npm run verify:forms:offline

      - name: Build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Prepare pinned Typst
        shell: pwsh
        run: |
          python scripts/fetch_pinned_typst.py `
            --target x86_64-pc-windows-msvc `
            --output target/pinned-typst/windows/typst.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & "target/pinned-typst/windows/typst.exe" --version
          if ($version -notmatch '^typst 0\.13\.1(?:\s|$)') {
            throw "Unexpected Typst version: $version"
          }

      - name: Sign and verify Windows executable payloads
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $payloads = @(
            "target/x86_64-pc-windows-msvc/release/bir.exe",
            "target/pinned-typst/windows/typst.exe"
          )
          foreach ($payload in $payloads) {
            & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $env:WINDOWS_CERTIFICATE_PATH `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              $payload
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $payload" }
            & $env:WINDOWS_SIGNTOOL verify /pa /all /v $payload
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $payload" }
          }

      - name: Stage signed Windows payload
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          $PKG = "target/release-artifacts/${{ env.APP_NAME }}-Windows-x64-${VERSION}"
          New-Item -ItemType Directory -Force -Path $PKG
          Copy-Item "target/x86_64-pc-windows-msvc/release/bir.exe" "$PKG/"
          Copy-Item "target/pinned-typst/windows/typst.exe" "$PKG/"
          Copy-Item -Recurse "assets" "$PKG/"
          Copy-Item -Recurse "formtypes" "$PKG/"

      - name: Create EXE Installer
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          $ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $ISCC /DMyAppVersion=$VERSION installer.iss

      - name: Create MSI Installer
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          $PKG = "target/release-artifacts/${{ env.APP_NAME }}-Windows-x64-${VERSION}"
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
          
          heat.exe dir "$PKG" -dr INSTALLDIR -cg HarvestedComponents -ag -g1 -sf -srd -var "var.SourceDir" -out harvest.wxs
          candle.exe installer.wxs harvest.wxs -arch x64 -dSourceDir="$PKG" -dVersion="$VERSION" -ext WixUIExtension
          light.exe installer.wixobj harvest.wixobj -out "target/release-artifacts/${{ env.APP_NAME }}-Windows-x64-${VERSION}.msi" -ext WixUIExtension

      - name: Sign and verify Windows release artifacts
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $msix = @(Get-ChildItem "target/release-artifacts/*.msix" -ErrorAction SilentlyContinue)
          if ($msix.Count -ne 0) {
            throw "Public GitHub releases must not contain MSIX artifacts; use the Store-only just msix workflow"
          }
          $artifacts = @(
            Get-ChildItem "target/release-artifacts/*-Setup.exe"
            Get-ChildItem "target/release-artifacts/*.msi"
          )
          if ($artifacts.Count -ne 2) {
            throw "Expected exactly one EXE and one MSI public release artifact"
          }
          foreach ($artifact in $artifacts) {
            & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $env:WINDOWS_CERTIFICATE_PATH `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              $artifact.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($artifact.FullName)" }
            & $env:WINDOWS_SIGNTOOL verify /pa /all /v $artifact.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed: $($artifact.FullName)"
            }
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            target/release-artifacts/*-Setup.exe
            target/release-artifacts/*.msi

  # ── Linux ────────────────────────────────────────────────────────────────
  build-linux:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-client0 \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libssl-dev \
            libpolkit-gobject-1-dev \
            mesa-vulkan-drivers

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build local HTML renderer
        run: |
          npm ci
          npm run contracts:check
          npm run audit:forms:migration
          npm run build:forms
          npm run verify:forms:offline

      - name: Build
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Prepare pinned Typst
        run: |
          python3 scripts/fetch_pinned_typst.py \
            --target x86_64-unknown-linux-musl \
            --output target/pinned-typst/linux/typst
          test "$(target/pinned-typst/linux/typst --version | awk '{print $2}')" = "0.13.1"

      - name: Install cargo-deb
        run: cargo install --locked cargo-deb --version 3.7.0

      - name: Create .deb Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p target/release-artifacts
          cargo deb --locked -p bir-desktop --no-build --target x86_64-unknown-linux-gnu \
            -o "target/release-artifacts/${{ env.APP_NAME }}-Linux-x64-${VERSION}.deb"

      - name: Create Tarball Fallback
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="target/release-artifacts/${{ env.APP_NAME }}-Linux-x64-${VERSION}"
          mkdir -p "$PKG"
          cp target/x86_64-unknown-linux-gnu/release/bir "$PKG/"
          cp target/pinned-typst/linux/typst "$PKG/"
          cp -R assets "$PKG/"
          cp -R formtypes "$PKG/"
          cd target/release-artifacts
          tar czf "${{ env.APP_NAME }}-Linux-x64-${VERSION}.tar.gz" \
            "${{ env.APP_NAME }}-Linux-x64-${VERSION}"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            target/release-artifacts/*.deb
            target/release-artifacts/*.tar.gz

  # ── Create GitHub Release ───────────────────────────────────────────────
  release:
    needs: [preflight, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.tar.gz
            artifacts/**/*-Setup.exe
            artifacts/**/*.msi
