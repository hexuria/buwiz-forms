name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Serialise per tag, but never cancel: a release job that is signing, notarizing
# or publishing must be allowed to finish. This only prevents the same tag being
# built concurrently (for example on a re-push), which is why cancel-in-progress
# is false here and true in ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  APP_NAME: eBIRForms
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  # The public release jobs may consume only this exact, tested tag commit.
  # A successful branch workflow is not accepted as a substitute because the
  # tag may point at a different SHA.
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tagged SHA, version, and lockfiles
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          test "$(git tag --points-at "$GITHUB_SHA" --list "$GITHUB_REF_NAME")" = "$GITHUB_REF_NAME"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git ls-files --error-unmatch Cargo.lock package-lock.json

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use exact vMAJOR.MINOR.PATCH syntax: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(awk -F '"' '
            /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
            in_workspace_package && /^\[/ { exit }
            in_workspace_package && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"
          if [ -z "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Release tag version $TAG_VERSION does not match Cargo workspace version $CARGO_VERSION" >&2
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-client0 \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libssl-dev \
            libpolkit-gobject-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            mesa-vulkan-drivers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check out formgen scripts from buwiz-forms-html
        uses: actions/checkout@v4
        with:
          repository: hexuria/buwiz-forms-html
          path: .ci-html
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test Python scripts
        run: python -m unittest discover -s scripts/tests -v

      - name: Verify Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace
          cargo clippy --locked --workspace -- -D warnings
          cargo test --locked --workspace

      - name: Verify frozen HTML inventory and TIN name stamps
        run: |
          python3 .ci-html/tools/formgen/freeze_html.py --verify --out html-frozen --index rules/index.json
          python3 .ci-html/tools/formgen/stamp_frozen_names.py --self-test
          python3 .ci-html/tools/formgen/stamp_frozen_names.py --check-all --html-root html-frozen --rules-root rules/forms --catalog .ci-html/tools/formgen/identity/catalog.json
          python3 scripts/audit_no_legacy.py

  # ── Windows ──────────────────────────────────────────────────────────────
  build-windows:
    needs: preflight
    uses: ./.github/workflows/release-windows.yml
    with:
      release: true
    secrets: inherit

  build-linux:
    needs: preflight
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ github.ref_name }}

  # ── Create GitHub Release ───────────────────────────────────────────────
  release:
    needs: [preflight, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.tar.gz
            artifacts/**/*.rpm
            artifacts/**/*.pkg.tar.zst
            artifacts/**/*.PKGBUILD
            artifacts/**/SHA256SUMS-linux-*.txt
            artifacts/**/install-linux.sh
            artifacts/**/*-Setup.exe
            artifacts/**/*.msi
