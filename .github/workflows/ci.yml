name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libx11-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libwayland-client0 \
          libasound2-dev \
          libudev-dev \
          libvulkan-dev \
          libfontconfig1-dev \
          libfreetype-dev \
          libssl-dev \
          libpolkit-gobject-1-dev \
          mesa-vulkan-drivers

    - name: Install Windows Dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install openssl -y
        $openssl_dir = ""
        if (Test-Path "C:\Program Files\OpenSSL\include") {
            $openssl_dir = "C:\Program Files\OpenSSL"
        } elseif (Test-Path "C:\Program Files\OpenSSL-Win64\include") {
            $openssl_dir = "C:\Program Files\OpenSSL-Win64"
        } else {
            Write-Error "OpenSSL include directory not found!"
            exit 1
        }
        
        echo "OPENSSL_DIR=$openssl_dir" >> $env:GITHUB_ENV
        
        # Find the actual library directory
        $lib_file = Get-ChildItem -Path $openssl_dir -Filter "*crypto*.lib" -Recurse | Select-Object -First 1
        if ($lib_file) {
            echo "OPENSSL_LIB_DIR=$($lib_file.DirectoryName)" >> $env:GITHUB_ENV
            if ($lib_file.Name -ne "libcrypto.lib") {
                Copy-Item $lib_file.FullName "$($lib_file.DirectoryName)\libcrypto.lib"
            }
        } else {
          Write-Warning "Could not find *crypto*.lib inside $openssl_dir"
        }

    - name: Install pinned Typst (macOS)
      if: runner.os == 'macOS'
      run: |
        python3 scripts/fetch_pinned_typst.py \
          --target aarch64-apple-darwin \
          --output target/pinned-typst/ci/typst
        echo "$PWD/target/pinned-typst/ci" >> "$GITHUB_PATH"

    - name: Install pinned Typst (Linux)
      if: runner.os == 'Linux'
      run: |
        python3 scripts/fetch_pinned_typst.py \
          --target x86_64-unknown-linux-musl \
          --output target/pinned-typst/ci/typst
        echo "$PWD/target/pinned-typst/ci" >> "$GITHUB_PATH"

    - name: Install pinned Typst (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        python scripts/fetch_pinned_typst.py `
          --target x86_64-pc-windows-msvc `
          --output target/pinned-typst/ci/typst.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        (Resolve-Path "target/pinned-typst/ci").Path >> $env:GITHUB_PATH

    - name: Format
      run: cargo fmt --all -- --check

    - name: Check
      run: cargo check --locked --workspace --target ${{ matrix.target }}

    - name: Clippy
      run: cargo clippy --locked --workspace --target ${{ matrix.target }} -- -D warnings

    - name: Test
      run: cargo test --locked --workspace --target ${{ matrix.target }}

  renderer:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install renderer dependencies
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Check generated contracts and official references
      run: |
        npm run contracts:check
        cargo run -q --locked -p bir-print --bin generate_render_contract -- --check-visual-references

    - name: Typecheck and unit test renderer
      run: |
        npm run typecheck:forms
        npm run test:forms
        python3 -m unittest discover -s scripts/tests -v

    - name: Build and audit offline renderer
      run: |
        npm run audit:forms:migration
        npm run build:forms
        npm run verify:forms:offline

    - name: Run visual geometry diagnostics
      env:
        FORM_VISUAL_MAX_CHANGED_PERCENT: '100'
      run: npm run test:forms:visual

    - name: Run strict visual parity diagnostic (<= 1%)
      continue-on-error: true
      env:
        FORM_VISUAL_MAX_CHANGED_PERCENT: '1'
      run: npm run test:forms:visual

    - name: Upload visual diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: renderer-visual-diagnostics
        path: test-results/form-renderer
