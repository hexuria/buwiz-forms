name: CI

on:
  push:
    branches: [ "main", "codex/**" ]
  pull_request:
    branches: [ "main", "gol/**", "codex/**" ]
  # Nightly safety net: the full CI, validation audits included, on main.
  # 18:00 UTC is 02:00 in Manila.
  schedule:
    - cron: "0 18 * * *"
  # Run by hand from the Actions tab; tick the box to force the validation-rules
  # corpus audits on any branch.
  workflow_dispatch:
    inputs:
      validation:
        description: "Also run the validation-rules corpus audits"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# Superseded runs were previously left to finish: pushing three times in fifteen
# minutes ran three full ten-job matrices, and only the last one's result was ever
# read. Cancel the older run on the same ref instead. `main` is included
# deliberately - a push to main immediately followed by another means the first
# commit's result is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    needs: changes
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: "Docs-only change: skipping build and tests"
      if: needs.changes.outputs.code == 'false'
      shell: bash
      run: |
        echo "Docs-only change detected: build and test steps were skipped." >> "$GITHUB_STEP_SUMMARY"

    - name: Check out formgen scripts from buwiz-forms-html
      if: needs.changes.outputs.code != 'false'
      uses: actions/checkout@v4
      with:
        repository: hexuria/buwiz-forms-html
        path: .ci-html
        persist-credentials: false

    - name: Install Python
      if: needs.changes.outputs.code != 'false'
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Test Python scripts
      if: needs.changes.outputs.code != 'false'
      run: python -m unittest discover -s scripts/tests -v

    - name: Install Rust Toolchain
      if: needs.changes.outputs.code != 'false'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.99.0
        targets: ${{ matrix.target }}
        components: clippy, rustfmt

    # rust-cache keys per job name by default, so ten jobs held ten multi-GB
    # entries against GitHub's 10 GB per-repo ceiling and were evicting each
    # other. Every job here builds for the host, so all four share one entry
    # per OS.
    #
    # This job is the SOLE WRITER of that entry, and that is load-bearing:
    # rust-cache will not overwrite an exact-matching key, so whichever job
    # saves first defines the cache and the rest can never contribute. When all
    # four could save, the small validation-rules jobs won the race and `check`
    # restored a cache missing almost everything it needs - rebuilding the whole
    # workspace every run (34m on Windows) and then being unable to save it.
    # `cargo test --workspace` below builds a superset of what the other three
    # need, so writing only from here keeps the shared entry complete.
    #
    # The key is `workspace-<os>`, not the earlier `host-<os>`: rust-cache
    # skips saving when the exact key already exists, so reusing the old name
    # would have preserved the wrongly-populated entry forever. The stale
    # host-* and check-* entries are no longer read by anything and age out.
    # Saving only from main also stops pull requests churning it.
    - name: Rust Cache
      if: needs.changes.outputs.code != 'false'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-${{ runner.os }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install just
      if: needs.changes.outputs.code != 'false'
      run: cargo install just --version 1.45.0 --locked

    - name: Validate justfile
      if: needs.changes.outputs.code != 'false'
      run: just --summary

    - name: Install Linux Dependencies
      if: runner.os == 'Linux' && needs.changes.outputs.code != 'false'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libx11-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libwayland-client0 \
          libasound2-dev \
          libudev-dev \
          libvulkan-dev \
          libfontconfig1-dev \
          libfreetype-dev \
          libssl-dev \
          libpolkit-gobject-1-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          xvfb \
          mesa-vulkan-drivers

    # The GTK native-print tests call `gtk::init`, which needs a display server.
    # Hosted runners are headless, so without this they fail with
    # "Failed to initialize GTK". A virtual framebuffer lets them run for real
    # rather than being skipped.
    - name: Start virtual display
      if: runner.os == 'Linux' && needs.changes.outputs.code != 'false'
      run: |
        Xvfb :99 -screen 0 1280x1024x24 &
        echo "DISPLAY=:99" >> "$GITHUB_ENV"

    # `choco install openssl` pulls a 245 MB installer from slproweb.com on every
    # run - about 88s, and a third-party download inside the build path. Cache the
    # installed tree instead. Both candidate locations are cached because the
    # package has used each at different versions.
    #
    # The env-var detection below still runs unconditionally: GITHUB_ENV does not
    # persist between runs, so OPENSSL_DIR/OPENSSL_LIB_DIR must be re-exported
    # even when the install itself was restored from cache.
    - name: Cache OpenSSL
      if: runner.os == 'Windows' && needs.changes.outputs.code != 'false'
      uses: actions/cache@v4
      with:
        path: |
          C:\Program Files\OpenSSL
          C:\Program Files\OpenSSL-Win64
        key: openssl-${{ runner.os }}-choco-v1

    - name: Install Windows Dependencies
      if: runner.os == 'Windows' && needs.changes.outputs.code != 'false'
      shell: pwsh
      run: |
        if ((Test-Path "C:\Program Files\OpenSSL\include") -or
            (Test-Path "C:\Program Files\OpenSSL-Win64\include")) {
            Write-Host "OpenSSL restored from cache; skipping choco install"
        } else {
            choco install openssl -y
        }
        $openssl_dir = ""
        if (Test-Path "C:\Program Files\OpenSSL\include") {
            $openssl_dir = "C:\Program Files\OpenSSL"
        } elseif (Test-Path "C:\Program Files\OpenSSL-Win64\include") {
            $openssl_dir = "C:\Program Files\OpenSSL-Win64"
        } else {
            [Console]::Error.WriteLine("OpenSSL include directory not found!")
            exit 1
        }
        
        echo "OPENSSL_DIR=$openssl_dir" >> $env:GITHUB_ENV
        
        # Find the actual library directory
        $lib_file = Get-ChildItem -Path $openssl_dir -Filter "*crypto*.lib" -Recurse | Select-Object -First 1
        if ($lib_file) {
            echo "OPENSSL_LIB_DIR=$($lib_file.DirectoryName)" >> $env:GITHUB_ENV
            if ($lib_file.Name -ne "libcrypto.lib") {
                Copy-Item $lib_file.FullName "$($lib_file.DirectoryName)\libcrypto.lib"
            }
        } else {
          Write-Warning "Could not find *crypto*.lib inside $openssl_dir"
        }

    - name: Format
      if: needs.changes.outputs.code != 'false'
      run: cargo fmt --all -- --check

    # No separate `cargo check` step: clippy performs the same analysis over the
    # same target set and reports the same compile errors, so checking first only
    # re-ran the workspace crates through a second, differently-fingerprinted
    # pass. Dependencies were already shared between the two.
    #
    # No `--target` either. Every leg of this matrix names its own host triple
    # (macos-14/aarch64-apple-darwin, ubuntu-22.04/x86_64-unknown-linux-gnu,
    # windows-latest/x86_64-pc-windows-msvc) and no RUSTFLAGS are set anywhere,
    # so passing it was semantically identical to a host build while costing
    # real resources: it forced artifacts into target/<triple>/, rebuilt the
    # proc-macro and build-script dependencies a second time for the host, and
    # was the only reason this job could not share the host cache above.
    # The matrix still pins the toolchain target, so platform coverage is
    # unchanged. release.yml keeps its `--target` flags - those cross-compile
    # both macOS architectures for the universal binary and are genuine.
    - name: Clippy
      if: needs.changes.outputs.code != 'false'
      run: cargo clippy --locked --workspace -- -D warnings

    # The Mac App Store variant is a feature configuration nothing else in this
    # workflow compiles: the step above builds `bir-desktop` with default
    # features, so every `#[cfg(not(feature = "mas_build"))]` block is taken and
    # the sandboxed configuration is never type-checked. `mas_build` disables the
    # `global_hotkey` subsystem - manager, its DB handle, and the event loop -
    # because App Store sandboxing forbids the entitlements it needs. Without
    # this step, adding hotkey code without the matching `cfg` compiles green
    # here and only fails when someone cuts an App Store build.
    #
    # macOS only: the variant exists solely to be submitted to Apple, and it is
    # only ever built from a Mac.
    - name: Clippy (Mac App Store variant)
      if: runner.os == 'macOS' && needs.changes.outputs.code != 'false'
      run: cargo clippy --locked -p bir-desktop --features mas_build -- -D warnings

    # The agent control plane is off by default, so the two steps above never
    # compile `src/agent/**` (or the `agent`-gated parts of the views) and never
    # lint the tests. Lints in that tree therefore only surfaced when someone
    # ran clippy locally with the feature on. `--all-targets` is what pulls the
    # unit tests in; the `check` job's `cargo test --locked --workspace` also
    # builds without `agent`, so this is the only step that type-checks the
    # control plane at all.
    - name: Clippy (agent control plane)
      if: needs.changes.outputs.code != 'false'
      run: cargo clippy --locked -p bir-desktop --all-targets --features dev-tools,agent -- -D warnings

    # One command per line: this job's default shell is pwsh on windows-latest,
    # and bash `\` continuations are a parse error there.
    - name: Frozen HTML inventory and TIN name stamps
      if: needs.changes.outputs.code != 'false'
      run: |
        python3 .ci-html/tools/formgen/freeze_html.py --verify --out html-frozen --index rules/index.json
        python3 .ci-html/tools/formgen/stamp_frozen_names.py --self-test
        python3 .ci-html/tools/formgen/stamp_frozen_names.py --check-all --html-root html-frozen --rules-root rules/forms --catalog .ci-html/tools/formgen/identity/catalog.json

    - name: Test
      if: needs.changes.outputs.code != 'false'
      run: cargo test --locked --workspace

    # The production-filing boundary stays gating on every PR, whatever the
    # validation-rules jobs below decide. It scans all of bir-core/src and
    # bir-desktop/src (transport, import, cron, the 2550Q guards), so almost any
    # app change can open it; and it reuses this job's build, so it is cheap.
    # A boundary failure is far more serious than an open validation slice.
    - name: Check validation-rules production boundaries
      if: needs.changes.outputs.code != 'false'
      run: cargo run -q --locked -p bir-rules-codegen -- status --boundaries-only

    - name: Agent mailbox scheduling regression
      if: runner.os == 'Windows' && needs.changes.outputs.code != 'false'
      run: cargo test --locked -p bir-desktop --features dev-tools,agent --lib agent::drain::tests::agent_mailbox_drains_without_rendering_app_state -- --exact

    - name: Install Windows packaging tools
      if: runner.os == 'Windows' && needs.changes.outputs.code != 'false'
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress
        $installExitCode = $LASTEXITCODE
        if ($installExitCode -eq 3010) {
          Write-Warning "Chocolatey reports a reboot is required (3010); continuing."
        } elseif ($installExitCode -ne 0) {
          [Console]::Error.WriteLine("Inno Setup installation failed (exit code $installExitCode).")
          exit $installExitCode
        }

    - name: Build and audit unsigned Windows Setup
      if: runner.os == 'Windows' && needs.changes.outputs.code != 'false'
      shell: pwsh
      run: |
        just exe
        $buildExitCode = $LASTEXITCODE
        if ($buildExitCode -ne 0) { exit $buildExitCode }
        $installers = @(Get-ChildItem "target/release-artifacts/*-Setup.exe")
        if ($installers.Count -ne 1) {
          throw "Expected exactly one Setup.exe after just exe; found $($installers.Count)."
        }
        & pwsh -NoProfile -File scripts/audit_final_setup.ps1 -Installer $installers[0].FullName -Python python
        $auditExitCode = $LASTEXITCODE
        if ($auditExitCode -ne 0) { exit $auditExitCode }

    # #96: the shipped bir-desktop.exe must carry the /STACK reserve from
    # crates/bir-desktop/build.rs. Checking the PE header here means reverting
    # the linker policy fails CI instead of silently returning to 1 MiB.
    - name: Verify bir-desktop PE stack reserve
      if: runner.os == 'Windows' && needs.changes.outputs.code != 'false'
      shell: pwsh
      run: |
        python scripts/check_pe_stack_reserve.py target/x86_64-pc-windows-msvc/release/bir-desktop.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cargo build --locked -p bir-desktop --bin bir-desktop
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python scripts/check_pe_stack_reserve.py target/debug/bir-desktop.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The v1 corpus audit runs on every OS. It used to be a windows-latest-only
  # PowerShell job, which is exactly why three separate Windows-path defects in
  # rules/validate.ps1 went undetected: on macOS and Linux the v2 exclusions
  # never matched, so the wrong file set was audited (and the script exited 1).
  # Decides whether the validation-rules corpus audits run. They check the
  # extracted official rule corpus (rules/, bir-rules*, form_rules), which is a
  # separate objective from the per-form validation the app runs today, so they
  # only run when that corpus can have changed:
  #   - a branch named ebirforms-* (work synced from hexuria/buwiz-validation),
  #   - a change under one of the paths below,
  #   - a PR carrying the run-validation label,
  #   - the nightly run on main,
  #   - a manual run with the "validation" box ticked.
  # The boundary check that guards production filing is NOT gated: it runs in
  # `check` on every PR.
  changes:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      validation: ${{ steps.decide.outputs.validation }}
      code: ${{ steps.decide.outputs.code }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Decide
      id: decide
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        FORCE: ${{ inputs.validation }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
      run: |
        set -euo pipefail

        range=""
        changed=""
        changed_known=false
        if [[ "$EVENT" == pull_request && -n "$PR_BASE" && -n "$PR_HEAD" ]]; then
          range="$PR_BASE...$PR_HEAD"
        elif [[ "$EVENT" == push && -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ && -n "$PUSH_AFTER" ]]; then
          range="$PUSH_BEFORE..$PUSH_AFTER"
        fi
        if [[ -n "$range" ]] && changed=$(git diff --name-only "$range"); then
          changed_known=true
        fi

        code=true
        code_reason="event $EVENT requires full CI"
        if [[ "$EVENT" == pull_request || "$EVENT" == push ]]; then
          if [[ "$changed_known" != true ]]; then
            code_reason="change range unknown"
          elif [[ -z "$changed" ]]; then
            code_reason="no changed files"
          elif grep -qEv '^(docs/|[^/]+\.md$|crates/[^/]+/docs/|\.github/[^/]+\.md$)' <<<"$changed"; then
            code_reason="non-docs file changed"
          else
            code=false
            code_reason="docs-only changes"
          fi
        fi

        run=false
        reason="no validation-rules path changed"
        if [[ "$EVENT" == schedule ]]; then
          run=true; reason="nightly run"
        # Read the PR's labels now, not from the event payload, so adding the
        # label and then clicking "Re-run all jobs" picks it up. (Triggering on
        # `labeled` instead would restart the whole CI for any label.)
        elif [[ "$EVENT" == pull_request ]] && gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx run-validation; then
          run=true; reason="run-validation label"
        elif [[ "$EVENT" == workflow_dispatch ]]; then
          if [[ "$FORCE" == true ]]; then run=true; reason="manual run"; else reason="manual run, box not ticked"; fi
        elif [[ "$BRANCH" == ebirforms-* ]]; then
          run=true; reason="branch $BRANCH"
        else
          if [[ "$changed_known" != true ]]; then
            # Unknown range (new branch, force push): fail safe and run.
            run=true; reason="change range unknown"
          elif grep -qE '^(rules/|crates/bir-rules(-codegen|-platform)?/|crates/bir-core/src/form_rules/|crates/bir-desktop/src/components/form_validation/|evidence/validation-rules/|rust-toolchain|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            run=true; reason="validation-rules paths changed"
          fi
        fi
        echo "validation=$run" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "validation-rules audits: $run ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "full build and tests: $code ($code_reason)" | tee -a "$GITHUB_STEP_SUMMARY"

  validation-rules-v1:
    needs: changes
    if: needs.changes.outputs.validation == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, macos-14, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.99.0

    # Reader only. `check` is the sole writer of host-<os>; see the comment
    # there. Saving from here too would let this job's much smaller target dir
    # win the race and define the shared entry for everyone.
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-${{ runner.os }}
        save-if: false

    - name: Audit legacy v1 rules corpus
      run: cargo run --locked -p bir-rules-codegen -- validate-v1

  validation-rules-v2:
    needs: changes
    if: needs.changes.outputs.validation == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, ubuntu-22.04, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.99.0

    # Reader only - see the sole-writer comment in `check`.
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-${{ runner.os }}
        save-if: false

    # This filters one test by exact name, and a filter that matches nothing is
    # not an error to libtest: it prints "0 passed" and exits 0. So if the test
    # is ever renamed or moved to another crate, this step would go green while
    # the immutable-corpus census lock silently stopped being checked. Assert the
    # test actually ran rather than trusting the exit code.
    - name: Lock immutable v1 corpus census
      shell: bash
      run: |
        set -euo pipefail
        output=$(cargo test --locked -p bir-rules-codegen \
          corpus::tests::landed_v1_corpus_reconciles_its_published_counts -- --exact 2>&1)
        echo "$output"
        if ! grep -qE '^test result: ok\. 1 passed' <<<"$output"; then
          echo "::error::the corpus census test did not run - the filter matched no test." >&2
          echo "::error::Expected exactly 1 passed. Did the test move crates or get renamed?" >&2
          exit 1
        fi

    # `audit` is a distinct subcommand from `check` and was never run in CI.
    - name: Audit validation-rules v2 IR
      run: cargo run --locked -p bir-rules-codegen -- audit

    - name: Check generated validation rules
      run: cargo run --locked -p bir-rules-codegen -- check

    - name: Verify validation-rules digest roll
      run: cargo run --locked -p bir-rules-codegen -- roll-pin --all --dry-run

    - name: Report validation-rules operator census
      run: cargo run --locked -p bir-rules-codegen -- operator-census --json

    - name: Report validation-rules reconciliation
      run: cargo run --locked -p bir-rules-codegen -- reconciliation --json

    # Also gating on every PR from the `check` job; kept here so a validation
    # run is complete on its own.
    - name: Check validation-rules production boundaries
      run: cargo run -q --locked -p bir-rules-codegen -- status --boundaries-only

    - name: Check tracked validation evidence packet set
      if: ${{ hashFiles('evidence/validation-rules/packets/v1/packet-set.json') != '' }}
      run: cargo run --locked -p bir-rules-codegen -- check-evidence-packet-set --packet-root evidence/validation-rules/packets/v1

    # Reported, not gating - and deliberately distinct from the
    # `--boundaries-only` step above, which stays fail-closed and MUST keep
    # passing. That step asserts production authority is still closed; this one
    # asserts the active library objective is *finished*. Its open criteria are
    # the remaining work, not a regression: only 2550Q has a v2 rule set (and it
    # must never be promoted), so `v2-snapshot-coverage` reads 1/43 and
    # `validations-represented` 27/2007 by construction. Gating on it would mean
    # CI can only go green once the entire 43-form corpus is built.
    #
    # A boundary failure is far more serious than an open slice. Keeping this
    # non-gating is what preserves that signal: a red validation-rules-v2 job
    # now means a boundary broke.
    - name: Report complete validation library status (non-gating)
      continue-on-error: true
      if: ${{ hashFiles('evidence/validation-rules/packets/v1/packet-set.json') != '' }}
      run: cargo run -q --locked -p bir-rules-codegen -- status

    # No `cargo test -p bir-rules -p bir-rules-codegen -p bir-rules-platform` here.
    # The `check` job's `cargo test --locked --workspace` already runs exactly those
    # tests, and on all three OSes - so cross-platform coverage is unchanged, which
    # matters because a Windows-only job is what previously hid three path defects.
    # Running them twice per OS meant six executions of bir-rules-codegen's
    # generate::tests, each of which spawns a nested cargo build.
    #
    # The targeted steps above are NOT duplicates and stay: they are `cargo run`
    # subcommands plus the exact-name corpus census, none of which `cargo test
    # --workspace` performs.

  # The one required status for the validation-rules audits. A skipped matrix
  # job reports no per-OS check names, so requiring "validation-rules-v1
  # (macos-14)" etc. would leave every PR that skips them waiting forever.
  # Passes when the audits ran green or were skipped; fails if either one
  # failed or was cancelled.
  validation-rules:
    needs: [ changes, validation-rules-v1, validation-rules-v2 ]
    if: always()
    runs-on: ubuntu-22.04
    steps:
    - name: Result
      shell: bash
      env:
        DECIDED: ${{ needs.changes.result }}
        V1: ${{ needs.validation-rules-v1.result }}
        V2: ${{ needs.validation-rules-v2.result }}
      run: |
        echo "changes=$DECIDED v1=$V1 v2=$V2"
        [[ "$DECIDED" == success ]] || { echo "::error::could not decide whether to run the audits"; exit 1; }
        for r in "$V1" "$V2"; do
          [[ "$r" == success || "$r" == skipped ]] || { echo "::error::validation-rules audit $r"; exit 1; }
        done

  # A failed nightly run opens (or comments on) one tracking issue, so a break
  # that slipped past PRs is seen the next morning instead of going unread.
  nightly-report:
    needs: [ check, validation-rules ]
    if: always() && github.event_name == 'schedule' && (needs.check.result != 'success' || needs.validation-rules.result != 'success')
    runs-on: ubuntu-22.04
    permissions:
      issues: write
    steps:
    - name: Open or update the nightly failure issue
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        CHECK: ${{ needs.check.result }}
        VALIDATION: ${{ needs.validation-rules.result }}
      run: |
        set -euo pipefail
        title="Nightly CI failed on main"
        body="Nightly run: $RUN_URL"$'\n\n'"- check: $CHECK"$'\n'"- validation-rules: $VALIDATION"
        existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
        if [[ -n "$existing" ]]; then
          gh issue comment "$existing" --body "$body"
        else
          gh issue create --title "$title" --body "$body"
        fi

  # Rust CI was green while normal Windows use still crashed (#90). This
  # report-only runtime owner launches the painted app and exercises the
  # agent-observable preview, tray, and dry-run submit paths. Both fixes have
  # merged: the §2/#97 WebView fix (#107) and §3/#96 stack fix (#119).
  # Promotion to a required check is an owner decision; keep continue-on-error.
  # Hosted runners use WARP, do not exercise real
  # foreground-window rules, and 2200M is not agent-reachable.
  windows-smoke:
    # Same docs-only skip as `check`: a docs-only change builds nothing.
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.99.0

    # Reader only. `check` is the sole writer of workspace-${{ runner.os }};
    # see the cache ownership comment in that job.
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-${{ runner.os }}
        save-if: false

    - name: Cache OpenSSL
      uses: actions/cache@v4
      with:
        path: |
          C:\Program Files\OpenSSL
          C:\Program Files\OpenSSL-Win64
        key: openssl-${{ runner.os }}-choco-v1

    - name: Install Windows Dependencies
      shell: pwsh
      run: |
        if ((Test-Path "C:\Program Files\OpenSSL\include") -or
            (Test-Path "C:\Program Files\OpenSSL-Win64\include")) {
            Write-Host "OpenSSL restored from cache; skipping choco install"
        } else {
            choco install openssl -y
        }
        $openssl_dir = ""
        if (Test-Path "C:\Program Files\OpenSSL\include") {
            $openssl_dir = "C:\Program Files\OpenSSL"
        } elseif (Test-Path "C:\Program Files\OpenSSL-Win64\include") {
            $openssl_dir = "C:\Program Files\OpenSSL-Win64"
        } else {
            Write-Error "OpenSSL include directory not found!"
            exit 1
        }
        echo "OPENSSL_DIR=$openssl_dir" >> $env:GITHUB_ENV
        $lib_file = Get-ChildItem -Path $openssl_dir -Filter "*crypto*.lib" -Recurse | Select-Object -First 1
        if ($lib_file) {
            echo "OPENSSL_LIB_DIR=$($lib_file.DirectoryName)" >> $env:GITHUB_ENV
            if ($lib_file.Name -ne "libcrypto.lib") {
                Copy-Item $lib_file.FullName "$($lib_file.DirectoryName)\libcrypto.lib"
            }
        } else {
            Write-Warning "Could not find *crypto*.lib inside $openssl_dir"
        }

    - name: Build bir
      shell: pwsh
      run: |
        $cargo_args = @("build", "--locked", "-p", "bir-desktop", "--bin", "bir-desktop", "--features", "dev-tools,agent")
        if ("${{ matrix.profile }}" -eq "release") { $cargo_args += "--release" }
        cargo @cargo_args
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $target_dir = if ("${{ matrix.profile }}" -eq "release") { "target\release" } else { "target\debug" }
        python scripts/alias_desktop_bin.py $target_dir
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run Windows smoke
      shell: pwsh
      run: |
        $binary = if ("${{ matrix.profile }}" -eq "release") { "target\release\bir.exe" } else { "target\debug\bir.exe" }
        $work = "windows-smoke\${{ matrix.profile }}"
        python scripts/windows_smoke.py --bin $binary --work $work --json-out "$work\results.json"

    - name: Upload Windows smoke evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-smoke-${{ matrix.profile }}
        path: windows-smoke/${{ matrix.profile }}
        retention-days: 7
