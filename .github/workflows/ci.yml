name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libx11-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libwayland-client0 \
          libasound2-dev \
          libudev-dev \
          libvulkan-dev \
          libfontconfig1-dev \
          libfreetype-dev \
          libssl-dev \
          libpolkit-gobject-1-dev \
          mesa-vulkan-drivers

    - name: Install Windows Dependencies
      if: runner.os == 'Windows'
      run: |
        choco install openssl
        echo "OPENSSL_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV

    - name: Check
      run: cargo check --workspace --target ${{ matrix.target }}

    - name: Clippy
      run: cargo clippy --workspace --target ${{ matrix.target }} -- -D warnings

    - name: Test
      run: cargo test --workspace --target ${{ matrix.target }}
