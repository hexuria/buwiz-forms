name: CI

# Two lanes (docs/CI.md):
# - The quick lane: a pull request, or a push to main or codex/**, runs the quick checks on Linux only (formatting,
#   clippy, the production-boundary check, the NSH type check, the Python script tests, legacy-guard). About ten
#   minutes; this is what `ci-ok`, the one required status, reports.
# - The test lane: a push to test/** (the branch name picks the systems), a manual run, and the nightly run on main
#   run the test suites. Checks attach to the commit, so pushing a pull request's head to test/... shows the results
#   on the pull request. `just ci-test [linux|windows|macos|all]` does that push.
# scripts/ci_plan.py decides what each run does; nsh.yml uses the same script.
on:
  push:
    branches: [ "main", "codex/**", "test/**" ]
  pull_request:
    branches: [ "main", "gol/**", "codex/**", "feat/**" ]
  # Nightly safety net: everything, validation audits included, on all three systems. 18:00 UTC is 02:00 in Manila.
  schedule:
    - cron: "0 18 * * *"
  # Run by hand from the Actions tab or `gh workflow run ci.yml` (docs/CI.md); `just ci-main` runs all of it on main.
  workflow_dispatch:
    inputs:
      systems:
        description: "Systems: all, or a comma list of linux, windows, macos"
        type: string
        default: "linux,windows"
      suites:
        description: "Suites: all, or a comma list of rust, screens, build, installer, validation"
        type: string
        default: "all"
      screens:
        description: "Screen-test files to run (nsh.yml), e.g. screens/form/** (empty: all)"
        type: string
        default: ""
      shard:
        description: "Screen-test shard to run (nsh.yml)"
        type: choice
        options: [ "all", "0", "1", "2" ]
        default: "all"

env:
  CARGO_TERM_COLOR: always

# One run per ref: a newer push to the same pull request or test/... branch cancels the older run, whose result
# nobody reads. main is the exception: every run there gets a group of its own (its run id) and is never cancelled.
# Four merges in three minutes used to cancel each other and leave main with no complete run; now each merge gets
# its quick run, and a merge can no longer cancel the nightly or a manual complete run either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One job for both lanes, so the two never drift apart. In the quick lane it
  # runs on Linux alone with `tests: false`: the Python script tests,
  # formatting, clippy, the direct-bir checks, the frozen HTML inventory and
  # the production-boundary check. In the test lane (`tests: true`) it runs on
  # the systems `changes` picked and adds the workspace Rust tests and the
  # page-versus-print audit. Skipping it is safe because the required status
  # is `ci-ok`, not these per-OS names.
  check:
    name: ${{ matrix.tests && 'workspace tests' || 'quick checks' }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.check == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.check_matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Check out formgen scripts from buwiz-forms-html
      uses: actions/checkout@v4
      with:
        repository: hexuria/buwiz-forms-html
        path: .ci-html
        persist-credentials: false

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Test Python scripts
      run: python -m unittest discover -s scripts/tests -v

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.99.0
        targets: ${{ matrix.target }}
        components: clippy, rustfmt

    # rust-cache keys per job name by default, so ten jobs held ten multi-GB
    # entries against GitHub's 10 GB per-repo ceiling and were evicting each
    # other. Every job here builds for the host, so all four share one entry
    # per OS.
    #
    # This job is the SOLE WRITER of that entry, and that is load-bearing:
    # rust-cache will not overwrite an exact-matching key, so whichever job
    # saves first defines the cache and the rest can never contribute. When all
    # four could save, the small validation-rules jobs won the race and `check`
    # restored a cache missing almost everything it needs - rebuilding the whole
    # workspace every run (34m on Windows) and then being unable to save it.
    # `cargo test --workspace` below builds a superset of what the other three
    # need, so writing only from here keeps the shared entry complete.
    #
    # The key is `workspace-<os>`, not the earlier `host-<os>`: rust-cache
    # skips saving when the exact key already exists, so reusing the old name
    # would have preserved the wrongly-populated entry forever. The stale
    # host-* and check-* entries are no longer read by anything and age out.
    # Saving only from main also stops pull requests and test/** branches
    # churning it. And only the test lane saves: the quick lane builds a subset
    # (no tests), and saving it first would leave the entry incomplete for
    # good. main's pushes run the quick lane, so this entry is now refreshed
    # by the nightly run and `just ci-main`.
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-${{ runner.os }}
        save-if: ${{ github.ref == 'refs/heads/main' && matrix.tests }}

    - name: Install just
      run: cargo install just --version 1.45.0 --locked

    - name: Validate justfile
      run: just --summary

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libx11-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libwayland-client0 \
          libasound2-dev \
          libudev-dev \
          libvulkan-dev \
          libfontconfig1-dev \
          libfreetype-dev \
          libssl-dev \
          libpolkit-gobject-1-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-1 \
          libxdo-dev \
          xvfb \
          mesa-vulkan-drivers

    # The GTK native-print tests call `gtk::init`, which needs a display server.
    # Hosted runners are headless, so without this they fail with
    # "Failed to initialize GTK". A virtual framebuffer lets them run for real
    # rather than being skipped.
    - name: Start virtual display
      if: runner.os == 'Linux' && matrix.tests
      run: |
        Xvfb :99 -screen 0 1280x1024x24 &
        echo "DISPLAY=:99" >> "$GITHUB_ENV"

    # `choco install openssl` pulls a 245 MB installer from slproweb.com on every
    # run - about 88s, and a third-party download inside the build path. Cache the
    # installed tree instead. Both candidate locations are cached because the
    # package has used each at different versions.
    #
    # The env-var detection below still runs unconditionally: GITHUB_ENV does not
    # persist between runs, so OPENSSL_DIR/OPENSSL_LIB_DIR must be re-exported
    # even when the install itself was restored from cache.
    # Saved from main only (the step after the install), so a test/** run
    # never stores a second 270 MB copy against the 10 GB limit.
    - name: Restore OpenSSL
      id: openssl
      if: runner.os == 'Windows'
      uses: actions/cache/restore@v4
      with:
        path: |
          C:\Program Files\OpenSSL
          C:\Program Files\OpenSSL-Win64
        key: openssl-${{ runner.os }}-choco-v1

    - name: Install Windows Dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if ((Test-Path "C:\Program Files\OpenSSL\include") -or
            (Test-Path "C:\Program Files\OpenSSL-Win64\include")) {
            Write-Host "OpenSSL restored from cache; skipping choco install"
        } else {
            choco install openssl -y
        }
        $openssl_dir = ""
        if (Test-Path "C:\Program Files\OpenSSL\include") {
            $openssl_dir = "C:\Program Files\OpenSSL"
        } elseif (Test-Path "C:\Program Files\OpenSSL-Win64\include") {
            $openssl_dir = "C:\Program Files\OpenSSL-Win64"
        } else {
            [Console]::Error.WriteLine("OpenSSL include directory not found!")
            exit 1
        }
        
        echo "OPENSSL_DIR=$openssl_dir" >> $env:GITHUB_ENV
        
        # Find the actual library directory
        $lib_file = Get-ChildItem -Path $openssl_dir -Filter "*crypto*.lib" -Recurse | Select-Object -First 1
        if ($lib_file) {
            echo "OPENSSL_LIB_DIR=$($lib_file.DirectoryName)" >> $env:GITHUB_ENV
            if ($lib_file.Name -ne "libcrypto.lib") {
                Copy-Item $lib_file.FullName "$($lib_file.DirectoryName)\libcrypto.lib"
            }
        } else {
          Write-Warning "Could not find *crypto*.lib inside $openssl_dir"
        }

    - name: Save OpenSSL
      if: runner.os == 'Windows' && steps.openssl.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: |
          C:\Program Files\OpenSSL
          C:\Program Files\OpenSSL-Win64
        key: ${{ steps.openssl.outputs.cache-primary-key }}

    - name: Format
      run: cargo fmt --all -- --check

    # No separate `cargo check` step: clippy performs the same analysis over the
    # same target set and reports the same compile errors, so checking first only
    # re-ran the workspace crates through a second, differently-fingerprinted
    # pass. Dependencies were already shared between the two.
    #
    # No `--target` either. Every leg of this matrix names its own host triple
    # (macos-15/aarch64-apple-darwin, ubuntu-22.04/x86_64-unknown-linux-gnu,
    # windows-latest/x86_64-pc-windows-msvc) and no RUSTFLAGS are set anywhere,
    # so passing it was semantically identical to a host build while costing
    # real resources: it forced artifacts into target/<triple>/, rebuilt the
    # proc-macro and build-script dependencies a second time for the host, and
    # was the only reason this job could not share the host cache above.
    # The matrix still pins the toolchain target, so platform coverage is
    # unchanged. release.yml keeps its `--target` flags - those cross-compile
    # both macOS architectures for the universal binary and are genuine.
    - name: Clippy
      run: cargo clippy --locked --workspace -- -D warnings

    # `direct-bir` (filing with the BIR itself) is off in every build that ships, so nothing above compiles the
    # dispatcher client or the sftp_harness binary. This keeps them building.
    - name: Clippy, bir-core with direct-bir
      run: cargo clippy --locked -p bir-core --features direct-bir -- -D warnings

    # No package that ships can turn `direct-bir` on, whatever features it is built with: bir-core's own feature
    # list is the only place that names it. `cargo tree` prints a feature of bir-core only when something enables it.
    - name: Nothing that ships enables direct-bir
      shell: bash
      run: |
        tree=$(cargo tree --locked -p bir-app-api -p bir-cli -p bir-mcp -p bir-print --all-features -e features -i bir-core)
        if grep -q 'direct-bir' <<<"$tree"; then
          echo "$tree" | grep -B2 -A2 'direct-bir'
          echo "::error::a shipped package enables bir-core's direct-bir feature"
          exit 1
        fi

    # One command per line: this job's default shell is pwsh on windows-latest,
    # and bash `\` continuations are a parse error there.
    - name: Frozen HTML inventory and TIN name stamps
      run: |
        python3 .ci-html/tools/formgen/freeze_html.py --verify --out html-frozen --index rules/index.json
        python3 .ci-html/tools/formgen/stamp_frozen_names.py --self-test
        python3 .ci-html/tools/formgen/stamp_frozen_names.py --check-all --html-root html-frozen --rules-root rules/forms --catalog .ci-html/tools/formgen/identity/catalog.json

    # bir-app-api's tests run here (test lane only). They need the debug-only
    # account-gate bypass (release builds ignore both), the dry-run sender, and
    # no keychain.
    - name: Test
      if: matrix.tests
      env:
        EBIR_TEST_ENV: "1"
        BIR_AUTH_BYPASS: "1"
        BIR_SFTP_DRY_RUN: "1"
        BUWIZ_NO_KEYCHAIN: "1"
      run: cargo test --locked --workspace

    # The page-versus-print audit of all 43 forms is ignored in the run above because it writes a report. It runs here
    # in the test lane: a form that does not open, build its print map, come back from a fill, a save and a reopen,
    # or fill its print sheet fails the step; the other classes are the report's findings (the uploaded runtime.md).
    - name: Page-versus-print audit (all 43 forms)
      if: matrix.tests
      env:
        EBIR_TEST_ENV: "1"
        BIR_AUTH_BYPASS: "1"
        BIR_SFTP_DRY_RUN: "1"
        BUWIZ_NO_KEYCHAIN: "1"
      run: cargo test --locked -p bir-app-api --lib -- --ignored audit_all_screen_forms

    - name: Upload the page-versus-print audit
      if: always() && matrix.tests && matrix.os == 'ubuntu-22.04'
      uses: actions/upload-artifact@v4
      with:
        name: screen-form-audit
        path: tmp/screen-form-audit/runtime.*
        if-no-files-found: ignore

    # The production-filing boundary stays gating on every PR, in the quick
    # lane, whatever the validation-rules jobs below decide. It scans all of
    # bir-core/src (transport, import, cron, the 2550Q guards) and nsh/src, so
    # almost any app change can open it. In the quick lane it builds
    # bir-rules-codegen from the restored cache; in the test lane it reuses the
    # test build. A boundary failure is far more serious than an open
    # validation slice.
    - name: Check validation-rules production boundaries
      run: cargo run -q --locked -p bir-rules-codegen -- status --boundaries-only

  windows-setup:
    name: Build and audit unsigned Windows Setup
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    uses: ./.github/workflows/release-windows.yml

  # The NSH app's type check for the quick lane: `just nsh-check -v`, the
  # crate (`cargo check --all-targets`) and then the TSX types, exactly as the
  # NSH app jobs run it, plus the cheap check that the app cannot enable
  # direct-bir. Linux only; nsh.yml builds and tests the app in the test lane.
  # It needs the nsh command line and the NSH dependency builds, which it only
  # restores (from main's nsh.yml runs); it never saves a dependency cache.
  nsh-check:
    name: NSH app type check (Linux)
    needs: changes
    if: needs.changes.outputs.nsh_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # As nsh.yml, so the restored dependency builds match: one compiler for both checkouts, no incremental builds,
      # no debug info.
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      BUWIZ_NO_KEYCHAIN: "1"
      EBIR_TEST_ENV: "1"
      BIR_AUTH_BYPASS: "1"
      BIR_SFTP_DRY_RUN: "1"
    steps:
    - name: Check out buwiz-forms
      uses: actions/checkout@v4
      with:
        path: buwiz-forms

    # The pin lives in nsh.yml only ("change it here and nowhere else").
    - name: Read the NSH pin from nsh.yml
      id: pin
      run: |
        ref=$(sed -n 's/^  NSH_PINNED_REF: *\([0-9a-f]\{40\}\) *$/\1/p' buwiz-forms/.github/workflows/nsh.yml)
        [ -n "$ref" ] || { echo "::error::no NSH_PINNED_REF in nsh.yml"; exit 1; }
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - name: Check out NSH (the pinned commit, beside buwiz-forms)
      uses: actions/checkout@v4
      with:
        repository: hexuria/nsh
        ref: ${{ steps.pin.outputs.ref }}
        token: ${{ secrets.NSH_REPO_TOKEN || github.token }}
        path: nsh
        persist-credentials: false

    - name: Check the two checkouts line up
      run: |
        test -f nsh/crates/nsh-core/Cargo.toml
        test -f buwiz-forms/nsh/Cargo.toml
        git -C nsh log -1 --format='NSH at %H %s'

    # The same packages and package cache as nsh.yml's Linux job (keep the two
    # lists equal); restored only, nsh.yml's main runs save it.
    - name: Restore the Linux packages
      uses: actions/cache/restore@v4
      with:
        path: ~/apt-archives
        key: nsh-linux-apt-${{ runner.arch }}-${{ hashFiles('buwiz-forms/.github/workflows/nsh.yml') }}
        restore-keys: nsh-linux-apt-${{ runner.arch }}-

    - name: Install GTK 4, WebKitGTK, GStreamer and the build tools
      timeout-minutes: 45
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        mkdir -p ~/apt-archives/partial
        sudo apt-get update
        sudo -E apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" \
          build-essential pkg-config perl python3 \
          clang libclang-dev libgtk-4-dev libwebkitgtk-6.0-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
          libdbus-1-dev libssl-dev \
          xvfb xauth at-spi2-core libxtst6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.99.0
        components: clippy, rustfmt

    - name: Install just
      run: cargo install just --version 1.45.0 --locked

    # huacnlee/cargo and the dependency builds nsh.yml's Linux job saves on
    # main. Not on main itself: the action saves whenever it runs on main, and
    # a check-only entry saved first would stand in for the complete one the
    # test jobs need (the first save of a key defines it). A push to main runs
    # this job with rustup's cargo and no dependency cache: slower, and nobody
    # waits on it.
    - name: Install huacnlee/cargo
      if: github.ref != 'refs/heads/main'
      uses: ./nsh/.github/actions/cargo
      with:
        cache: buwiz-nsh-app
        lockfiles: buwiz-forms/nsh/Cargo.lock

    # The command line is the same file whoever builds it, so main may save it.
    - name: Restore the nsh command line
      id: nsh-cli
      uses: actions/cache/restore@v4
      with:
        path: ~/BuwizNsh/tools
        key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.ref }}

    - name: Build the nsh command line
      if: steps.nsh-cli.outputs.cache-hit != 'true'
      working-directory: nsh
      run: cargo install --locked --path crates/nsh-cli --root "$HOME/BuwizNsh/tools"

    - name: Save the nsh command line
      if: steps.nsh-cli.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/BuwizNsh/tools
        key: ${{ steps.nsh-cli.outputs.cache-primary-key }}

    - name: Put the nsh command line on the path
      run: |
        echo "$HOME/BuwizNsh/tools/bin" >> "$GITHUB_PATH"
        "$HOME/BuwizNsh/tools/bin/nsh" -V

    - name: nsh check (the crate, then the TSX types)
      working-directory: buwiz-forms
      run: just nsh-check -v

    # As nsh.yml's Linux job: with every feature of the app on, on every
    # target, nothing in its dependency tree enables bir-core's `direct-bir`.
    - name: The app does not enable direct-bir
      working-directory: buwiz-forms
      run: |
        tree=$(cargo tree --manifest-path nsh/Cargo.toml --all-features --target all -e features -i bir-core)
        if grep -q 'direct-bir' <<<"$tree"; then
          echo "$tree" | grep -B2 -A2 'direct-bir'
          echo "::error::the app enables bir-core's direct-bir feature"
          exit 1
        fi

  # Decides what this run does: scripts/ci_plan.py (docs/CI.md has the same
  # rules in words, and scripts/tests/test_ci_plan.py tests them). The lane
  # comes from the event, the systems from the branch name or the inputs, and
  # the suites from the files the change touches. nsh.yml's `plan` job runs the
  # same script.
  changes:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lane: ${{ steps.decide.outputs.lane }}
      check: ${{ steps.decide.outputs.check }}
      check_matrix: ${{ steps.decide.outputs.check_matrix }}
      nsh_check: ${{ steps.decide.outputs.nsh_check }}
      scripts: ${{ steps.decide.outputs.scripts }}
      installer: ${{ steps.decide.outputs.installer }}
      validation: ${{ steps.decide.outputs.validation }}
      validation_matrix: ${{ steps.decide.outputs.validation_matrix }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Decide
      id: decide
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
        IN_SYSTEMS: ${{ inputs.systems }}
        IN_SUITES: ${{ inputs.suites }}
        IN_SCREENS: ${{ inputs.screens }}
        IN_SHARD: ${{ inputs.shard }}
      run: python3 -I scripts/ci_plan.py

  # The Python script tests on their own, for changes `check` does not run for
  # (packaging, setup scripts, release workflows, the tests themselves). When
  # `check` runs, it runs them.
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Test Python scripts
      run: python -m unittest discover -s scripts/tests -v

  # The validation-rules audits check the extracted official rule corpus
  # (rules/, bir-rules*, form_rules), a library the app does not use for
  # filing today. A pull request runs them on Linux only, and only when it
  # changes one of those paths, carries the run-validation label or comes from
  # an ebirforms-* branch (work synced from hexuria/buwiz-validation). All three
  # systems run them in the nightly run and in a manual run whose suites name
  # `validation`: the v1 audit once ran on Windows only, which is exactly why
  # three Windows-path defects in rules/validate.ps1 went undetected on the
  # other two, so the nightly keeps every system covered.
  # The boundary check that guards production filing is NOT gated: it runs in
  # `check` on every PR.
  validation-rules-v1:
    needs: changes
    if: needs.changes.outputs.validation == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.validation_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.99.0

    # Reader only. `check` is the sole writer of host-<os>; see the comment
    # there. Saving from here too would let this job's much smaller target dir
    # win the race and define the shared entry for everyone.
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-${{ runner.os }}
        save-if: false

    - name: Audit legacy v1 rules corpus
      run: cargo run --locked -p bir-rules-codegen -- validate-v1

  validation-rules-v2:
    needs: changes
    if: needs.changes.outputs.validation == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.validation_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.99.0

    # Reader only - see the sole-writer comment in `check`.
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-${{ runner.os }}
        save-if: false

    # This filters one test by exact name, and a filter that matches nothing is
    # not an error to libtest: it prints "0 passed" and exits 0. So if the test
    # is ever renamed or moved to another crate, this step would go green while
    # the immutable-corpus census lock silently stopped being checked. Assert the
    # test actually ran rather than trusting the exit code.
    - name: Lock immutable v1 corpus census
      shell: bash
      run: |
        set -euo pipefail
        output=$(cargo test --locked -p bir-rules-codegen \
          corpus::tests::landed_v1_corpus_reconciles_its_published_counts -- --exact 2>&1)
        echo "$output"
        if ! grep -qE '^test result: ok\. 1 passed' <<<"$output"; then
          echo "::error::the corpus census test did not run - the filter matched no test." >&2
          echo "::error::Expected exactly 1 passed. Did the test move crates or get renamed?" >&2
          exit 1
        fi

    # `audit` is a distinct subcommand from `check` and was never run in CI.
    - name: Audit validation-rules v2 IR
      run: cargo run --locked -p bir-rules-codegen -- audit

    - name: Check generated validation rules
      run: cargo run --locked -p bir-rules-codegen -- check

    - name: Verify validation-rules digest roll
      run: cargo run --locked -p bir-rules-codegen -- roll-pin --all --dry-run

    - name: Report validation-rules operator census
      run: cargo run --locked -p bir-rules-codegen -- operator-census --json

    - name: Report validation-rules reconciliation
      run: cargo run --locked -p bir-rules-codegen -- reconciliation --json

    # Also gating on every PR from the `check` job; kept here so a validation
    # run is complete on its own.
    - name: Check validation-rules production boundaries
      run: cargo run -q --locked -p bir-rules-codegen -- status --boundaries-only

    - name: Check tracked validation evidence packet set
      if: ${{ hashFiles('evidence/validation-rules/packets/v1/packet-set.json') != '' }}
      run: cargo run --locked -p bir-rules-codegen -- check-evidence-packet-set --packet-root evidence/validation-rules/packets/v1

    # Reported, not gating - and deliberately distinct from the
    # `--boundaries-only` step above, which stays fail-closed and MUST keep
    # passing. That step asserts production authority is still closed; this one
    # asserts the active library objective is *finished*. Its open criteria are
    # the remaining work, not a regression: only 2550Q has a v2 rule set (and it
    # must never be promoted), so `v2-snapshot-coverage` reads 1/43 and
    # `validations-represented` 27/2007 by construction. Gating on it would mean
    # CI can only go green once the entire 43-form corpus is built.
    #
    # A boundary failure is far more serious than an open slice. Keeping this
    # non-gating is what preserves that signal: a red validation-rules-v2 job
    # now means a boundary broke.
    - name: Report complete validation library status (non-gating)
      continue-on-error: true
      if: ${{ hashFiles('evidence/validation-rules/packets/v1/packet-set.json') != '' }}
      run: cargo run -q --locked -p bir-rules-codegen -- status

    # No `cargo test -p bir-rules -p bir-rules-codegen -p bir-rules-platform` here.
    # The `check` job's `cargo test --locked --workspace` already runs exactly those
    # tests, and on all three OSes - so cross-platform coverage is unchanged, which
    # matters because a Windows-only job is what previously hid three path defects.
    # Running them twice per OS meant six executions of bir-rules-codegen's
    # generate::tests, each of which spawns a nested cargo build.
    #
    # The targeted steps above are NOT duplicates and stay: they are `cargo run`
    # subcommands plus the exact-name corpus census, none of which `cargo test
    # --workspace` performs.


  # Always-on guard: the painted desktop crate, the JS-shell crate and the
  # legacy app/ tree were retired, and nothing may bring their names or
  # paths back (not even docs).
  # No `needs` on purpose: a docs-only PR must still fail if it brings an
  # old name back. A test/** push skips it: the pull request's run checked the
  # same commit.
  legacy-guard:
    if: ${{ !startsWith(github.ref, 'refs/heads/test/') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Check for retired crate references
      run: python3 -I scripts/check_no_legacy_desktop.py
    - name: Check for retired shell references
      run: python3 -I scripts/check_no_bir_shell.py


  # A failed run on main - nightly, or the push a merge makes - opens (or
  # comments on) one tracking issue. Pull requests no longer have to be up to
  # date with main before merging, so two PRs that pass alone but break
  # together show up here instead of going unread.

  main-report:
    needs: [ ci-ok ]
    # `failure` only: a cancelled run is not a break.
    if: always() && needs.ci-ok.result == 'failure' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-22.04
    permissions:
      issues: write
    steps:
    - name: Open or update the main failure issue
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        EVENT: ${{ github.event_name }}
        SHA: ${{ github.sha }}
        RESULT: ${{ needs.ci-ok.result }}
      run: |
        set -euo pipefail
        title="CI failed on main"
        body="$EVENT run on ${SHA:0:8}: $RUN_URL"$'\n\n'"- ci-ok: $RESULT"
        existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
        if [[ -n "$existing" ]]; then
          gh issue comment "$existing" --body "$body"
        else
          gh issue create --title "$title" --body "$body"
        fi

  # The one required status check (ruleset "Main"). Jobs above are skipped on
  # purpose, and a skipped matrix job reports no per-OS check names, so
  # requiring those names would leave such PRs waiting forever. It passes only
  # when `changes` decided, every job it asked for passed (the validation-rules
  # audits included: their old summary job is folded in here), and
  # legacy-guard passed. A job skipped because something it needs failed is a
  # failure here, not a skip. It cannot hang: `always()` runs it once every job
  # it needs has finished or been skipped.
  #
  # Named `ci-ok` in the quick lane only. A test/** push or a manual or nightly
  # run reports `tests-ok` instead, so a test lane on a pull request's commit
  # never adds a second `ci-ok` result (green or red) to the one the required
  # check reads.
  ci-ok:
    name: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/test/'))) && 'ci-ok' || 'tests-ok' }}
    needs: [ changes, check, nsh-check, windows-setup, scripts, validation-rules-v1, validation-rules-v2, legacy-guard ]
    if: always()
    runs-on: ubuntu-22.04
    steps:
    - name: Result
      shell: bash
      env:
        CHANGES: ${{ needs.changes.result }}
        CHECK: ${{ needs.check.result }}
        WANT_CHECK: ${{ needs.changes.outputs.check }}
        NSH_CHECK: ${{ needs.nsh-check.result }}
        WANT_NSH_CHECK: ${{ needs.changes.outputs.nsh_check }}
        WINDOWS_SETUP: ${{ needs.windows-setup.result }}
        WANT_WINDOWS_SETUP: ${{ needs.changes.outputs.installer }}
        SCRIPTS: ${{ needs.scripts.result }}
        WANT_SCRIPTS: ${{ needs.changes.outputs.scripts }}
        V1: ${{ needs.validation-rules-v1.result }}
        V2: ${{ needs.validation-rules-v2.result }}
        WANT_VALIDATION: ${{ needs.changes.outputs.validation }}
        LEGACY_GUARD: ${{ needs.legacy-guard.result }}
        WANT_LEGACY_GUARD: ${{ !startsWith(github.ref, 'refs/heads/test/') }}
      run: |
        set -euo pipefail
        echo "changes=$CHANGES check=$CHECK nsh-check=$NSH_CHECK windows-setup=$WINDOWS_SETUP scripts=$SCRIPTS validation-rules-v1=$V1 validation-rules-v2=$V2 legacy-guard=$LEGACY_GUARD"
        fail() { echo "::error::$1"; exit 1; }
        [[ "$CHANGES" == success ]] || fail "could not decide what to test (changes: $CHANGES)"
        expect() {
          if [[ "$3" == true ]]; then
            [[ "$2" == success ]] || fail "$1 was needed and finished: $2"
          else
            [[ "$2" == skipped || "$2" == success ]] || fail "$1 was not needed but finished: $2"
          fi
        }
        expect check "$CHECK" "$WANT_CHECK"
        expect nsh-check "$NSH_CHECK" "$WANT_NSH_CHECK"
        expect windows-setup "$WINDOWS_SETUP" "$WANT_WINDOWS_SETUP"
        expect scripts "$SCRIPTS" "$WANT_SCRIPTS"
        expect validation-rules-v1 "$V1" "$WANT_VALIDATION"
        expect validation-rules-v2 "$V2" "$WANT_VALIDATION"
        expect legacy-guard "$LEGACY_GUARD" "$WANT_LEGACY_GUARD"
