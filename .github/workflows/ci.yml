name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install macOS Dependencies
      if: runner.os == 'macOS'
      run: brew install typst

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        wget https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz
        tar -xf typst-x86_64-unknown-linux-musl.tar.xz
        sudo mv typst-*/typst /usr/local/bin/
        
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libx11-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libwayland-client0 \
          libasound2-dev \
          libudev-dev \
          libvulkan-dev \
          libfontconfig1-dev \
          libfreetype-dev \
          libssl-dev \
          libpolkit-gobject-1-dev \
          mesa-vulkan-drivers

    - name: Install Windows Dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install openssl typst -y
        $openssl_dir = ""
        if (Test-Path "C:\Program Files\OpenSSL\include") {
            $openssl_dir = "C:\Program Files\OpenSSL"
        } elseif (Test-Path "C:\Program Files\OpenSSL-Win64\include") {
            $openssl_dir = "C:\Program Files\OpenSSL-Win64"
        } else {
            Write-Error "OpenSSL include directory not found!"
            exit 1
        }
        
        echo "OPENSSL_DIR=$openssl_dir" >> $env:GITHUB_ENV
        
        # Find the actual library directory
        $lib_file = Get-ChildItem -Path $openssl_dir -Filter "*crypto*.lib" -Recurse | Select-Object -First 1
        if ($lib_file) {
            echo "OPENSSL_LIB_DIR=$($lib_file.DirectoryName)" >> $env:GITHUB_ENV
            if ($lib_file.Name -ne "libcrypto.lib") {
                Copy-Item $lib_file.FullName "$($lib_file.DirectoryName)\libcrypto.lib"
            }
        } else {
            Write-Warning "Could not find *crypto*.lib inside $openssl_dir"
        }

    - name: Check
      run: cargo check --workspace --target ${{ matrix.target }}

    - name: Clippy
      run: cargo clippy --workspace --target ${{ matrix.target }} -- -D warnings

    - name: Test
      run: cargo test --workspace --target ${{ matrix.target }}
