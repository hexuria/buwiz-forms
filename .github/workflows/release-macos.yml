name: Release (macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nsh.yml
      - .github/workflows/release-macos.yml
      - scripts/package_macos_release.sh
      - assets/macos/**
      - nsh/nsh.json

permissions:
  contents: read

# Serialise per ref. Tag pushes and workflow_dispatch runs are never
# cancelled: a release job that is signing, notarizing or publishing must be
# allowed to finish. pull_request runs may be cancelled by a newer push to the
# same PR — they are dry runs and safe to restart.
concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  APP_NAME: eBIRForms
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  # The public release jobs may consume only this exact, tested tag commit.
  # A successful branch workflow is not accepted as a substitute because the
  # tag may point at a different SHA. On workflow_dispatch / pull_request the
  # exact-tag rules are relaxed to "clean tree at this commit" and publish
  # stays false — those events are dry runs that never publish.
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tagged SHA, version, and lockfiles
        id: version
        shell: bash
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git ls-files --error-unmatch Cargo.lock package-lock.json nsh/Cargo.lock

          CARGO_VERSION="$(awk -F '"' '
            /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
            in_workspace_package && /^\[/ { exit }
            in_workspace_package && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"

          NSH_VERSION="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' nsh/nsh.json)"
          if [ -z "$NSH_VERSION" ]; then
            echo "Could not read version from nsh/nsh.json" >&2
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_TYPE" = "tag"
            test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
            test "$(git tag --points-at "$GITHUB_SHA" --list "$GITHUB_REF_NAME")" = "$GITHUB_REF_NAME"

            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must use exact vMAJOR.MINOR.PATCH syntax: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ -z "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
              echo "Release tag version $TAG_VERSION does not match Cargo workspace version $CARGO_VERSION" >&2
              exit 1
            fi
            if [ "$TAG_VERSION" != "$NSH_VERSION" ]; then
              echo "Release tag version $TAG_VERSION does not match nsh/nsh.json version $NSH_VERSION" >&2
              exit 1
            fi
            echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$CARGO_VERSION" ]; then
              echo "Could not read Cargo workspace version from Cargo.toml" >&2
              exit 1
            fi
            echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # The Rust steps (system libraries, toolchain, cache, "Verify Rust workspace") run for a tag and a manual run
      # only. On a pull request ci.yml's `check` job runs the same fmt, clippy and tests on this very commit, so
      # repeating them here cost 15 to 27 minutes of a runner and a 465 MB cache per pull request for nothing.
      - name: Install system dependencies
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-client0 \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libssl-dev \
            libpolkit-gobject-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            mesa-vulkan-drivers

      - name: Install Rust toolchain
        if: github.event_name != 'pull_request'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Rust cache
        if: github.event_name != 'pull_request'
        uses: Swatinem/rust-cache@v2

      - name: Check out formgen scripts from buwiz-forms-html
        uses: actions/checkout@v4
        with:
          repository: hexuria/buwiz-forms-html
          path: .ci-html
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test Python scripts
        run: python -m unittest discover -s scripts/tests -v

      # The env ci.yml's Test step gives bir-app-api's tests: the debug-only
      # account-gate bypass (release builds ignore it), the dry-run sender,
      # and no keychain.
      - name: Verify Rust workspace
        if: github.event_name != 'pull_request'
        env:
          EBIR_TEST_ENV: "1"
          BIR_AUTH_BYPASS: "1"
          BIR_SFTP_DRY_RUN: "1"
          BUWIZ_NO_KEYCHAIN: "1"
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace
          cargo clippy --locked --workspace -- -D warnings
          cargo test --locked --workspace

      - name: Verify frozen HTML inventory and TIN name stamps
        run: |
          python3 .ci-html/tools/formgen/freeze_html.py --verify --out html-frozen --index rules/index.json
          python3 .ci-html/tools/formgen/stamp_frozen_names.py --self-test
          python3 .ci-html/tools/formgen/stamp_frozen_names.py --check-all --html-root html-frozen --rules-root rules/forms --catalog .ci-html/tools/formgen/identity/catalog.json
          python3 scripts/audit_no_legacy.py

  # ── macOS Universal ───────────────────────────────────────────────────────
  # The shipped app is the NSH app (nsh/), packaged universal by
  # `nsh package --target macos --arch universal` and then signed with the
  # Developer ID, notarized and stapled by scripts/package_macos_release.sh.
  build-macos:
    needs: preflight
    # Fork PRs receive no secrets and would only fail closed on the missing
    # signing material; skip them. Same-repo PRs keep failing closed if a
    # required secret is absent.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15  # M1 runner — can build both arm64 and x86_64
    timeout-minutes: 180
    # nsh/Cargo.toml names the NSH crates as ../../nsh/crates/..., so the two
    # checkouts sit side by side: <workspace>/buwiz-forms and <workspace>/nsh.
    defaults:
      run:
        working-directory: buwiz-forms
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      EXPECTED_SIGNING_IDENTITY: "Developer ID Application: Goldcoders Corp (5KZ8MD34QW)"
    steps:
      - uses: actions/checkout@v4
        with:
          path: buwiz-forms

      - name: Require macOS signing and notarization inputs
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required macOS release secret: $name" >&2
              exit 1
            fi
          done
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::warning::optional secret $name is not set; the build will ship without Google OAuth credentials"
            fi
          done

      # One pin for every workflow: NSH_PINNED_REF in nsh.yml.
      - name: Read the NSH pin
        id: nsh-pin
        shell: bash
        run: |
          ref="$(awk '/^  NSH_PINNED_REF:/ { print $2; exit }' .github/workflows/nsh.yml)"
          repository="$(awk '/^  NSH_REPOSITORY:/ { print $2; exit }' .github/workflows/nsh.yml)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "NSH_PINNED_REF in nsh.yml is not a commit: $ref" >&2; exit 1; }
          [ -n "$repository" ] || { echo "NSH_REPOSITORY missing from nsh.yml" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Check out NSH (the pinned commit, beside buwiz-forms)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.nsh-pin.outputs.repository }}
          ref: ${{ steps.nsh-pin.outputs.ref }}
          token: ${{ secrets.NSH_REPO_TOKEN || github.token }}
          path: nsh
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # The same cache key nsh.yml saves, so a pin it already built is reused.
      - name: Restore the nsh command line
        id: nsh-cli
        uses: actions/cache/restore@v4
        with:
          path: ~/BuwizNsh/tools
          key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.nsh-pin.outputs.ref }}

      - name: Build the nsh command line
        if: steps.nsh-cli.outputs.cache-hit != 'true'
        working-directory: nsh
        run: cargo install --locked --path crates/nsh-cli --root "$HOME/BuwizNsh/tools"

      - name: Put the nsh command line on the path
        run: |
          echo "$HOME/BuwizNsh/tools/bin" >> "$GITHUB_PATH"
          "$HOME/BuwizNsh/tools/bin/nsh" -V

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: buwiz-forms/nsh
          shared-key: nsh-release-${{ runner.os }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check out formgen scripts from buwiz-forms-html
        uses: actions/checkout@v4
        with:
          repository: hexuria/buwiz-forms-html
          path: buwiz-forms/.ci-html
          persist-credentials: false

      - name: Verify frozen HTML
        run: |
          python3 .ci-html/tools/formgen/freeze_html.py --verify --out html-frozen --index rules/index.json
          python3 .ci-html/tools/formgen/stamp_frozen_names.py --check-all --html-root html-frozen --rules-root rules/forms --catalog .ci-html/tools/formgen/identity/catalog.json
          python3 scripts/write_frozen_html_identity.py --html-frozen html-frozen --source-revision ${{ github.sha }} --out assets/form-renderer-build-identity.json

      - name: Import signing certificate into temporary keychain
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          IDENTITY_COUNT="$(printf '%s\n' "$IDENTITIES" | awk '/"Developer ID Application:/ { count++ } END { print count + 0 }')"
          if [ "$IDENTITY_COUNT" -ne 1 ]; then
            echo "Expected exactly one imported Developer ID Application identity" >&2
            printf '%s\n' "$IDENTITIES" >&2
            exit 1
          fi
          IDENTITY_LINE="$(printf '%s\n' "$IDENTITIES" | awk '/"Developer ID Application:/ { print; exit }')"
          case "$IDENTITY_LINE" in
            *"$EXPECTED_SIGNING_IDENTITY"*) ;;
            *)
              echo "Imported Developer ID identity is not $EXPECTED_SIGNING_IDENTITY" >&2
              printf '%s\n' "$IDENTITY_LINE" >&2
              exit 1
              ;;
          esac
          SIGNING_IDENTITY="$(printf '%s\n' "$IDENTITY_LINE" | awk '{ print $2 }')"

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Package signed and notarized DMG and update archives
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          REQUIRE_NOTARIZATION=1 bash scripts/package_macos_release.sh

      # The updater installs an update only when this passes
      # (nsh-updater, macOS install: codesign --verify --deep --strict).
      - name: Check the update archive passes the updater's signature check
        shell: bash
        run: |
          check_dir="$(mktemp -d)"
          tar -xzf target/release-artifacts/*-macos-aarch64.tar.gz -C "$check_dir"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$check_dir/$APP_NAME.app"
          spctl --assess --type execute --verbose=2 "$check_dir/$APP_NAME.app"
          xcrun stapler validate "$check_dir/$APP_NAME.app"
          rm -rf "$check_dir"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            buwiz-forms/target/release-artifacts/*.dmg
            buwiz-forms/target/release-artifacts/*.tar.gz
            buwiz-forms/target/release-artifacts/*.sha256

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"

  # ── Publish to the tag's GitHub Release ───────────────────────────────────
  # release.yml's softprops job may create the same tag's release concurrently,
  # so this job creates it only when missing and then uploads the DMG and the
  # update archives.
  publish:
    concurrency:
      group: release-feed-${{ github.ref }}
      cancel-in-progress: false
    needs: [preflight, build-macos]
    if: github.event_name == 'push' && needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      NSH_UPDATE_KEY: ${{ secrets.NSH_UPDATE_KEY }}
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts

      - name: Verify checksums
        working-directory: artifacts
        run: sha256sum -c ./*.sha256

      - name: Publish to GitHub Release
        working-directory: artifacts
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            || gh release view "$TAG" >/dev/null 2>&1
          gh release upload "$TAG" ./*.dmg ./*.tar.gz ./*.sha256 --clobber

      - name: Check out the manifest script
        uses: actions/checkout@v4

      - name: Check out pinned NSH CLI
        if: env.NSH_UPDATE_KEY != ''
        uses: actions/checkout@v4
        with:
          repository: hexuria/nsh
          ref: ca39c0e9103a389a31ea280799ef34796d7aac70
          path: .ci-nsh
          persist-credentials: false

      - name: Install NSH CLI toolchain
        if: env.NSH_UPDATE_KEY != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned NSH CLI
        if: env.NSH_UPDATE_KEY != ''
        run: cargo install --locked --path .ci-nsh/crates/nsh-cli

      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_update_manifest.py --tag "$TAG" --repo "$GH_REPO"
