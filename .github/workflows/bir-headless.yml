# GitHub Release for the bir-headless binary only.
# Tag pattern: bir-headless-vMAJOR.MINOR.PATCH (example bir-headless-v0.1.0).
# Does not cargo-publish, does not codesign, and does not run on desktop v* tags.
name: bir-headless

on:
  push:
    tags:
      - "bir-headless-v*"

permissions:
  contents: write

concurrency:
  group: bir-headless-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: bir-headless-x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            asset: bir-headless-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Require bir-headless-vMAJOR.MINOR.PATCH
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^bir-headless-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be bir-headless-vMAJOR.MINOR.PATCH: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-client0 \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libssl-dev \
            libpolkit-gobject-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mesa-vulkan-drivers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build bir-headless
        run: cargo build --locked --release -p bir-desktop --bin bir-headless --features agent --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/bir-headless" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: find dist -type f -print

      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            bir-headless agent host (`cargo build --release -p bir-desktop --bin bir-headless --features agent`).
            Not published to crates.io. The desktop app is still the `vMAJOR.MINOR.PATCH` release.
          files: |
            dist/bir-headless-x86_64-unknown-linux-gnu
            dist/bir-headless-aarch64-apple-darwin
