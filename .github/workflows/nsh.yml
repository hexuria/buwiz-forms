name: NSH app

# The NSH (TSX) app in nsh/ (docs/platforms/nsh.md, nsh/AGENTS.md): type check, build, Rust tests and the headless TSX
# tests on macOS, Linux and Windows; on Linux also the Linux development host and the first real-window test, on
# Windows also the Windows development host; plus the plain-SQLite tests of the two crates the app is built on.
#
# The app depends on NSH 0.5.1 by relative path (nsh/Cargo.toml, ../../nsh/crates/...), so CI checks NSH out next to
# this repository. The commit it needs is the hexuria/nsh fork with upstream v0.5.1 merged and two Windows fixes:
# 87e0a4ea4, the tip of the `buwiz` branch since hexuria/nsh#13. It runs on GitHub's hosted runners (macos-15 for the
# app, windows-2025 for the app on Windows, ubuntu-24.04 for the plain-SQLite tests) and has run and passed there; its
# steps are the ones that pass on the owner's Mac (nsh/AGENTS.md "Commands"), and the Windows job's those that pass by
# hand on Windows Server 2022.
#
# hexuria/nsh is public, so no secret is needed today: the checkout falls back to the job's own token. If it ever turns
# private, create NSH_REPO_TOKEN, a token that can read hexuria/nsh (a fine-grained personal access token with
# "Contents: read" on that one repository); without it the step then fails. Pull requests from forks never get it.

# The test lane only (docs/CI.md): a pull request no longer starts these jobs. ci.yml's quick lane runs the app's type
# check (`nsh check`) on every pull request that touches the app; the builds and tests here run on
#   - a push to test/** (`just ci-test`): the branch name picks the systems, the changed files the suites;
#   - a manual run (`gh workflow run nsh.yml`, docs/CI.md): the systems, suites, screen-test filter and shard asked for;
#   - the nightly run on main: everything on all three systems, one runner per system.
# Only main's runs save caches every branch can read (a cache saved on another ref is read by that ref alone): the
# dependency builds of ./nsh/.github/actions/cargo (it saves on refs/heads/main only), the nsh command line, the Linux
# packages and core-plain's rust-cache. So the nightly run and `just ci-main` are what keep them fresh; a push to main
# no longer runs this workflow.
on:
  push:
    branches: [ "test/**" ]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      systems:
        description: "Systems: all, or a comma list of linux, windows, macos"
        type: string
        default: "linux,windows"
      suites:
        description: "Suites: all, or a comma list of rust, screens, build, installer, validation"
        type: string
        default: "all"
      screens:
        description: "Screen-test files to run, e.g. screens/form/** or screens/form (empty: all)"
        type: string
        default: ""
      shard:
        description: "Screen-test shard to run, of three (main always runs one runner per system)"
        type: choice
        options: [ "all", "0", "1", "2" ]
        default: "all"

permissions:
  contents: read

# One run per ref: a newer push to the same test/... branch cancels the older run. main's runs (nightly and manual)
# each get a group of their own and are never cancelled: they are the ones that save the caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI's debug builds, as NSH's own CI: faster builds and much smaller dependency caches (the
  # repository's cache storage is full); panics still name their file and line.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # THE PIN: the NSH commit every job builds against. Change it here and nowhere else.
  # 8c78cfd6d8ffcef260728ad2503d43c3bc9e86bf = hexuria/nsh, branch buwiz-next: upstream v0.6.1, the doors the window's
  # control plane plugs into (branch gpui-agent, SOCKET.md there), and the app's own changes. The control plane itself
  # is hexuria/nsh-gpui-agent, pinned in nsh/Cargo.toml. The release workflows and their policy test name this commit too.
  NSH_PINNED_REF: 8c78cfd6d8ffcef260728ad2503d43c3bc9e86bf
  NSH_REPOSITORY: hexuria/nsh
  # The four safety variables: nothing reaches the keychain, a real database or the BIR.
  BUWIZ_NO_KEYCHAIN: "1"
  EBIR_TEST_ENV: "1"
  BIR_AUTH_BYPASS: "1"
  BIR_SFTP_DRY_RUN: "1"

jobs:
  # Decides what this run does: scripts/ci_plan.py, the same script as ci.yml's `changes` job (docs/CI.md).
  plan:
    runs-on: ubuntu-24.04
    outputs:
      nsh_macos: ${{ steps.decide.outputs.nsh_macos }}
      nsh_linux: ${{ steps.decide.outputs.nsh_linux }}
      nsh_windows: ${{ steps.decide.outputs.nsh_windows }}
      screens: ${{ steps.decide.outputs.screens }}
      build: ${{ steps.decide.outputs.build }}
      nsh_rust: ${{ steps.decide.outputs.nsh_rust }}
      core_plain: ${{ steps.decide.outputs.core_plain }}
      linux_packages: ${{ steps.decide.outputs.linux_packages }}
      shards: ${{ steps.decide.outputs.shards }}
      shard_count: ${{ steps.decide.outputs.shard_count }}
      lead_shard: ${{ steps.decide.outputs.lead_shard }}
      screens_filter: ${{ steps.decide.outputs.screens_filter }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BRANCH: ${{ github.ref_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          IN_SYSTEMS: ${{ inputs.systems }}
          IN_SUITES: ${{ inputs.suites }}
          IN_SCREENS: ${{ inputs.screens }}
          IN_SHARD: ${{ inputs.shard }}
        run: python3 -I scripts/ci_plan.py

  # The suites, in every job below: `build` is the bundle, the agent build, the other targets' compiles, the
  # development host and the real-window test; `rust` the app crate's Rust tests (and core-plain-test); `screens` the
  # headless TSX tests. The lead shard (shard 0 unless a manual run names another) runs `nsh check` and the build and
  # Rust suites; every shard runs its part of the screen tests. A branch's run splits the screen tests over three
  # runners; main's runs use one runner per system, so the dependency cache main saves holds what every shard needs.
  nsh-macos:
    name: NSH app (macOS, shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.nsh_macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: macos-15
    # Cold: the nsh command line alone is 10 minutes on an M-series Mac, and every test file opens a headless runner.
    timeout-minutes: 120
    env:
      # One compiler for everything, whatever rust-toolchain.toml file cargo meets (this repository's says 1.99.0, the
      # NSH checkout's says "stable" plus mobile targets). Keep it equal to this repository's rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_INCREMENTAL: "0"
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ needs.plan.outputs.shard_count }}
      LEAD_SHARD: ${{ matrix.shard == fromJSON(needs.plan.outputs.lead_shard) }}
      SUITE_BUILD: ${{ needs.plan.outputs.build }}
      SUITE_RUST: ${{ needs.plan.outputs.nsh_rust }}
      SUITE_SCREENS: ${{ needs.plan.outputs.screens }}
      SCREENS_FILTER: ${{ needs.plan.outputs.screens_filter }}
    steps:
      # The layout the app's Cargo.toml expects: <workspace>/buwiz-forms and <workspace>/nsh side by side, because
      # buwiz-forms/nsh/Cargo.toml names the NSH crates as ../../nsh/crates/...
      - name: Check out buwiz-forms
        uses: actions/checkout@v4
        with:
          path: buwiz-forms

      - name: Check out NSH (the pinned commit, beside buwiz-forms)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NSH_REPOSITORY }}
          ref: ${{ env.NSH_PINNED_REF }}
          token: ${{ secrets.NSH_REPO_TOKEN || github.token }}
          path: nsh
          persist-credentials: false

      - name: Check the two checkouts line up
        run: |
          test -f nsh/crates/nsh-core/Cargo.toml
          test -f buwiz-forms/nsh/Cargo.toml
          git -C nsh log -1 --format='NSH at %H %s'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Install just
        run: cargo install just --version 1.45.0 --locked

      # huacnlee/cargo, as NSH's own CI and the owner's Mac use it: the NSH checkout's action installs the release it
      # pins in place of rustup's cargo and restores the dependency builds (main saves them, pull requests restore).
      - name: Install huacnlee/cargo
        uses: ./nsh/.github/actions/cargo
        with:
          cache: buwiz-nsh-app
          lockfiles: buwiz-forms/nsh/Cargo.lock

      # The command line the just recipes call (~/BuwizNsh/tools/bin/nsh), built from the same checkout the app builds
      # against, so the two always agree. Cached by the pin: a new pin builds it again. Saved right after the build,
      # not at the end of the job, so a later failing or cancelled step does not throw 25 minutes of building away.
      - name: Restore the nsh command line
        id: nsh-cli
        uses: actions/cache/restore@v4
        with:
          path: ~/BuwizNsh/tools
          key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.NSH_PINNED_REF }}

      - name: Build the nsh command line
        if: steps.nsh-cli.outputs.cache-hit != 'true'
        working-directory: nsh
        run: cargo install --locked --path crates/nsh-cli --root "$HOME/BuwizNsh/tools"

      # Only main's lead shard saves: the shards of a new pin's first run all build it, and one copy is enough. A
      # branch's copy would be readable by that branch alone and take room from main's caches.
      - name: Save the nsh command line
        if: steps.nsh-cli.outputs.cache-hit != 'true' && env.LEAD_SHARD == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/BuwizNsh/tools
          key: ${{ steps.nsh-cli.outputs.cache-primary-key }}

      - name: Put the nsh command line on the path
        run: |
          echo "$HOME/BuwizNsh/tools/bin" >> "$GITHUB_PATH"
          "$HOME/BuwizNsh/tools/bin/nsh" -V

      - name: nsh check (the crate, then the TSX types)
        if: env.LEAD_SHARD == 'true'
        working-directory: buwiz-forms
        run: just nsh-check -v

      - name: nsh build (every warning is a finding)
        if: env.LEAD_SHARD == 'true' && env.SUITE_BUILD == 'true'
        working-directory: buwiz-forms
        run: just nsh-build

      - name: Rust tests of the app's crate
        if: env.LEAD_SHARD == 'true' && env.SUITE_RUST == 'true'
        working-directory: buwiz-forms
        run: cargo test --manifest-path nsh/Cargo.toml --no-fail-fast

      # The agent build, which nothing else here compiles. First the window's control plane (hexuria/nsh-gpui-agent)
      # against this NSH: the app's crate and its tests build with `agent`, and the two data-plane tests run. Then
      # the host nsh generates: with `agent` it must hold one nsh-testing, the checkout's. cargo tree stops with
      # "ambiguous" when the control plane's Git copy of NSH is in the graph too; that build compiles, and its
      # window listener never starts.
      - name: The agent feature builds, with one NSH in the host
        if: env.LEAD_SHARD == 'true' && env.SUITE_BUILD == 'true'
        working-directory: buwiz-forms
        run: |
          cargo test --manifest-path nsh/Cargo.toml --features agent --no-run
          cargo test --manifest-path nsh/Cargo.toml --features agent --test agent --test agent_send
          cargo tree --manifest-path nsh/.nsh/rust/Cargo.toml -p nsh-app-nsh-app-ebirforms-macos-host \
            --features app_nsh_app_ebirforms/agent -i nsh-testing --depth 1
          # The iOS arm of the agent code is compiled nowhere else (it once named a crate the app does not have).
          rustup target add aarch64-apple-ios-sim
          cargo check --manifest-path nsh/Cargo.toml --features agent --target aarch64-apple-ios-sim

      # The app as an iPhone and iPad run it: the device target, which the simulator check above does not compile.
      # The relay client (its HPKE, signing and WebSocket crates) and the Keychain code must build for it.
      - name: The app compiles for an iPhone
        if: env.LEAD_SHARD == 'true' && env.SUITE_BUILD == 'true'
        working-directory: buwiz-forms
        run: |
          rustup target add aarch64-apple-ios
          cargo check --locked --manifest-path nsh/Cargo.toml --target aarch64-apple-ios

      # Every *.test.ts and *.test.tsx, one headless run per file, as `just nsh-test` does (nsh/verify holds real-window
      # verifiers that need the owner's data copy, so it is left out). `just nsh-test <file>` sets the four safety
      # variables again and never sets BIR_DATABASE_PATH. The script holds the shard rule (line k of the sorted list
      # belongs to shard k % SHARDS) and the manual run's file filter.
      - name: Headless TSX tests, file by file
        if: env.SUITE_SCREENS == 'true'
        working-directory: buwiz-forms/nsh
        run: bash ../scripts/nsh_screen_tests.sh

  # The same app on Linux (NSH's GTK 4 backend, docs/platforms/nsh-linux-handover.md): the CLI built from the pin, the
  # crate and its TSX types, the bundle, the crate's Rust tests and the headless TSX tests (sharded as on macOS), the
  # development host `nsh run --target linux` builds, and the first real-window test (`shots/base`, the handover's L-list)
  # in GTK windows on a virtual display, its screenshots kept as an artifact. The packages are the handover's install
  # line (section 3.2), which is NSH's own Linux CI's plus the app's: libdbus and OpenSSL's build, and python3 for stylo.
  nsh-linux:
    name: NSH app (Linux, shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.nsh_linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_INCREMENTAL: "0"
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ needs.plan.outputs.shard_count }}
      LEAD_SHARD: ${{ matrix.shard == fromJSON(needs.plan.outputs.lead_shard) }}
      SUITE_BUILD: ${{ needs.plan.outputs.build }}
      SUITE_RUST: ${{ needs.plan.outputs.nsh_rust }}
      SUITE_SCREENS: ${{ needs.plan.outputs.screens }}
      SCREENS_FILTER: ${{ needs.plan.outputs.screens_filter }}
    steps:
      - name: Check out buwiz-forms
        uses: actions/checkout@v4
        with:
          path: buwiz-forms

      - name: Check out NSH (the pinned commit, beside buwiz-forms)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NSH_REPOSITORY }}
          ref: ${{ env.NSH_PINNED_REF }}
          token: ${{ secrets.NSH_REPO_TOKEN || github.token }}
          path: nsh
          persist-credentials: false

      - name: Check the two checkouts line up
        run: |
          test -f nsh/crates/nsh-core/Cargo.toml
          test -f buwiz-forms/nsh/Cargo.toml
          git -C nsh log -1 --format='NSH at %H %s'

      # GTK 4 and WebKitGTK 6.0 (which brings bubblewrap and xdg-dbus-proxy for its sandbox, and its helper processes),
      # GStreamer, clang for QuickJS's bindgen, libdbus and perl for the app's crates, python3 for stylo's build, and a
      # virtual display for the real-window test.
      # The downloaded packages are cached between runs (key: this file), so a slow mirror costs one cold run, not
      # every run: on the first runs one runner's mirror took over 20 minutes for 170 packages while the other shards'
      # took a minute or two. Non-interactive, and bounded so a hang fails the step rather than the job's two hours.
      - name: Restore the Linux packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: nsh-linux-apt-${{ runner.arch }}-${{ hashFiles('buwiz-forms/.github/workflows/nsh.yml') }}
          restore-keys: nsh-linux-apt-${{ runner.arch }}-

      - name: Install GTK 4, WebKitGTK, GStreamer and the build tools
        timeout-minutes: 45
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" \
            build-essential pkg-config perl python3 \
            clang libclang-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libdbus-1-dev libssl-dev \
            xvfb xauth at-spi2-core libxtst6
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          rm -rf ~/apt-archives/partial ~/apt-archives/lock

      # main only: every pull request used to save its own 110 MB copy whenever this file changed.
      - name: Save the Linux packages
        if: steps.apt-cache.outputs.cache-hit != 'true' && env.LEAD_SHARD == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Install just
        run: cargo install just --version 1.45.0 --locked

      - name: Install huacnlee/cargo
        uses: ./nsh/.github/actions/cargo
        with:
          cache: buwiz-nsh-app
          lockfiles: buwiz-forms/nsh/Cargo.lock

      - name: Restore the nsh command line
        id: nsh-cli
        uses: actions/cache/restore@v4
        with:
          path: ~/BuwizNsh/tools
          key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.NSH_PINNED_REF }}

      - name: Build the nsh command line
        if: steps.nsh-cli.outputs.cache-hit != 'true'
        working-directory: nsh
        run: cargo install --locked --path crates/nsh-cli --root "$HOME/BuwizNsh/tools"

      - name: Save the nsh command line
        if: steps.nsh-cli.outputs.cache-hit != 'true' && env.LEAD_SHARD == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/BuwizNsh/tools
          key: ${{ steps.nsh-cli.outputs.cache-primary-key }}

      - name: Put the nsh command line on the path
        run: |
          echo "$HOME/BuwizNsh/tools/bin" >> "$GITHUB_PATH"
          "$HOME/BuwizNsh/tools/bin/nsh" -V

      - name: nsh check (the crate, then the TSX types)
        if: env.LEAD_SHARD == 'true'
        working-directory: buwiz-forms
        run: just nsh-check -v

      - name: nsh build (every warning is a finding)
        if: env.LEAD_SHARD == 'true' && env.SUITE_BUILD == 'true'
        working-directory: buwiz-forms
        run: just nsh-build

      - name: Rust tests of the app's crate
        if: env.LEAD_SHARD == 'true' && env.SUITE_RUST == 'true'
        working-directory: buwiz-forms
        run: cargo test --manifest-path nsh/Cargo.toml --no-fail-fast

      # The app cannot file with the BIR itself: with every feature of the app on, on every target, nothing in its
      # dependency tree enables bir-core's `direct-bir` feature (the dispatcher client and SFTP to a host that is not
      # loopback). `cargo tree` prints a feature of bir-core only when something enables it. Linux only: the
      # answer does not depend on the runner.
      - name: The app does not enable direct-bir
        if: env.LEAD_SHARD == 'true'
        working-directory: buwiz-forms
        run: |
          tree=$(cargo tree --manifest-path nsh/Cargo.toml --all-features --target all -e features -i bir-core)
          if grep -q 'direct-bir' <<<"$tree"; then
            echo "$tree" | grep -B2 -A2 'direct-bir'
            echo "::error::the app enables bir-core's direct-bir feature"
            exit 1
          fi

      # The app as an Android phone runs it. Nothing else here compiles the Android target, and the relay client
      # brings C and assembly (ring) that need the NDK's compiler. The runner image carries the NDK
      # (ANDROID_NDK_LATEST_HOME); API level 24 is the oldest the toolchain names.
      - name: The app compiles for Android
        if: env.LEAD_SHARD == 'true' && env.SUITE_BUILD == 'true'
        working-directory: buwiz-forms
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -x "$bin/aarch64-linux-android24-clang" ] || { echo "::error::no Android NDK compiler at $bin"; exit 1; }
          rustup target add aarch64-linux-android
          export ANDROID_NDK_HOME="$ndk" ANDROID_NDK_ROOT="$ndk"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export RANLIB_aarch64_linux_android="$bin/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android24-clang"
          cargo check --locked --manifest-path nsh/Cargo.toml --target aarch64-linux-android

      # The agent build, which nothing else here compiles. First the window's control plane (hexuria/nsh-gpui-agent)
      # against this NSH: the app's crate and its tests build with `agent`, and the two data-plane tests run. Then
      # the host nsh generates: with `agent` it must hold one nsh-testing, the checkout's. cargo tree stops with
      # "ambiguous" when the control plane's Git copy of NSH is in the graph too; that build compiles, and its
      # window listener never starts.
      - name: The agent feature builds, with one NSH in the host
        if: env.LEAD_SHARD == 'true' && env.SUITE_BUILD == 'true'
        working-directory: buwiz-forms
        run: |
          cargo test --manifest-path nsh/Cargo.toml --features agent --no-run
          cargo test --manifest-path nsh/Cargo.toml --features agent --test agent --test agent_send
          cargo tree --manifest-path nsh/.nsh/rust/Cargo.toml -p nsh-app-nsh-app-ebirforms-linux-host \
            --features app_nsh_app_ebirforms/agent -i nsh-testing --depth 1

      # The host `nsh run --target linux` builds, from the workspace nsh check generated in .nsh/rust: it links NSH's GTK
      # backend with its development features (the dev and agent code a plain build leaves out).
      - name: Build the Linux development host
        if: env.LEAD_SHARD == 'true' && env.SUITE_BUILD == 'true'
        working-directory: buwiz-forms/nsh
        run: cargo build --manifest-path .nsh/rust/Cargo.toml -p nsh-app-nsh-app-ebirforms-linux-host

      # The base screen in GTK windows (wide and narrow, light and dark), as NSH's own Linux CI runs real windows: a
      # session bus of its own and a virtual display. The four safety variables are the workflow's; nothing sets
      # BIR_DATABASE_PATH. Run from nsh/ so the test host reuses the build above.
      - name: Real windows (shots/base)
        if: env.LEAD_SHARD == 'true' && env.SUITE_BUILD == 'true'
        working-directory: buwiz-forms/nsh
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' nsh test shots/base.test.tsx --target linux

      - name: Keep the real-window screenshots
        if: always() && env.LEAD_SHARD == 'true' && env.SUITE_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nsh-linux-shots
          path: buwiz-forms/nsh/base-*.png
          if-no-files-found: ignore

      - name: Headless TSX tests, file by file
        if: env.SUITE_SCREENS == 'true'
        working-directory: buwiz-forms/nsh
        run: bash ../scripts/nsh_screen_tests.sh

  # The same app on Windows (the NSH Win32 backend), as far as a machine without a display reaches: the CLI built from
  # the pin, the crate and its TSX types, the bundle, and the Windows development host `nsh run --target windows`
  # builds, which links NSH's Win32 backend with its development features. A pin whose Windows backend does not build is
  # caught here (c346e920e's did not: chrome.rs called choose() with three arguments, hexuria/nsh#13). Then, as on
  # macOS, the crate's Rust tests and the headless TSX tests, sharded the same way (the database guard verifies on
  # Windows since #228, so a test's scratch database opens). Real windows are not run here yet
  # (docs/platforms/nsh-windows-handover.md, W11 onwards).
  nsh-windows:
    # Sharded as the macOS job is; the lead shard also builds the development host.
    name: NSH app (Windows, shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.nsh_windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # Pinned, as the other jobs are: the steps below name paths of this image (Strawberry Perl, LLVM). windows-2025 is
    # Windows Server 2025 with Visual Studio 2026, the image the job was first verified on.
    runs-on: windows-2025
    # Cold: the nsh command line took 31 minutes on a 2-vCPU Windows machine; the host is a further debug build.
    timeout-minutes: 150
    env:
      # As the macOS job: one compiler for both checkouts. Keep it equal to this repository's rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_INCREMENTAL: "0"
      # QuickJS's bindings are generated with bindgen, which needs libclang (the image's LLVM).
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # rustc can overflow its default stack on the windows crate's bindings (NSH's own Windows CI sets it).
      RUST_MIN_STACK: "268435456"
      # The four safety variables every nsh recipe sets (the justfile's are Unix-only): no credential store, a test
      # environment (scratch databases, no account sign-in in debug builds), and a dry run that sends nothing.
      # Nothing sets BIR_DATABASE_PATH.
      BUWIZ_NO_KEYCHAIN: "1"
      EBIR_TEST_ENV: "1"
      BIR_AUTH_BYPASS: "1"
      BIR_SFTP_DRY_RUN: "1"
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ needs.plan.outputs.shard_count }}
      LEAD_SHARD: ${{ matrix.shard == fromJSON(needs.plan.outputs.lead_shard) }}
      SUITE_BUILD: ${{ needs.plan.outputs.build }}
      SUITE_RUST: ${{ needs.plan.outputs.nsh_rust }}
      SUITE_SCREENS: ${{ needs.plan.outputs.screens }}
      SCREENS_FILTER: ${{ needs.plan.outputs.screens_filter }}
    steps:
      - name: Check out buwiz-forms
        uses: actions/checkout@v4
        with:
          path: buwiz-forms

      - name: Check out NSH (the pinned commit, beside buwiz-forms)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NSH_REPOSITORY }}
          ref: ${{ env.NSH_PINNED_REF }}
          token: ${{ secrets.NSH_REPO_TOKEN || github.token }}
          path: nsh
          persist-credentials: false

      - name: Check the two checkouts line up
        shell: pwsh
        run: |
          if (-not (Test-Path nsh/crates/nsh-core/Cargo.toml)) { throw "nsh/crates/nsh-core/Cargo.toml is missing" }
          if (-not (Test-Path buwiz-forms/nsh/Cargo.toml)) { throw "buwiz-forms/nsh/Cargo.toml is missing" }
          git -C nsh log -1 --format='NSH at %H %s'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Install huacnlee/cargo
        uses: ./nsh/.github/actions/cargo
        with:
          cache: buwiz-nsh-app-windows
          lockfiles: buwiz-forms/nsh/Cargo.lock

      # bir-core builds OpenSSL from source (openssl "vendored"), whose Configure needs Strawberry Perl: Git's perl,
      # which can come first on the path, fails in it. The image ships Strawberry Perl; put it first.
      - name: Put Strawberry Perl first on the path
        shell: pwsh
        run: |
          if (-not (Test-Path C:\Strawberry\perl\bin\perl.exe)) { throw "Strawberry Perl is not on this image" }
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Restore the nsh command line
        id: nsh-cli
        uses: actions/cache/restore@v4
        with:
          path: ~/BuwizNsh/tools
          key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.NSH_PINNED_REF }}

      - name: Build the nsh command line
        if: steps.nsh-cli.outputs.cache-hit != 'true'
        working-directory: nsh
        shell: pwsh
        run: cargo install --locked --path crates/nsh-cli --root "$HOME\BuwizNsh\tools"

      # Only main's lead shard saves: the shards of a new pin's first run all build it, and one copy is enough. A
      # branch's copy would be readable by that branch alone and take room from main's caches.
      - name: Save the nsh command line
        if: steps.nsh-cli.outputs.cache-hit != 'true' && env.LEAD_SHARD == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/BuwizNsh/tools
          key: ${{ steps.nsh-cli.outputs.cache-primary-key }}

      - name: Put the nsh command line on the path
        shell: pwsh
        run: |
          "$HOME\BuwizNsh\tools\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$HOME\BuwizNsh\tools\bin\nsh.exe" -V

      - name: nsh check (the crate, then the TSX types)
        if: env.LEAD_SHARD == 'true'
        working-directory: buwiz-forms/nsh
        shell: pwsh
        run: nsh check -v

      - name: nsh build
        if: env.LEAD_SHARD == 'true' && env.SUITE_BUILD == 'true'
        working-directory: buwiz-forms/nsh
        shell: pwsh
        run: nsh build

      - name: Rust tests of the app's crate
        if: env.LEAD_SHARD == 'true' && env.SUITE_RUST == 'true'
        working-directory: buwiz-forms/nsh
        shell: pwsh
        run: cargo test --manifest-path Cargo.toml --no-fail-fast

      # The agent build, as the macOS and Linux jobs check it: the control plane against this NSH, the two data-plane
      # tests, and one nsh-testing in the generated host (cargo tree stops with "ambiguous" on two).
      - name: The agent feature builds, with one NSH in the host
        if: env.LEAD_SHARD == 'true' && env.SUITE_BUILD == 'true'
        working-directory: buwiz-forms/nsh
        shell: pwsh
        run: |
          cargo test --manifest-path Cargo.toml --features agent --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path Cargo.toml --features agent --test agent --test agent_send
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo tree --manifest-path .nsh/rust/Cargo.toml -p nsh-app-nsh-app-ebirforms-windows-host `
            --features app_nsh_app_ebirforms/agent -i nsh-testing --depth 1
          exit $LASTEXITCODE

      # The host `nsh run --target windows` builds, from the workspace nsh check generated in .nsh/rust: it links NSH's
      # Win32 backend with its development features (the dev and agent code a plain build leaves out).
      - name: Build the Windows development host
        if: env.LEAD_SHARD == 'true' && env.SUITE_BUILD == 'true'
        working-directory: buwiz-forms/nsh
        shell: pwsh
        run: cargo build --manifest-path .nsh/rust/Cargo.toml -p nsh-app-nsh-app-ebirforms-windows-host

      # Every tracked *.test.ts and *.test.tsx, one headless run per file, as the macOS job runs them (nsh/verify holds
      # real-window verifiers that need the owner's data copy, so it is left out). Shards: file k of the list in
      # ordinal order (from 0) belongs to shard k % SHARDS, so every file is in exactly one shard.
      - name: Headless TSX tests, file by file
        if: env.SUITE_SCREENS == 'true'
        working-directory: buwiz-forms/nsh
        shell: pwsh
        run: |
          [string[]]$files = git ls-files -- '*.test.ts' '*.test.tsx' | Where-Object { $_ -notlike 'verify/*' }
          [Array]::Sort($files, [StringComparer]::Ordinal)
          # The manual run's filter, before sharding, as scripts/nsh_screen_tests.sh reads it: a glob (* also crosses
          # folders) or a plain file or folder path.
          $filter = $env:SCREENS_FILTER
          if ($filter) {
            if ($filter -match '[*?\[]') { $files = @($files | Where-Object { $_ -like $filter }) }
            else { $path = $filter.TrimEnd('/'); $files = @($files | Where-Object { $_ -eq $path -or $_ -like "$path/*" }) }
          }
          if ($files.Count -eq 0) { throw "no test files$(if ($filter) { " match $filter" })" }
          $failed = @()
          $ran = 0
          for ($k = 0; $k -lt $files.Count; $k++) {
            if ($k % [int]$env:SHARDS -ne [int]$env:SHARD) { continue }
            $ran++
            nsh test "./$($files[$k])"
            if ($LASTEXITCODE -ne 0) { $failed += $files[$k] }
          }
          "shard $env:SHARD of $env:SHARDS ran $ran of $($files.Count) test files"
          if ($ran -eq 0 -and -not $filter) { throw "this shard found no test files" }
          if ($failed.Count -gt 0) {
            "failed in:"
            $failed | ForEach-Object { "  $_" }
            exit 1
          }

  # bir-core and bir-app-api with --no-default-features: the plain-SQLite build the NSH app ships (no sqlcipher).
  # `just core-plain-test` sets the four safety variables itself. Linux, because it is the cheapest runner; the
  # system packages are a guess from the existing CI job's list and the dbus crate the keychain code pulls in.
  core-plain-test:
    name: bir-core and bir-app-api, plain SQLite
    needs: plan
    if: needs.plan.outputs.core_plain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-plain-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        run: cargo install just --version 1.45.0 --locked

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libssl-dev

      - name: Plain-SQLite tests
        run: just core-plain-test

  # The Linux release packages (deb, rpm and the rest, x64 and arm64), built and smoke-tested by release-linux.yml,
  # which pull requests no longer start. Here in the nightly run and a manual run whose suites include `build` (Linux
  # chosen). An empty tag gives the version <app>-pr, as a manual run of that workflow does; no secrets are passed, and
  # the workflow only keeps workflow artifacts: release.yml is what publishes.
  linux-packages:
    name: Linux release packages
    needs: plan
    if: needs.plan.outputs.linux_packages == 'true'
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ""
