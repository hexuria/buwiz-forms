# Tag bir-vMAJOR.MINOR.PATCH (example bir-v0.1.0):
#   * builds the `bir` CLI for cargo-binstall
#   * uploads those archives to the GitHub Release for that tag
#   * cargo-publishes the `bir` crate (and the workspace crates it depends on)
#
# Does not run on desktop v* tags and does not upload the CLI into those releases.
# gpui-agent is not published from this repo.
# Publish also needs gpui-agent 0.1.0 already on crates.io (this repo only
# [patch]es that crate for builds). bir-print and bir-desktop still include
# files outside their crate roots (html-frozen, assets); cargo publish
# verification of those two crates fails until that is fixed.
name: bir

on:
  push:
    tags:
      - "bir-v*"

permissions:
  contents: write

concurrency:
  group: bir-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Require bir-vMAJOR.MINOR.PATCH
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^bir-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be bir-vMAJOR.MINOR.PATCH: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          tag_ver="${GITHUB_REF_NAME#bir-v}"
          cargo_ver="$(awk '
            /^version[[:space:]]*=/ { gsub(/"/, "", $3); print $3; exit }
          ' crates/bir/Cargo.toml)"
          if [ -z "${cargo_ver}" ] || [ "${tag_ver}" != "${cargo_ver}" ]; then
            echo "tag ${tag_ver} does not match crates/bir version ${cargo_ver}" >&2
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-client0 \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libssl-dev \
            libpolkit-gobject-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mesa-vulkan-drivers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build bir
        run: cargo build --locked --release -p bir --target ${{ matrix.target }}

      - name: Pack cargo-binstall archive
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/bir" "${stage}/bir"
          chmod 755 "${stage}/bir"
          archive="bir-${{ matrix.target }}.tgz"
          tar -C "${stage}" -czf "${archive}" bir
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          rm -rf "${stage}"

      - uses: actions/upload-artifact@v4
        with:
          name: bir-${{ matrix.target }}
          path: |
            bir-${{ matrix.target }}.tgz
            bir-${{ matrix.target }}.tgz.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c bir-x86_64-unknown-linux-gnu.tgz.sha256
          sha256sum -c bir-aarch64-apple-darwin.tgz.sha256
          cat bir-x86_64-unknown-linux-gnu.tgz.sha256 bir-aarch64-apple-darwin.tgz.sha256 > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            `bir` headless CLI.

            `cargo install bir` once this tag has published the crate.
            `cargo binstall bir` uses the `.tgz` assets on this `bir-v*` release.

            The desktop app is still the `vMAJOR.MINOR.PATCH` release (dmg/deb/exe).
            This workflow does not publish gpui-agent.
          files: |
            dist/bir-x86_64-unknown-linux-gnu.tgz
            dist/bir-x86_64-unknown-linux-gnu.tgz.sha256
            dist/bir-aarch64-apple-darwin.tgz
            dist/bir-aarch64-apple-darwin.tgz.sha256
            dist/SHA256SUMS

  publish:
    name: cargo publish
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-client0 \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libssl-dev \
            libpolkit-gobject-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mesa-vulkan-drivers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Publish bir and its workspace dependencies
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set on hexuria/buwiz-forms." >&2
            echo "Add that Actions secret, then re-run this bir-v* tag. The token is not printed." >&2
            exit 1
          fi
          # crates.io bir depends on gpui-agent 0.1.0. This repo does not publish it.
          status="$(curl -s -o /dev/null -w '%{http_code}' https://crates.io/api/v1/crates/gpui-agent/0.1.0 || true)"
          if [ "${status}" != "200" ]; then
            echo "gpui-agent 0.1.0 is not on crates.io (HTTP ${status})." >&2
            echo "Tag v0.1.0 on hexuria/gpui-agent first. Not publishing bir from this repo." >&2
            exit 1
          fi
          # Retry only while crates.io is still indexing the previous crate.
          for pkg in bir-rules bir-core bir-print bir-desktop bir; do
            echo "publishing ${pkg}"
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              log="$(mktemp)"
              set +e
              cargo publish -p "${pkg}" --locked >"${log}" 2>&1
              code=$?
              set -e
              cat "${log}"
              if [ "${code}" -eq 0 ]; then
                rm -f "${log}"
                ok=1
                break
              fi
              if grep -Eq 'already uploaded|already exists' "${log}"; then
                echo "${pkg} is already on crates.io; continuing"
                rm -f "${log}"
                ok=1
                break
              fi
              if grep -Eq 'already exists on crates.io|crate .* already exists' "${log}"; then
                echo "${pkg} is already on crates.io; continuing"
                rm -f "${log}"
                ok=1
                break
              fi
              rm -f "${log}"
              echo "publish ${pkg} attempt ${attempt} failed; waiting for the index" >&2
              sleep 20
            done
            if [ "${ok}" != "1" ]; then
              echo "could not publish ${pkg}" >&2
              exit 1
            fi
          done
