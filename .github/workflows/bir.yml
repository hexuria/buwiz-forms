# Tag bir-vMAJOR.MINOR.PATCH to build and release the headless `bir` executable.
name: bir

on:
  push:
    tags:
      - "bir-v*"

permissions:
  contents: write

concurrency:
  group: bir-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Require bir-vMAJOR.MINOR.PATCH
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^bir-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be bir-vMAJOR.MINOR.PATCH: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          tag_ver="${GITHUB_REF_NAME#bir-v}"
          cargo_ver="$(awk '
            /^version[[:space:]]*=/ { gsub(/"/, "", $3); print $3; exit }
          ' crates/bir-shell/Cargo.toml)"
          if [ -z "${cargo_ver}" ] || [ "${tag_ver}" != "${cargo_ver}" ]; then
            echo "tag ${tag_ver} does not match crates/bir-shell version ${cargo_ver}" >&2
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-client0 \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libssl-dev \
            libpolkit-gobject-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mesa-vulkan-drivers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build bir-headless
        run: cargo build --locked --release --manifest-path crates/bir-shell/Cargo.toml --features agent --bin bir-headless --target ${{ matrix.target }}

      - name: Pack cargo-binstall archive
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "crates/bir-shell/target/${{ matrix.target }}/release/bir-headless.exe" "${stage}/bir.exe"
            archive_member="bir.exe"
          else
            cp "crates/bir-shell/target/${{ matrix.target }}/release/bir-headless" "${stage}/bir"
            chmod 755 "${stage}/bir"
            archive_member="bir"
          fi
          archive="bir-${{ matrix.target }}.tgz"
          tar -C "${stage}" -czf "${archive}" "${archive_member}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          rm -rf "${stage}"

      - uses: actions/upload-artifact@v4
        with:
          name: bir-${{ matrix.target }}
          path: |
            bir-${{ matrix.target }}.tgz
            bir-${{ matrix.target }}.tgz.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c bir-x86_64-unknown-linux-gnu.tgz.sha256
          sha256sum -c bir-aarch64-apple-darwin.tgz.sha256
          sha256sum -c bir-x86_64-pc-windows-msvc.tgz.sha256
          cat bir-x86_64-unknown-linux-gnu.tgz.sha256 bir-aarch64-apple-darwin.tgz.sha256 bir-x86_64-pc-windows-msvc.tgz.sha256 > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: false
          # The repository's "latest release" must stay the desktop app: the
          # Linux installer and download links resolve /releases/latest. A
          # CLI release published with GitHub's default would take it over.
          make_latest: false
          body: |
            `bir` headless CLI.

            From a checkout: `cargo install --path crates/bir-shell --features agent --bin bir-headless --locked` (installs `bir-headless`; rename or alias it to `bir`).

            The desktop app is the `vMAJOR.MINOR.PATCH` release (dmg/deb/exe).
          files: |
            dist/bir-x86_64-unknown-linux-gnu.tgz
            dist/bir-x86_64-unknown-linux-gnu.tgz.sha256
            dist/bir-aarch64-apple-darwin.tgz
            dist/bir-aarch64-apple-darwin.tgz.sha256
            dist/bir-x86_64-pc-windows-msvc.tgz
            dist/bir-x86_64-pc-windows-msvc.tgz.sha256
            dist/SHA256SUMS
