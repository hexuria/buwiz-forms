name: Release (Windows)

on:
  workflow_dispatch:
    inputs:
      release:
        description: Sign workflow artifacts if the Windows certificate is configured
        type: boolean
        default: false
      store:
        description: >-
          Build only the Microsoft Store .msix: never signed (the Store signs it), and given the Google OAuth client
          only when the repository variable STORE_GMAIL is 1 (Gmail Connect's restricted scope needs Google's
          verification). Off, the package is checked to hold no client id.
        type: boolean
        default: false
  workflow_call:
    # Named so a caller can pass the Store job only what it may have (release.yml's build-windows-store); a caller
    # with `secrets: inherit` passes every secret, as before.
    secrets:
      NSH_REPO_TOKEN:
        required: false
      GOOGLE_CLIENT_ID:
        required: false
      GOOGLE_CLIENT_SECRET:
        required: false
      WINDOWS_CERTIFICATE_PFX:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
    inputs:
      release:
        description: Sign workflow artifacts if the Windows certificate is configured
        type: boolean
        default: false
      store:
        description: >-
          Build only the Microsoft Store .msix: never signed (the Store signs it), and given the Google OAuth client
          only when the repository variable STORE_GMAIL is 1 (Gmail Connect's restricted scope needs Google's
          verification). Off, the package is checked to hold no client id.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installers:
    runs-on: windows-2025
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.99.0
      RUST_MIN_STACK: "268435456"
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      BUWIZ_NO_KEYCHAIN: "1"
      EBIR_TEST_ENV: "1"
      BIR_AUTH_BYPASS: "1"
      BIR_SFTP_DRY_RUN: "1"
    defaults:
      run:
        working-directory: buwiz-forms
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: buwiz-forms
          persist-credentials: false

      - name: Read the NSH pin
        id: pin
        run: |
          $pin = Select-String -Path .github/workflows/nsh.yml -Pattern '^\s*NSH_PINNED_REF:\s*([a-f0-9]{40})\s*$'
          if (@($pin).Count -ne 1) { throw 'Expected one NSH_PINNED_REF in nsh.yml' }
          "ref=$($pin.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: hexuria/nsh
          ref: ${{ steps.pin.outputs.ref }}
          token: ${{ secrets.NSH_REPO_TOKEN || github.token }}
          path: nsh
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc

      - uses: ./nsh/.github/actions/cargo
        with:
          cache: buwiz-nsh-release-windows
          lockfiles: buwiz-forms/nsh/Cargo.lock

      - name: Install installer tools
        # The Store package needs only the Windows SDK's MakeAppx, which the image has.
        if: ${{ !inputs.store }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -notin 0, 3010) { throw "Inno Setup installation failed: $LASTEXITCODE" }
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3.*\bin" -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'heat.exe') } | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset --version=3.11.2 -y --no-progress
            if ($LASTEXITCODE -notin 0, 3010) { throw "WiX installation failed: $LASTEXITCODE" }
          }
          if (-not (Test-Path C:\Strawberry\perl\bin\perl.exe)) { throw 'Strawberry Perl is not on this image' }
          'C:\Strawberry\perl\bin' >> $env:GITHUB_PATH

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/checkout@v4
        with:
          repository: hexuria/buwiz-forms-html
          path: buwiz-forms/.ci-html
          persist-credentials: false

      - name: Verify frozen HTML
        run: |
          python .ci-html/tools/formgen/freeze_html.py --verify --out html-frozen --index rules/index.json
          python .ci-html/tools/formgen/stamp_frozen_names.py --check-all --html-root html-frozen --rules-root rules/forms --catalog .ci-html/tools/formgen/identity/catalog.json

      - name: Cache the pinned NSH CLI
        id: nsh-cli
        uses: actions/cache@v4
        with:
          path: ~/BuwizNsh/tools
          key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.ref }}

      - name: Build the NSH CLI
        if: steps.nsh-cli.outputs.cache-hit != 'true'
        working-directory: nsh
        run: cargo install --locked --path crates/nsh-cli --root "$HOME/BuwizNsh/tools"

      - name: Build the NSH Windows app
        working-directory: buwiz-forms/nsh
        env:
          # Setup and updater ZIP must run without an installed VC Redistributable.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
          # bir-core compiles the Google OAuth client in (option_env!). Direct downloads keep it on release runs, as
          # 0.2.x shipped; the Store package gets it only when the repository variable STORE_GMAIL is 1.
          GOOGLE_CLIENT_ID: ${{ inputs.release && (!inputs.store || vars.STORE_GMAIL == '1') && secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ inputs.release && (!inputs.store || vars.STORE_GMAIL == '1') && secrets.GOOGLE_CLIENT_SECRET || '' }}
        run: |
          $env:Path = "$HOME\BuwizNsh\tools\bin;$env:Path"
          nsh package --target windows --out "$env:RUNNER_TEMP/nsh-windows"

      - name: Package and audit the NSH Windows installers
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ inputs.release && !inputs.store && secrets.WINDOWS_CERTIFICATE_PFX || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.release && !inputs.store && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        # A release's .msix comes from the Store job alone; a test run (not a release) still builds and smoke-tests it here.
        run: |
          ./scripts/package_nsh_windows.ps1 -PackageRoot "$env:RUNNER_TEMP/nsh-windows" -OutDir target/release-artifacts -SmokeMsix:$${{ !inputs.release }} -MsixOnly:$${{ inputs.store }} -NoMsix:$${{ inputs.release && !inputs.store }}

      - name: Check the Store package against STORE_GMAIL
        # The detector's positive control first (it finds a planted id and secret). Then the package: with the switch
        # off it holds neither; on a release with STORE_GMAIL=1 (the build above was given both) it holds both.
        if: ${{ inputs.store }}
        env:
          GMAIL_BUILT_IN: ${{ inputs.release && vars.STORE_GMAIL == '1' }}
        run: |
          python scripts/audit_google_client.py --self-test
          $msix = @(Get-ChildItem target/release-artifacts -Filter *.msix -File)
          if ($msix.Count -ne 1) { throw "Expected one .msix, found $($msix.Count)" }
          $expect = if ($env:GMAIL_BUILT_IN -eq 'true') { '--present' } else { '--absent' }
          python scripts/audit_google_client.py $expect $msix[0].FullName

      - name: Upload Windows Artifact
        if: ${{ !inputs.store }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            buwiz-forms/target/release-artifacts/*-Setup.exe
            buwiz-forms/target/release-artifacts/*.msi
            buwiz-forms/target/release-artifacts/*.msix
            buwiz-forms/target/release-artifacts/*-windows-x86_64.zip
            buwiz-forms/target/release-artifacts/SHA256SUMS-windows-x64.txt

      - name: Upload the Store package
        if: ${{ inputs.store }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-store
          if-no-files-found: error
          path: |
            buwiz-forms/target/release-artifacts/*.msix
            buwiz-forms/target/release-artifacts/SHA256SUMS-windows-store-x64.txt
