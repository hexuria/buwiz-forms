name: HTML Candidate Certification Inputs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  policy:
    name: Verify candidate source policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux source-gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libwayland-client0 \
            libasound2-dev libudev-dev libvulkan-dev libfontconfig1-dev \
            libfreetype-dev libssl-dev libpolkit-gobject-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind the candidate to the exact clean workflow SHA
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 scripts/audit_html_form_migration.py --require-clean-source

      - name: Verify non-promotional candidate gates
        run: |
          npm ci
          npm run contracts:check
          npm run typecheck:forms
          npm run test:forms
          npm run audit:forms:migration
          npm run audit:no-legacy
          python3 -m unittest scripts.tests.test_html_release_gate_policy scripts.tests.test_write_html_candidate_manifest -v

      - name: Verify full Rust workspace before candidate construction
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

  macos-candidate:
    name: Build macOS non-dev candidate
    needs: policy
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build clean offline renderer without release promotion
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 scripts/audit_html_form_migration.py --require-clean-source
          npm ci
          npm run contracts:check
          npm run audit:forms:migration
          npm run audit:no-legacy
          npm run build:forms
          npm run verify:forms:offline:package

      - name: Build exact non-dev universal binary
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Assemble ad-hoc signed candidate application
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/target/certification/macos"
          APP="$ROOT/eBIRForms.app"
          ARCHIVE="$ROOT/eBIRForms-macOS-universal-$GITHUB_SHA.zip"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create \
            target/aarch64-apple-darwin/release/bir \
            target/x86_64-apple-darwin/release/bir \
            -output "$APP/Contents/MacOS/bir"
          cp -R assets "$APP/Contents/Resources/"
          rm -rf "$APP/Contents/Resources/assets/macos"
          cp assets/AppIcon.icns "$APP/Contents/Resources/"
          cp assets/macos/Info.plist "$APP/Contents/Info.plist"
          VERSION="$(awk -F '"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          sed -i '' "s/VERSION_PLACEHOLDER/$VERSION/g" "$APP/Contents/Info.plist"
          sed -i '' "s/BUILD_NUMBER_PLACEHOLDER/${GITHUB_RUN_NUMBER}/g" "$APP/Contents/Info.plist"
          sed -i '' "s/BUNDLE_ID_PLACEHOLDER/dev.goldcoders.bir/g" "$APP/Contents/Info.plist"
          sed -i '' "s/APP_NAME_PLACEHOLDER/eBIRForms/g" "$APP/Contents/Info.plist"
          python3 scripts/audit_no_legacy.py --package-root "$APP"
          codesign --force --options runtime --entitlements entitlements.dev.plist --sign - "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          python3 scripts/write_html_candidate_manifest.py \
            --platform macos \
            --architecture universal \
            --source-revision "$GITHUB_SHA" \
            --artifact "$ARCHIVE" \
            --renderer-identity assets/form-renderer-build-identity.json \
            --output "$ROOT/candidate-manifest.json"
          cp assets/form-renderer-build-identity.json "$ROOT/"

      - name: Upload macOS certification inputs
        uses: actions/upload-artifact@v4
        with:
          name: html-candidate-macos-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/certification/macos/*.zip
            target/certification/macos/candidate-manifest.json
            target/certification/macos/form-renderer-build-identity.json

  windows-candidate:
    name: Build Windows non-dev candidate
    needs: policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenSSL build dependency
        shell: pwsh
        run: |
          choco install openssl -y
          $opensslDir = if (Test-Path "C:\Program Files\OpenSSL\include") {
            "C:\Program Files\OpenSSL"
          } elseif (Test-Path "C:\Program Files\OpenSSL-Win64\include") {
            "C:\Program Files\OpenSSL-Win64"
          } else {
            throw "OpenSSL include directory not found"
          }
          "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          $library = Get-ChildItem -Path $opensslDir -Filter "*crypto*.lib" -Recurse |
            Select-Object -First 1
          if (-not $library) { throw "OpenSSL crypto library not found" }
          "OPENSSL_LIB_DIR=$($library.DirectoryName)" >> $env:GITHUB_ENV
          if ($library.Name -ne "libcrypto.lib") {
            Copy-Item $library.FullName "$($library.DirectoryName)\libcrypto.lib"
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build clean offline renderer without release promotion
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw "candidate SHA mismatch" }
          if (git status --porcelain=v1 --untracked-files=all) { throw "candidate source is dirty" }
          python scripts/audit_html_form_migration.py --require-clean-source
          npm ci
          npm run contracts:check
          npm run audit:forms:migration
          npm run audit:no-legacy
          npm run build:forms
          npm run verify:forms:offline:package

      - name: Build exact non-dev Windows binary
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Assemble portable candidate application
        shell: pwsh
        run: |
          $root = "target/certification/windows"
          $stage = "$root/eBIRForms-Windows-x64"
          $archive = "$root/eBIRForms-Windows-x64-$env:GITHUB_SHA.zip"
          New-Item -ItemType Directory -Force -Path "$stage/assets" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/bir.exe" "$stage/bir.exe"
          Copy-Item "assets/*" "$stage/assets" -Recurse -Force
          python scripts/audit_no_legacy.py --package-root "$stage"
          Compress-Archive -Path "$stage/*" -DestinationPath "$archive" -Force
          python scripts/write_html_candidate_manifest.py `
            --platform windows `
            --architecture x86_64 `
            --source-revision $env:GITHUB_SHA `
            --artifact "$archive" `
            --renderer-identity assets/form-renderer-build-identity.json `
            --output "$root/candidate-manifest.json"
          Copy-Item assets/form-renderer-build-identity.json "$root/form-renderer-build-identity.json"

      - name: Upload Windows certification inputs
        uses: actions/upload-artifact@v4
        with:
          name: html-candidate-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/certification/windows/*.zip
            target/certification/windows/candidate-manifest.json
            target/certification/windows/form-renderer-build-identity.json

  linux-candidate:
    name: Build Linux non-dev candidate
    needs: policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libwayland-client0 \
            libasound2-dev libudev-dev libvulkan-dev libfontconfig1-dev \
            libfreetype-dev libssl-dev libpolkit-gobject-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build clean offline renderer without release promotion
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 scripts/audit_html_form_migration.py --require-clean-source
          npm ci
          npm run contracts:check
          npm run audit:forms:migration
          npm run audit:no-legacy
          npm run build:forms
          npm run verify:forms:offline:package

      - name: Build exact non-dev Linux binary
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Assemble portable candidate application
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/target/certification/linux"
          STAGE="$ROOT/eBIRForms-Linux-x64"
          ARCHIVE="$ROOT/eBIRForms-Linux-x64-$GITHUB_SHA.tar.gz"
          mkdir -p "$STAGE"
          cp target/x86_64-unknown-linux-gnu/release/bir "$STAGE/"
          cp -R assets "$STAGE/"
          python3 scripts/audit_no_legacy.py --package-root "$STAGE"
          tar czf "$ARCHIVE" -C "$ROOT" "$(basename "$STAGE")"
          python3 scripts/write_html_candidate_manifest.py \
            --platform linux \
            --architecture x86_64 \
            --source-revision "$GITHUB_SHA" \
            --artifact "$ARCHIVE" \
            --renderer-identity assets/form-renderer-build-identity.json \
            --output "$ROOT/candidate-manifest.json"
          cp assets/form-renderer-build-identity.json "$ROOT/"

      - name: Upload Linux certification inputs
        uses: actions/upload-artifact@v4
        with:
          name: html-candidate-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/certification/linux/*.tar.gz
            target/certification/linux/candidate-manifest.json
            target/certification/linux/form-renderer-build-identity.json
