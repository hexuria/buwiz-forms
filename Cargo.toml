[workspace]
resolver = "2"
members = [
    "crates/bir-core",
    "crates/bir-desktop",
    "crates/bir-print",
    "crates/bir-rules",
    "crates/bir-rules-codegen",
    "crates/bir-rules-platform",
]
default-members = ["crates/bir-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/codeitlikemiley/ebirforms"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }

# Crypto
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
flate2 = "1"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"

# Network
suppaftp = { version = "6", features = ["async-rustls"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "blocking"], default-features = false }
rss = "2.0"

# Database
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }



# Error handling
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"

# OS integration
keyring = { version = "3" }

# GPUI via longbridge/gpui-kit 0.6 (pins gpui-pre / gpui-component / assets).
# `gpui` is the same package under the historical crate name so existing
# `use gpui::*` / `gpui::Action` paths stay on one graph without rewriting views.
gpui-kit = "0.6"
gpui = { package = "gpui-kit", version = "0.6" }
gpui-component = "0.6"
gpui-wry = "0.6"
# Pure proc-macro (syn/quote/proc-macro2 only, no gpui dependency of its own),
# so it inherits whatever `gpui` is in scope at the call site and cannot
# introduce a second GPUI crate instance.
gpui-rsx = "0.6"

# Cargo resolves 1042 packages here: 1036 external dependencies against 6
# workspace crates. Full debuginfo on all of them is what made target/ grow to
# 90 GiB. "line-tables-only" keeps file/line in backtraces and panic messages -
# what is actually read during development - and drops the rest.
[profile.dev]
debug = "line-tables-only"

# Dependencies are never stepped through, so they need no debuginfo at all.
# opt-level = 1 also makes the heavy ones (image/raster/PDF work in the test
# suites) materially faster to execute for a small one-off build cost.
# Deliberately not set: incremental. sccache refuses to cache anything built
# with -C incremental, but turning it off would gut the edit-rebuild loop, and
# dependencies are cached regardless because they do not use it.
[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

