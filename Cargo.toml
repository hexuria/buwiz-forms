[workspace]
resolver = "2"
members = [
    "crates/bir-core",
    "crates/bir-desktop",
    "crates/bir-print",
    "crates/bir-rules",
    "crates/bir-rules-codegen",
    "crates/bir-rules-platform",
]
default-members = ["crates/bir-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/codeitlikemiley/ebirforms"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }

# Crypto
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
flate2 = "1"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"

# Network
suppaftp = { version = "6", features = ["async-rustls"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "blocking"], default-features = false }
rss = "2.0"

# Database
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }



# Error handling
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"

# OS integration
keyring = { version = "3" }

# GPUI (Desktop)
gpui = { git = "https://github.com/hexuria/gpui-ce", rev = "590f086f0ead95aefab36c1a9affbb733eff4bf5" }
gpui_platform = { git = "https://github.com/hexuria/gpui-ce", rev = "590f086f0ead95aefab36c1a9affbb733eff4bf5", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "277f220a6196572116a8fd84fba6c36187094cab" }

# Cargo resolves 1042 packages here: 1036 external dependencies against 6
# workspace crates. Full debuginfo on all of them is what made target/ grow to
# 90 GiB. "line-tables-only" keeps file/line in backtraces and panic messages -
# what is actually read during development - and drops the rest.
[profile.dev]
debug = "line-tables-only"

# Dependencies are never stepped through, so they need no debuginfo at all.
# opt-level = 1 also makes the heavy ones (image/raster/PDF work in the test
# suites) materially faster to execute for a small one-off build cost.
# Deliberately not set: incremental. sccache refuses to cache anything built
# with -C incremental, but turning it off would gut the edit-rebuild loop, and
# dependencies are cached regardless because they do not use it.
[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

# gpui-component declares its GPUI dependencies against zed git. Redirect them
# onto gpui-ce so the whole graph resolves to a single GPUI instance.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/hexuria/gpui-ce", rev = "590f086f0ead95aefab36c1a9affbb733eff4bf5" }
gpui_platform = { git = "https://github.com/hexuria/gpui-ce", rev = "590f086f0ead95aefab36c1a9affbb733eff4bf5" }
gpui_web = { git = "https://github.com/hexuria/gpui-ce", rev = "590f086f0ead95aefab36c1a9affbb733eff4bf5" }
gpui_macros = { git = "https://github.com/hexuria/gpui-ce", rev = "590f086f0ead95aefab36c1a9affbb733eff4bf5" }
