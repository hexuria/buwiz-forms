[workspace]
resolver = "2"
members = [
    "crates/bir-core",
    "crates/bir-desktop",
    "crates/bir-print",
]
default-members = ["crates/bir-desktop"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/codeitlikemiley/ebirforms"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }

# Crypto
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
flate2 = "1"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"

# Network
suppaftp = { version = "6", features = ["async-rustls"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "blocking"], default-features = false }
rss = "2.0"

# Database
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }



# Error handling
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"

# OS integration
keyring = { version = "3" }

# GPUI (Desktop)
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
