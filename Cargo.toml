[workspace]
resolver = "2"
members = [
    "crates/bir-core",
    "crates/bir-mcp",
    "crates/bir-print",
    "crates/bir-rules",
    "crates/bir-rules-codegen",
    "crates/bir-rules-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/codeitlikemiley/ebirforms"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }

# Crypto
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
# Bundle C zlib so IAF compression matches the official Encrypt.exe byte for
# byte on every platform (system zlib versions differ).
libz-sys = { version = "1", default-features = false, features = ["static", "libc"] }
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"

# Network
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "blocking"], default-features = false }
rss = "2.0"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
sha1 = "0.10.6"
russh = { version = "0.63", default-features = false, features = ["flate2", "ring"] }
russh-sftp = "3.0"

# Database
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }



# gpui-agent control plane. One rev for bir-shell (`agent` feature) and
# bir-mcp, so both sides speak one protocol and one discovery format.
gpui-agent = { version = "0.1.0", git = "https://github.com/hexuria/gpui-agent", rev = "dab85991d700b8f3410cbaacbc5d9f90568c7ee3" }

# Error handling
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"

# OS integration
keyring = { version = "3" }

# Cargo resolves 1042 packages here: 1036 external dependencies against 6
# workspace crates. Full debuginfo on all of them is what made target/ grow to
# 90 GiB. "line-tables-only" keeps file/line in backtraces and panic messages -
# what is actually read during development - and drops the rest.
[profile.dev]
debug = "line-tables-only"

# Dependencies are never stepped through, so they need no debuginfo at all.
# opt-level = 1 also makes the heavy ones (image/raster/PDF work in the test
# suites) materially faster to execute for a small one-off build cost.
# Deliberately not set: incremental. sccache refuses to cache anything built
# with -C incremental, but turning it off would gut the edit-rebuild loop, and
# dependencies are cached regardless because they do not use it.
[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
