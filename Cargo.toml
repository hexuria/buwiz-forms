[workspace]
resolver = "2"
members = [
    "crates/bir-core",
    "crates/bir-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/goldcoders/bir"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }

# Crypto
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
flate2 = "1"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"

# Network
suppaftp = { version = "6", features = ["async-rustls"] }
tokio = { version = "1", features = ["full"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# PDF
typst = "0.13"

# Error handling
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# OS integration
keyring = "3"

# GPUI (Desktop)
gpui = "0.2"
gpui-component = "0.5"
