[workspace]
resolver = "2"
members = [
    "crates/bir-core",
    "crates/bir-desktop",
    "crates/bir-print",
]
default-members = ["crates/bir-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/codeitlikemiley/ebirforms"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }

# Crypto
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
flate2 = "1"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"

# Network
suppaftp = { version = "6", features = ["async-rustls"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "blocking"], default-features = false }
rss = "2.0"

# Database
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }



# Error handling
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"

# OS integration
keyring = { version = "3" }

# GPUI (Desktop)
gpui = { git = "https://github.com/codeitlikemiley/zed", rev = "da25af078f613bf52b515eded9175a1b397bbc5e" }
gpui_platform = { git = "https://github.com/codeitlikemiley/zed", rev = "da25af078f613bf52b515eded9175a1b397bbc5e", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "be0f5488a7050f14ed90081f68f450b07761ce93" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

# Redirect gpui-component's transitive dependency on upstream zed to our fork.
# Without this, Cargo would pull two incompatible versions of gpui.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/codeitlikemiley/zed", rev = "da25af078f613bf52b515eded9175a1b397bbc5e" }
gpui_platform = { git = "https://github.com/codeitlikemiley/zed", rev = "da25af078f613bf52b515eded9175a1b397bbc5e" }
