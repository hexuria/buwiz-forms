# TRAIN Law — 8% Flat Rate Rule
# RA 10963, Sec 24(A)(2)(b)
# Taxpayers who elect 8% flat rate have percentage tax replaced.

[rule]
rule_id = "rule.train.8-percent.suppress-percentage-tax"
title = "8% Flat Rate — Suppress Percentage Tax"
era_id = "TRAIN_2018"
effective_from = "2018-01-01"
phase = "Election"
priority = 100
citations = ["ra-10963-sec-24-a-2-b"]
problem = "Taxpayers electing 8% flat rate should not file percentage tax (2551Q)"
solution = "Suppress 2551Q when 8% election is active for the target year"

[rule.when]
all = ["profile.has_8_percent_election(target_year)"]

[[rule.mutations]]
type = "Suppress"
reason = "8% flat rate replaces percentage tax"
[rule.mutations.target]
form_code = "2551Q"
