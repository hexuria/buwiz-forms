[package]
name = "bir"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Headless eBIRForms agent CLI. cargo install bir and cargo binstall bir."
repository = "https://github.com/hexuria/buwiz-forms"
readme = "README.md"
keywords = ["bir", "ebirforms", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "bir"
path = "src/main.rs"

[dependencies]
bir-desktop = { path = "../bir-desktop", version = "0.1.0", features = ["agent"] }

# GitHub Release tag is bir-vMAJOR.MINOR.PATCH, not the desktop v* tag.
# Archive root contains the `bir` binary. Linux and macOS are .tgz.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/bir-v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
