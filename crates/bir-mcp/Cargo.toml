[package]
name = "bir-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Draft-only MCP (stdio or loopback Streamable HTTP) adapter that drives a running BIR app through gpui-agent."

[lib]
doctest = false

[[bin]]
name = "bir-mcp"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
# Workspace pin shared with bir-desktop's `agent` feature.
gpui-agent = { workspace = true }
# Blocking client for the buwiz-server license check. rustls, no OpenSSL.
reqwest = { workspace = true }
# `--http`: a small blocking HTTP/1.1 server; no TLS (loopback only).
tiny_http = { version = "0.12", default-features = false }

# Desktop session from `bir-mcp login`. keyring 3.x stores nothing unless a
# backend feature is selected, same as bir-core.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
