[package]
name = "bir-print"
version = "0.2.1"
edition = "2021"
license.workspace = true
description = "eBIRForms print and frozen-HTML rendering."
repository = "https://github.com/hexuria/buwiz-forms"

[features]
# No default: the shipped NSH app and bir-cli use plain SQLite.
sqlcipher = ["bir-core/sqlcipher"]

[[bin]]
name = "verify_certification_pdf"
path = "src/bin/verify_certification_pdf.rs"

[dependencies]
bir-core = { path = "../bir-core", version = "0.2.1", default-features = false }
tempfile = "3.27.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
lopdf = "0.34"
schemars = "1.0"
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Tests keep out of the real data folder and keychain (bir-core's test-build rule).
bir-core = { path = "../bir-core", version = "0.2.1", default-features = false, features = ["test-support"] }
sha2 = "0.10"
