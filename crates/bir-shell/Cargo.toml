# Standalone workspace on purpose: `gpui-kit-assets` declares
# `links = "gpui-kit-default-icons"`, and Cargo allows only one version of a
# links crate per resolution graph. bir-desktop (gpui-kit 0.6) and this crate
# (gpui-kit 0.7.3) therefore cannot share the repository workspace lockfile.
# This manifest is its own root; it still path-depends on bir-core.
[workspace]

[package]
name = "bir-shell"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "gpui-shell host: mounts the JavaScript app/ UI on the QuickJS runtime"

[lib]
name = "bir_shell"
path = "src/lib.rs"

[[bin]]
name = "bir-shell"
path = "src/main.rs"

[features]
# GPUI Fast (https://gpui-kit.com/docs/installation/#optional-gpui-fast-backend):
# its retained rendering and layout engine in place of upstream GPUI, across
# gpui-shell, the Kit and the components together. The host imports GPUI only
# through `gpui_kit`, so one feature switches every layer; never mix a direct
# upstream `gpui` import with it.
gpui-fast = ["gpui-kit/gpui-fast", "gpui-shell/gpui-fast", "gpui-component/gpui-fast"]

[dependencies]
# gpui-shell is published only via the monorepo git (the crates.io `gpui-shell`
# 0.1.0 is an empty placeholder). All monorepo crates share ONE rev so the
# shell, kit, and component catalogs see the same gpui-pre 0.3.9 graph.
# `rev = a0230db` is master past tag v0.7.3 — the tag predates the `components`
# feature and the gpui-component script catalog.
gpui-shell = { git = "https://github.com/longbridge/gpui-component", rev = "a0230dbfc47c8a5c6d1f3f099529ff40b1d2e5d2" }
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "a0230dbfc47c8a5c6d1f3f099529ff40b1d2e5d2" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "a0230dbfc47c8a5c6d1f3f099529ff40b1d2e5d2" }
# Exact `=` pins: bir-desktop keeps gpui-pre 0.3.4 in the same lockfile, so both
# must resolve side by side.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
# In-app print preview (same monorepo rev as gpui-shell).
wry = { version = "0.53.3", package = "lb-wry" }
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "a0230dbfc47c8a5c6d1f3f099529ff40b1d2e5d2" }
raw-window-handle = "0.6"
# Blitz renders the static print sheet for the preview view.
blitz-dom = "=0.3.0-beta.3"
blitz-html = "=0.3.0-beta.3"
blitz-paint = "=0.3.0-beta.3"
blitz-traits = "=0.3.0-beta.3"
anyrender = "0.14"
anyrender_vello_cpu = { version = "0.18", features = ["multithreading"] }
peniko = "0.6"
base64 = "0.22"
image = { version = "0.25", default-features = false }
smallvec = "1"

bir-core = { path = "../bir-core" }
bir-print = { path = "../bir-print" }

anyhow = "1"
chrono = "0.4"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
serde_json = "1"
tracing = "0.1"
# The submission worker (`bir_core::background_cron`) runs on its own Tokio
# runtime, as in painted `bir` and `bir-headless`.
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Bridges the OS sign-in prompt (run on its own thread) into a host future.
futures = "0.3"

[dev-dependencies]
# Tests produce a current authenticator code for a generated secret.
totp-rs = "5.7.1"
# Host tests stage filed returns and failing writes with raw SQL.
bir-core = { path = "../bir-core", features = ["test-support"] }

# The monorepo's crates/shell/rquickjs-compat facade (a package named
# `rquickjs`) routes LLRT stdlib's crates.io rquickjs dependency onto the
# quickjs-jit VM gpui-shell actually runs. Without it two rquickjs_core
# versions collide (`ModuleDef` trait conflict).
[patch.crates-io]
rquickjs = { git = "https://github.com/longbridge/gpui-component", rev = "a0230dbfc47c8a5c6d1f3f099529ff40b1d2e5d2" }

# Admin recovery by OS sign-in (Touch ID / account password, Windows Hello);
# same crate and version as bir-desktop.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
robius-authentication = { version = "0.1.1", features = ["async"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSURL", "NSString", "NSGeometry", "NSKeyValueCoding", "NSDictionary"] }
objc2-app-kit = { version = "0.3.2", features = ["NSSharingService", "NSView", "NSResponder", "NSPrintInfo", "NSPrintOperation", "NSWindow", "NSGraphics"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "objc2-app-kit"] }
objc2-pdf-kit = { version = "0.3.2", features = ["PDFDocument", "PDFPage", "objc2-app-kit"] }

# Debug builds optimize the packages every frame runs through, so `just run`
# feels like the release app. This crate is its own workspace root, so the
# repository root's `[profile.dev.package."*"]` does not reach it, and a
# library cannot impose a profile on its host: every host repeats it. The list
# is the union of GPUI Kit's "Improve development runtime performance"
# (https://gpui-kit.com/docs/installation/#improve-development-runtime-performance)
# and gpui-shell's "Building for development" (website/shell/hosting.md).
# Without it the Form library measured 51 ms per script render and 12 frames a
# second while rebuilding in a debug build.
#
# quickjs-jit is a facade: the interpreter (`-sys`, C built through cc, which
# reads this opt-level) and the value bindings (`-core`) must be named
# themselves. gpui-shell is added to the upstream list because here it is a
# dependency: it records every builder call a script render makes and
# materializes the result into elements on scroll and hover.
[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
gpui-fast = { opt-level = 3 }
gpui-fast-platform = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
ropey = { opt-level = 3 }
lsp-types = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }
quickjs-jit = { opt-level = 3 }
quickjs-jit-runtime = { opt-level = 3 }
quickjs-jit-sys = { opt-level = 3 }
quickjs-jit-core = { opt-level = 3 }
cap-std = { opt-level = 3 }
gpui-shell = { opt-level = 3 }

# Blitz layout + raster is far too slow unoptimised; these are its hot crates.
blitz-dom = { opt-level = 3 }
blitz-html = { opt-level = 3 }
blitz-paint = { opt-level = 3 }
anyrender_vello_cpu = { opt-level = 3 }
vello_cpu = { opt-level = 3 }
vello_common = { opt-level = 3 }
stylo = { opt-level = 3 }
selectors = { opt-level = 3 }
parley = { opt-level = 3 }
fontique = { opt-level = 3 }
skrifa = { opt-level = 3 }
html5ever = { opt-level = 3 }

# Linux system packages. `target/release/bir` resolves inside this workspace's
# target dir (crates/bir-shell/target/<triple>/release) after
# scripts/alias_desktop_bin.py names the built bir-shell binary `bir`; `../../`
# reaches the repository root. app/ and print-overrides/ resolve under
# /usr/share/ebirforms at runtime — see src/packaged.rs. The runtime deps match
# bir-desktop's list: the shell also links webkit2gtk via lb-wry.
[package.metadata.deb]
name = "ebirforms"
maintainer = "Goldcoders Corp <support@goldcoders.dev>"
priority = "optional"
section = "utils"
depends = "$auto, libgtk-3-0, libwebkit2gtk-4.1-0, libvulkan1, libxkbcommon0, libwayland-client0, fontconfig, libfreetype6"
extended-description = """eBIRForms Desktop — Philippine BIR tax return filing application.
Supports form preparation, validation, submission via SFTP, email confirmation
tracking, and PDF generation for BIR Form 2551Q and related forms."""
assets = [
    ["target/release/bir", "usr/bin/ebirforms", "755"],
    ["../../app/**/*", "usr/share/ebirforms/app/", "644"],
    ["../../print-overrides/**/*", "usr/share/ebirforms/print-overrides/", "644"],
    ["../../assets/**/*", "usr/share/ebirforms/assets/", "644"],
    # Launcher + icon theme entries; file name, Icon= and StartupWMClass= are
    # the app id.
    ["../../assets/linux/dev.goldcoders.bir.desktop", "usr/share/applications/", "644"],
    ["../../assets/linux/icons/hicolor/**/*", "usr/share/icons/hicolor/", "644"],
]

[package.metadata.generate-rpm]
name = "ebirforms"
auto-req = "auto"
requires = { "libvulkan.so.1()(64bit)" = "", "libwebkit2gtk-4.1.so.0()(64bit)" = "" }
assets = [
    { source = "target/release/bir", dest = "/usr/bin/ebirforms", mode = "755" },
    { source = "../../app/**/*", dest = "/usr/share/ebirforms/app/", mode = "644" },
    { source = "../../print-overrides/**/*", dest = "/usr/share/ebirforms/print-overrides/", mode = "644" },
    { source = "../../assets/**/*", dest = "/usr/share/ebirforms/assets/", mode = "644" },
    { source = "../../assets/linux/dev.goldcoders.bir.desktop", dest = "/usr/share/applications/dev.goldcoders.bir.desktop", mode = "644" },
    { source = "../../assets/linux/icons/hicolor/**/*", dest = "/usr/share/icons/hicolor/", mode = "644" },
]
