[package]
name = "bir-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "bir"

[[bin]]
name = "bir"
path = "src/main.rs"

[features]
dev-tools = []
inspector = []
# Mac App Store variant. Not a platform: the same `target_os = "macos"` ships
# both a direct/notarized build and a sandboxed App Store build, so no
# `cfg(target_os)` can tell them apart. This selects the sandboxed one, which
# gives up the `global_hotkey` subsystem because App Store sandboxing forbids
# the entitlements it needs.
#
# The list is empty by design. `bir-core/mas_build` was a passthrough to an
# empty feature with no `cfg` behind it. `gpui_platform/macos_app_store` is gone
# because gpui-ce removes the private CoreGraphics Services APIs outright rather
# than gating them, so there is no renderer-side feature left to enable.
mas_build = []


[dependencies]
dotenvy = { workspace = true }
bir-core = { path = "../bir-core" }
bir-print = { path = "../bir-print" }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
gpui-rsx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
keyring = { workspace = true }
base64 = "0.22"
tracing-appender = "0.2.3"
tokio = { workspace = true }
chrono = { workspace = true }
rfd = "0.17.2"
open = "5.3.4"
directories = "6.0.0"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
uuid = { version = "1.23.1", features = ["v4"] }
sha2 = { workspace = true }
cron = "0.16.0"
tray-icon = "0.24.0"
image = "0.25.10"
smol = "2.0.2"
global-hotkey = "0.8"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
robius-authentication = { version = "0.1.1", features = ["async"] }
gpui-wry = { git = "https://github.com/longbridge/gpui-component", rev = "277f220a6196572116a8fd84fba6c36187094cab" }
wry = { version = "0.53.3", package = "lb-wry" }
raw-window-handle = { version = "0.6", features = ["std"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.5.2"
objc2-foundation = "0.2.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSMenu", "NSResponder", "NSRunningApplication", "NSWindow"] }
block2 = "0.6.2"
objc2-modern = { package = "objc2", version = "0.6.4" }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation-modern = { package = "objc2-foundation", version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSData", "NSError", "NSString"] }
objc2-app-kit-modern = { package = "objc2-app-kit", version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSWindow"] }
objc2-web-kit-modern = { package = "objc2-web-kit", version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "block2", "WKWebView", "WKPDFConfiguration"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38.2"
windows-core = "0.61"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    # `CreateMutexW` takes SECURITY_ATTRIBUTES, so it is gated behind
    # Win32_Security in windows 0.62 even though it lives under Threading.
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Wry's raw child host is X11-only.  The Linux preview uses it when the GPUI
# window has an X11 handle and uses an application-owned GTK/WebKit window on
# Wayland.  Both paths render the same locked-down offline document.
gpui-wry = { git = "https://github.com/longbridge/gpui-component", rev = "277f220a6196572116a8fd84fba6c36187094cab" }
wry = { version = "0.53.3", package = "lb-wry" }
raw-window-handle = { version = "0.6", features = ["std"] }
url = "2"
gio = "0.18.4"
glib = "0.18.5"
gtk = "0.18.2"
webkit2gtk = "2.0.1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"

[package.metadata.deb]
name = "ebirforms"
maintainer = "Goldcoders Corp <support@goldcoders.dev>"
priority = "optional"
section = "utils"
depends = "$auto, libgtk-3-0, libwebkit2gtk-4.1-0, libvulkan1, libxkbcommon0, libwayland-client0, fontconfig, libfreetype6"
extended-description = """eBIRForms Desktop — Philippine BIR tax return filing application.
Supports form preparation, validation, submission via FTP, email confirmation
tracking, and PDF generation for BIR Form 2551Q and related forms."""
assets = [
    ["target/release/bir", "usr/bin/ebirforms", "755"],
    ["../../assets/**/*", "usr/share/ebirforms/assets/", "644"],
]

[package.metadata.bundle]
name = "eBIRForms"
identifier = "dev.goldcoders.bir"
category = "public.app-category.finance"
short_description = "Philippine BIR tax return filing application"
osx_minimum_system_version = "13.0"
