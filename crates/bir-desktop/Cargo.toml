[package]
name = "bir-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "bir"

[[bin]]
name = "bir"
path = "src/main.rs"

[features]
layout-editor = []
dev-tools = []
inspector = []
mas_build = ["bir-core/mas_build", "gpui_platform/macos_app_store"]


[dependencies]
dotenvy = { workspace = true }
bir-core = { path = "../bir-core" }
bir-print = { path = "../bir-print" }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2.3"
tokio = { workspace = true }
chrono = { workspace = true }
rfd = "0.17.2"
open = "5.3.4"
directories = "6.0.0"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
uuid = { version = "1.23.1", features = ["v4"] }
cron = "0.16.0"
tray-icon = "0.24.0"
image = "0.25.10"
smol = "2.0.2"
global-hotkey = "0.8"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
robius-authentication = { version = "0.1.1", features = ["async"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = "0.2.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[package.metadata.deb]
name = "ebirforms"
priority = "optional"
section = "utils"
depends = "$auto, libvulkan1, libxkbcommon0, libwayland-client0, fontconfig, libfreetype6"
extended-description = """eBIRForms Desktop — Philippine BIR tax return filing application.
Supports form preparation, validation, submission via FTP, email confirmation
tracking, and PDF generation for BIR Form 2551Q and related forms."""
assets = [
    ["target/release/bir", "usr/bin/ebirforms", "755"],
    ["../../assets/**/*", "usr/share/ebirforms/assets/", "644"],
    ["../../formtypes/**/*", "usr/share/ebirforms/formtypes/", "644"],
]

[package.metadata.bundle]
name = "eBIRForms"
identifier = "dev.goldcoders.bir"
category = "public.app-category.finance"
short_description = "Philippine BIR tax return filing application"
osx_minimum_system_version = "13.0"
