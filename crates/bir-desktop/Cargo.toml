[package]
name = "bir-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "bir"

[[bin]]
name = "bir"
path = "src/main.rs"

[[bin]]
name = "bir-daemon"
path = "src/bin/bir_daemon.rs"

[dependencies]
bir-core = { path = "../bir-core" }
bir-print = { path = "../bir-print" }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
rfd = "0.17.2"
open = "5.3.4"
directories = "6.0.0"
zip = "2"
uuid = { version = "1.23.1", features = ["v4"] }
robius-authentication = { version = "0.1.1", features = ["async"] }
cron = "0.16.0"

[package.metadata.deb]
name = "ebirforms"
priority = "optional"
section = "utils"
depends = "$auto, libvulkan1, libxkbcommon0, libwayland-client0, fontconfig, libfreetype6"
extended-description = """eBIRForms Desktop — Philippine BIR tax return filing application.
Supports form preparation, validation, submission via FTP, email confirmation
tracking, and PDF generation for BIR Form 2551Q and related forms."""
assets = [
    ["target/release/bir", "usr/bin/ebirforms", "755"],
    ["target/release/bir-daemon", "usr/bin/ebirforms-daemon", "755"],
    ["../../assets/**/*", "usr/share/ebirforms/assets/", "644"],
    ["../../formtypes/**/*", "usr/share/ebirforms/formtypes/", "644"],
]

[package.metadata.bundle]
name = "eBIRForms"
identifier = "dev.goldcoders.bir"
category = "public.app-category.finance"
short_description = "Philippine BIR tax return filing application"
osx_minimum_system_version = "13.0"
