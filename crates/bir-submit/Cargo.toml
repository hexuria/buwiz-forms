[package]
name = "bir-submit"
description = "Submission queue client: device key, tickets, sealed payloads, receipts. Holds no BIR secrets."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Lab and test builds: honour the BUWIZ_TRUST_KEYS override in a release
# build. Never on in a build that ships.
lab = []

[dependencies]
base64 = "0.22"
chrono.workspace = true
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hpke = { version = "0.15", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
rand = "0.10.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
url = "2"

# The OS credential store for the device key and id, with the same
# backends bir-core uses for its database key. Android and iOS have none
# here: the secrets go to files in the app's private data dir instead.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

# iOS: the install id in the Keychain, and the files' protection and the
# data folder's backup exclusion (src/ios_storage.rs). Already in the graph
# through keyring's security-framework.
[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework-sys = "2.17"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }
