<!doctype html><html><head><meta charset="utf-8"><style>
/* Three devices, one height: iPhone (home) | Mac (home dashboard) | iPad (2551Q form). Transparent page. */
:root { --h: 640px; --bezel: #0d0e12; --rim: #8e939c; }
html, body { margin: 0; background: transparent; }
.stage { display: flex; align-items: flex-end; justify-content: center; gap: 56px; padding: 40px 48px 48px; width: max-content; }
.dev { position: relative; filter: drop-shadow(0 18px 30px rgba(0,0,0,.35)); }
.dev img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
/* iPhone 16 Pro: screen 1206x2622 */
.phone { height: var(--h); aspect-ratio: 1206 / 2622; box-sizing: border-box; padding: 11px; border-radius: 52px; background: var(--bezel);
  box-shadow: inset 0 0 0 2px var(--rim), inset 0 0 0 4px #1c1e24; width: calc(var(--h) * 1206 / 2622 + 22px * (1 - 1206 / 2622)); }
.phone .screen { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; position: relative; background: #fff; }
.phone .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 34%; height: 26px; border-radius: 14px; background: #000; }
/* iPad Pro 13": screen 2064x2752 */
.tablet { height: var(--h); box-sizing: border-box; padding: 18px; border-radius: 34px; background: var(--bezel);
  box-shadow: inset 0 0 0 2px var(--rim), inset 0 0 0 4px #1c1e24; width: calc((var(--h) - 36px) * 2064 / 2752 + 36px); }
.tablet .screen { width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: #fff; }
/* Mac display 16:10 with stand: same total height */
.mac { height: var(--h); display: flex; flex-direction: column; align-items: center; }
.mac .display { box-sizing: border-box; padding: 16px 16px 16px; border-radius: 18px; background: var(--bezel);
  box-shadow: inset 0 0 0 2px var(--rim), inset 0 0 0 4px #1c1e24; height: calc(var(--h) - 130px); aspect-ratio: auto;
  width: calc((var(--h) - 130px - 32px) * 1.6 + 32px); }
.mac .screen { width: 100%; height: 100%; border-radius: 6px; overflow: hidden; background: #fff; }
.mac .neck { width: 130px; height: 104px; background: linear-gradient(90deg, #b9bec6, #e6e9ee 45%, #c3c8cf); clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%); }
.mac .foot { width: 300px; height: 14px; border-radius: 3px 3px 8px 8px; background: linear-gradient(#e2e5ea, #b4b9c1); box-shadow: 0 6px 14px rgba(0,0,0,.25); }
</style></head><body><div class="stage">
  <div class="dev phone"><div class="screen"><img src="iphone.jpg" alt=""><div class="island"></div></div></div>
  <div class="dev mac"><div class="display"><div class="screen"><img src="desktop.jpg" alt=""></div></div><div class="neck"></div><div class="foot"></div></div>
  <div class="dev tablet"><div class="screen"><img src="ipad.jpg" alt=""></div></div>
</div></body></html>
