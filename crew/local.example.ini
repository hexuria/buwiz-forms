# Copy this file to crew.local.ini and adjust it for this machine. Every key is optional.

[crew]
# State folder; relative paths start at the repository root, and ~ expands to your home.
state_dir = .crew/state
# Git URL or remote name for shared crew state; empty means local-only state.
state_remote =
# Branch of the state remote that holds the shared crew state.
state_branch = crew/state
# This conductor's fleet holder name.
holder = conductor
# Default engine for `crew start`: claude or devin; empty picks the first one on PATH, claude first.
engine =

[engine.devin]
# Devin CLI command line.
command = devin
# Default Devin model for workers.
model = swe-2-1-max
# Devin CLI configuration copied into each worker's temporary permission config.
config = ~/.config/devin/config.json

[engine.claude]
# Claude Code CLI command line.
command = claude
# Default Claude model; empty means the Claude CLI's own default.
model =

[fleet]
# Command line that prints one machine per line as alias | kind | status | free-or-busy | holder | minutes | task.
command =
